  coaching_notes:
  - Stelle die Maschine so ein, dass die Kniegelenkachse exakt mit der Drehachse der
    Maschine fluchtet und das Polster knapp oberhalb des Sprunggelenks sitzt.
  - Spanne den Quadrizeps aktiv an und strecke das Knie kontrolliert, bis kurz vor
    die harte Endstellung, ohne das Gelenk aggressiv zu verriegeln.
  - Senke das Gewicht langsam und geführt ab, damit der Quadrizeps auch in der exzentrischen
    Phase unter Spannung bleibt.
  - Halte Gesäß, unteren Rücken und Oberschenkel stabil am Sitz; die Bewegung soll
    sauber aus der Knieextension kommen, nicht aus Schwung oder Ausweichen im Oberkörper.
  - Wähle eine ROM, in der du schmerzfrei arbeiten kannst, und halte Knie, Fuß und
    Oberschenkel in einer sauberen Linie über die gesamte Wiederholung.
  common_errors:
  - Zu hohes Trainingsgewicht, sodass die Wiederholung mit Schwung eingeleitet wird
    statt mit sauberer Muskelspannung.
  - Das Gewicht in der Abwärtsphase einfach fallen lassen und dadurch Spannung sowie
    Gelenkkontrolle verlieren.
  - Die Knie nicht korrekt zur Maschinenachse ausrichten, was unnötigen Druck auf
    das Gelenk erzeugen kann.
  - Am oberen Punkt hart ins Kniegelenk hineinschnappen, statt die Endstreckung muskulär
    zu kontrollieren.
  - Hüfte oder Gesäß vom Sitz abheben und mit dem Oberkörper ausweichen, um die letzten
    Grade der Bewegung zu erzwingen.
