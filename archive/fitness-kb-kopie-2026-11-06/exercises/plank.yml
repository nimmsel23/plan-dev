  original_description:
  - Mit dem Bauch auf den Boden legen und den Körper mit Unterarmen und Zehen abstützen.
    Beine, Rücken und Kopf sollten eine gerade Linie bilden.
  instructions:
  - Get into a prone position on the floor, supporting your weight on your toes and
    your forearms. Your arms are bent and directly below the shoulder.
  - Keep your body straight at all times, and hold this position as long as possible.
    To increase difficulty, an arm or leg can be raised.
