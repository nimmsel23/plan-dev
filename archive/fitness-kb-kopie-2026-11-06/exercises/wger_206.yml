  original_description:
  - 'Ausgangsposition: Stelle dich hüftbreit hin, die Hände entweder in der Hüfte
    oder mit Kurzhanteln seitlich am Körper.

    Der Schritt: Mache mit deinem rechten Bein einen weiten Schritt nach vorne.

    Die Abwärtsbewegung: Senke deine Hüfte, bis beide Knie etwa im 90-Grad-Winkel
    gebeugt sind.

    Der Übergang: Drücke dich über die vordere Ferse nach oben und führe den hinteren
    Fuß direkt nach vorne in den nächsten Ausfallschritt.'
  instructions:
  - Begin standing with your feet shoulder width apart and a barbell across your upper
    back.
  - Step forward with one leg, flexing the knees to drop your hips. Descend until
    your rear knee nearly touches the ground. Your posture should remain upright,
    and your front knee should stay above the front foot.
  - Drive through the heel of your lead foot and extend both knees to raise yourself
    back up.
  - Step forward with your rear foot, repeating the lunge on the opposite leg.
