  coaching_notes:
  - Starte aufrecht mit aktivem Rumpf, langem Nacken und leicht gespanntem Gesäß.
    Halte den Brustkorb über dem Becken gestapelt, damit du weder ins Hohlkreuz fällst
    noch im Oberkörper einknickst.
  - Setze jeden Schritt kontrolliert nach vorne und lande über einer stabilen, etwa
    hüftbreiten Spur statt auf einer imaginären Linie. Diese Breite verbessert Balance,
    Beckenstabilität und saubere Knieführung.
  - Wähle die Schrittlänge so, dass du unten in beiden Knien ungefähr 90 Grad erreichst,
    ohne dass das vordere Knie nach innen kollabiert oder die hintere Hüfte aufdreht.
    Ein zu kurzer Schritt verlagert die Last stark aufs vordere Knie, ein zu langer
    erschwert Kontrolle und Vortrieb.
  - Senke dich senkrecht zwischen beide Beine ab, statt nur nach vorne zu fallen.
    So bleiben Quadrizeps und Gesäß belastet, während die Lendenwirbelsäule und das
    vordere Knie besser kontrolliert werden.
  - Im unteren Punkt bleibt der gesamte vordere Fuß belastet, mit klarer Druckverteilung
    über Ferse, Großzehenballen und Kleinzehenballen. Diese Dreipunkt-Basis stabilisiert
    Knie und Fußgewölbe während der Gewichtsübernahme.
  - Drücke dich aus dem vorderen Bein nach oben und nach vorne, ohne dich mit dem
    hinteren Bein nur wegzuschieben. Den Hauptantrieb erzeugen Quadrizeps und Gesäß
    des vorderen Beins.
  - Halte das vordere Knie in Linie mit dem zweiten bis dritten Zeh. Denke daran,
    den Boden leicht auseinanderzuziehen, um Hüfte und Fuß aktiv zu stabilisieren.
  - Lass das Becken möglichst waagrecht und ruhig. Vermeide seitliches Wegkippen oder
    Rotationen, besonders beim Übergang in den nächsten Schritt.
  - Atme vor dem Absenken ein, baue Rumpfspannung auf und atme beim kraftvollen Hochkommen
    aus. Die Atmung soll Stabilität unterstützen, nicht den Bewegungsrhythmus stören.
  - 'Bevor du Last hinzufügst, muss jede Wiederholung gleich aussehen: stabile Schrittspur,
    saubere Tiefe, kontrollierte Gewichtsverlagerung und ruhiger Oberkörper. Erst
    dann sind Kurzhanteln, Kettlebell oder Langhantel sinnvoll.'
  common_errors:
  - Das vordere Knie fällt nach innen ein. Dadurch steigt die Belastung auf Knie und
    passive Strukturen, während Gesäß und Fußstabilität an Kontrolle verlieren.
  - Die Schrittspur ist zu schmal wie auf einem Seil. Das erschwert Balance unnötig
    und führt häufig zu Wackeln, Beckenrotation und unsauberer Knieachse.
  - Der Schritt ist zu kurz. Dadurch wandert das vordere Knie stark nach vorne, die
    Belastung verschiebt sich übermäßig auf den Quadrizeps und die Bewegung verliert
    Hüftanteil.
  - Der Schritt ist zu lang. So geht Spannung im unteren Punkt verloren, der Vortrieb
    stockt und die Beckenkontrolle leidet.
  - Der Oberkörper kippt nach vorne oder wird ins Hohlkreuz gedrückt. Beides reduziert
    die saubere Lastverteilung und macht die Bewegung im Rumpf unnötig instabil.
  - Es fehlt die volle Bewegungstiefe. Wenn das hintere Knie nur halb abgesenkt wird,
    sinken Trainingsreiz, Exzentrik und Kontrolle im Übergang zum nächsten Schritt.
  - Der Athlet stößt sich überwiegend über die Zehen des vorderen Fußes ab. Das reduziert
    die stabile Mittelfuß-Fersen-Belastung und nimmt dem Gesäß einen Teil seiner Arbeit.
  - Das Becken kippt oder rotiert bei jedem Schritt sichtbar. Das weist oft auf fehlende
    einbeinige Kontrolle oder mangelnde Rumpfspannung hin.
  - Die Wiederholungen werden hastig aneinandergereiht. Schwung ersetzt dann aktive
    Kontrolle, und die Qualität der Landung sowie der Knie- und Fußstabilität bricht
    ein.
  - Der Blick geht nach unten und die Körperhaltung kollabiert. Das verschlechtert
    Gleichgewicht, Atemmechanik und die aufrechte Organisation der gesamten Bewegung.
