  coaching_notes:
  - 'Starte aus dem aufrechten Stand und breche die Bewegung zuerst über die Hüfte
    ein: Gesäß aktiv nach hinten schieben, statt die Hantel über Kniebeugung abzusenken.'
  - Halte die Knie nur leicht gebeugt und diesen Winkel über weite Teile der Wiederholung
    nahezu konstant, damit die Last auf hinterer Kette und nicht auf einem Squat-Muster
    bleibt.
  - Führe die Hantel eng am Körper mit, damit der Lastarm kurz bleibt und die Spannung
    in Hamstrings, Gluteus und Rückenstreckern sauber gehalten wird.
  - Senke nur so tief ab, wie du Beckenposition und neutralen Rücken kontrollieren
    kannst; die Tiefe wird durch Hüftbeweglichkeit bestimmt, nicht durch das Bedürfnis,
    die Scheiben tiefer zu bringen.
  - Spanne die Latissimus-Muskulatur an, als würdest du die Hantel zu dir heranziehen;
    das stabilisiert Schultergürtel und Wirbelsäule unter Last.
  - Druck über Mittelfuß und Ferse halten und beim Hochkommen die Hüfte kraftvoll
    nach vorn führen, ohne am Ende in eine übertriebene Lendenstreckung zu fallen.
  - Den exzentrischen Teil bewusst kontrollieren, damit die Hamstrings unter Länge
    arbeiten; der Trainingsreiz entsteht hier stark über saubere Bremsarbeit, nicht
    nur über das Aufrichten.
  common_errors:
  - Zu starkes Beugen der Knie, wodurch die Übung biomechanisch in Richtung konventionelles
    Kreuzheben oder Kniebeuge kippt.
  - Die Hantel driftet vor den Körper, was den Hebel auf den unteren Rücken unnötig
    vergrößert und oft zulasten der Hamstring-Spannung geht.
  - Tiefe erzwingen, obwohl das Becken bereits nach hinten wegkippt oder der Rücken
    einrundet.
  - Oben hart ins Hohlkreuz drücken, statt die Wiederholung mit neutraler Wirbelsäule
    und voller Hüftstreckung zu beenden.
  - Aus den Armen ziehen oder die Schultern nach vorn hängen lassen, anstatt den Oberkörper
    über Lat-Spannung und aktive Schulterblätter zu organisieren.
  - Die Abwärtsphase fallen lassen und dadurch Kontrolle, Dehnungsspannung und reproduzierbare
    Technik verlieren.
  - Das Gewicht zu weit nach vorn auf die Zehen verlagern, wodurch Balance, Hüftmechanik
    und Kraftübertragung schlechter werden.
