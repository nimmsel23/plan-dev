  instructions:
  - For this exercise you will need to place a bench behind your back. With the bench
    perpendicular to your body, and while looking away from it, hold on to the bench
    on its edge with the hands fully extended, separated at shoulder width. The legs
    will be extended forward, bent at the waist and perpendicular to your torso. This
    will be your starting position.
  - 'Slowly lower your body as you inhale by bending at the elbows until you lower
    yourself far enough to where there is an angle slightly smaller than 90 degrees
    between the upper arm and the forearm. Tip: Keep the elbows as close as possible
    throughout the movement. Forearms should always be pointing down.'
  - Using your triceps to bring your torso up again, lift yourself back to the starting
    position.
  - Repeat for the recommended amount of repetitions.
  coaching_notes:
  - '**Vorbereitung:** Positioniere deine Hände schulterbreit am Rand der Bank, Finger
    nach vorne oder leicht zur Seite. Strecke deine Beine nach vorne aus, die Fersen
    bleiben am Boden oder du erhöhst die Intensität, indem du sie auf eine andere
    Erhöhung legst.'
  - '**Körperspannung:** Halte deinen Rumpf stabil und die Bauchmuskeln leicht angespannt,
    um ein Hohlkreuz zu vermeiden. Die Schultern bleiben während der gesamten Bewegung
    stabil und werden nicht hochgezogen.'
  - '**Abwärtsbewegung:** Senke deinen Körper langsam und kontrolliert ab, indem du
    die Ellbogen beugst. Die Ellbogen zeigen dabei nach hinten und bleiben eng am
    Körper. Gehe so tief, bis deine Oberarme parallel zum Boden sind oder ein 90-Grad-Winkel
    im Ellbogengelenk entsteht.'
  - '**Aufwärtsbewegung:** Drücke dich primär über deine Trizeps- und Brustmuskulatur
    nach oben, bis deine Arme fast vollständig gestreckt sind. Vermeide ein vollständiges
    Durchstrecken der Ellbogen, um die Spannung auf den Muskeln zu halten.'
  - '**Atmung:** Atme beim Absenken des Körpers ein und beim Hochdrücken aus.'
  common_errors:
  - '**Ellbogen nach außen:** Das Abspreizen der Ellbogen nach außen belastet die
    Schultergelenke unnötig und reduziert die Effektivität für Trizeps und Brust.
    Halte die Ellbogen eng am Körper und lass sie nach hinten zeigen.'
  - '**Schultern hochziehen:** Ein Hochziehen der Schultern zu den Ohren während der
    Bewegung überlastet die Nackenmuskulatur und kann zu Schulterbeschwerden führen.
    Halte die Schultern tief und stabil (Scapular Depression).'
  - '**Zu tief gehen:** Ein zu weites Absenken des Körpers (unter 90 Grad im Ellbogengelenk)
    kann die vorderen Schulterkapseln stark überdehnen und das Verletzungsrisiko erhöhen.
    Halte die Tiefe kontrolliert.'
  - '**Hohlkreuz:** Ein starkes Hohlkreuz während der Übung deutet auf mangelnde Rumpfspannung
    hin. Aktiviere deine Bauchmuskeln, um den Rücken zu stabilisieren und eine neutrale
    Wirbelsäulenposition beizubehalten.'
  - '**Schwung nutzen:** Die Bewegung sollte kontrolliert und ohne Schwung ausgeführt
    werden, um die Zielmuskulatur optimal zu beanspruchen und das Verletzungsrisiko
    zu minimieren.'
  original_description:
  - Greife die Stangen an einer engen Stelle und drücke dich hoch. Strecke dabei die
    Arme nicht ganz aus, dann bleiben während des gesamten Bewegungablaufs die Muskeln
    immer unter Spannung. Beuge nun die Arme und gehe so tief wie möglich runter,
    die Ellenbogen zeigen nach hinten. Du kannst an dieser Stelle einige Sekunden
    bleiben, bevor du die Übung weitermachst.
