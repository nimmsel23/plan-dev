  coaching_notes:
  - Starte aus einem festen Rack mit aufgerichtetem Oberkörper, gespanntem Rumpf und
    der Last über dem Mittelfuß.
  - 'Der Dip ist kurz und nahezu senkrecht: Knie gehen nach vorn, die Fersen bleiben
    am Boden, der Oberkörper kippt nicht nach vorn.'
  - Erzeuge den Schwung zuerst aus den Beinen und der Hüftstreckung; die Arme übernehmen
    erst, wenn die Last durch den Beinantrieb beschleunigt wurde.
  - Halte die Hantelbahn eng am Gesicht und schiebe den Kopf nach dem Passieren der
    Stirn aktiv zwischen die Arme.
  - Beende jede Wiederholung mit gestreckten Ellbogen, aktiven Schultern und stabilen
    Rippen, ohne ins Hohlkreuz auszuweichen.
  - 'Nutze den Push Press als Power-Bewegung: explosiv in der konzentrischen Phase,
    kontrolliert und sauber in die Rack-Position zurück.'
  - Bei Kurzhanteln beide Seiten synchron antreiben und verhindern, dass eine Schulter
    früher ausdreht oder höher endet als die andere.
  common_errors:
  - Zu tiefer Dip, der die Bewegung eher zu einer Frontkniebeuge mit anschließendem
    Pressen macht und den Rebound verschlechtert.
  - Dip nach vorn statt senkrecht, wodurch die Last vor den Mittelfuß gerät und die
    Hantelbahn unnötig nach vorn ausweicht.
  - Zu frühes Drücken mit den Armen, bevor der Beinantrieb abgeschlossen ist, sodass
    die Kraft aus Unterkörper und Hüfte verloren geht.
  - Ausweichen ins Hohlkreuz statt die Rippen unten und den Rumpf gespannt zu halten.
  - Fersen heben im Dip oder Drive zu früh ab, wodurch Stabilität und Kraftübertragung
    verloren gehen.
  - 'Kein aktiver Lockout über Kopf: weiche Ellbogen, fehlende Schulteraktivität oder
    die Last bleibt vor dem Körper.'
  - Kopf wird nur nach hinten gelegt, aber danach nicht wieder unter die Hantel gebracht,
    sodass keine stabile Überkopfposition entsteht.
