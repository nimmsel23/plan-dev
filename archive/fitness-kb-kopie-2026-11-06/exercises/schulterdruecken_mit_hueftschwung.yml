  original_description:
  - Bringe deine Kurzhanteln im Cleanen auf deine Schultern, die Handflächen zeigen
    nach innen. Atme ein und spanne deinen Rumpf an. (Bild 1) Gehe in die Knie und
    nutze deine Beine, um die Kurzhanteln (Bild 2) über den Kopf zu drücken. Senke
    sie kontrolliert und in langsamem Tempo wieder zu deinen Schultern ab und wiederhole.
