  original_description:
  - Stelle dich mit schulterbreitem Stand vor dem Kabelzug, beuge den Rücken sehr
    leicht nach vorn und greife das Seil. Ziehe nun nach unten, wobei die Ellenbogen
    sich während der ganzen Übung nicht von der Stelle bewegen sollen. Wenn die Arme
    ausgestreckt sind, drehe die Hände nach außen. Gehe langsam zur Ausgansposition
    zurück.
  instructions:
  - Attach a straight or angled bar to a high pulley and grab with an overhand grip
    (palms facing down) at shoulder width.
  - Standing upright with the torso straight and a very small inclination forward,
    bring the upper arms close to your body and perpendicular to the floor. The forearms
    should be pointing up towards the pulley as they hold the bar. This is your starting
    position.
  - Using the triceps, bring the bar down until it touches the front of your thighs
    and the arms are fully extended perpendicular to the floor. The upper arms should
    always remain stationary next to your torso and only the forearms should move.
    Exhale as you perform this movement.
  - After a second hold at the contracted position, bring the bar slowly up to the
    starting point. Breathe in as you perform this step.
  - Repeat for the recommended amount of repetitions.
