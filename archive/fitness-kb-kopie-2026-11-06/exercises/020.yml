  coaching_notes:
  - 'Starte aus einem aktiven Hang: Hals lang, Rippen unten, Schulterblätter zuerst
    sanft nach unten setzen statt passiv in den Schultern zu hängen.'
  - Denke daran, die Ellenbogen Richtung Flanken oder Hüfte zu ziehen. So bleibt der
    Zug aus Latissimus und oberem Rücken statt nur aus den Armen.
  - Halte den Körper als ruhige Linie von Kopf bis Fuß. Gesäß und Bauch leicht anspannen,
    damit kein Hohlkreuz oder Beinschwung entsteht.
  - 'Arbeite über die volle kontrollierte ROM: unten sauber strecken, oben den Brustkorb
    zur Stange bringen, ohne die Spannung im Rumpf zu verlieren.'
  - Führe den Obergriff mit stabilem Handgelenk und festem Griff aus. Die Stange soll
    tief in der Hand liegen, damit du die Zuglinie sauber halten kannst.
  - Lass die Schulterblätter während des Hochziehens nach unten und leicht nach hinten
    arbeiten, ohne die Schultern zu den Ohren hochzuziehen.
  - Steuere auch die Exzentrik bewusst. Ein langsames, sauberes Absenken verbessert
    Schulterkontrolle, Kraftaufbau und Positionsgefühl im Hang.
  - Der Obergriff verlagert die Belastung etwas stärker auf Latissimus, Teres major
    und oberen Rücken und etwas weniger auf den Bizeps als beim Chin-Up.
  common_errors:
  - Mit Kipping, Beinschwung oder Hüftschwung arbeiten statt jede Wiederholung aus
    dem Hang kontrolliert einzuleiten.
  - Aus einem passiven Hang hart anziehen, ohne zuerst Spannung im Schultergürtel
    aufzubauen.
  - Die Schultern zu den Ohren ziehen und damit Scapula-Depression und stabile Schultermechanik
    zu verlieren.
  - Nur das Kinn irgendwie über die Stange bringen, während Brustkorb, Schulterposition
    und Zuglinie kollabieren.
  - 'Halbe Wiederholungen machen: unten nicht ausstrecken oder oben zu früh abbrechen.'
  - Den Kopf nach vorne zur Stange schieben statt den Körper zur Stange zu ziehen.
  - Ins Hohlkreuz fallen oder die Rippen aufklappen lassen, wodurch der Rumpf instabil
    wird und die Kraftübertragung leidet.
  - Zu breit greifen und dadurch ROM, Schultermechanik und saubere Ellbogenführung
    unnötig verschlechtern.
