  original_description:
  - 'Stelle dich mit etwas mehr als schulterbreitem Stand vor der Stange, die Füße
    zeigen leicht nach außen, die Stange ist direkt darüber und sehr nahe am Schienbein.
    Beuge die Knie (zeigen ebenfalls etwas nach außen) und neige den Oberkörper (bleibt
    während der ganzen Übung gerade). Greife die Stange schulterbreit mit einem Unter-
    und einem Obergriff.

    Ziehe nun die Stange nach oben. An der höchsten Stelle mache ein leichtes Hohlkreuz
    und drücke die Schultern nach hinten. Gehe wieder runter, wobei du darauf achtest,
    dass der Rücken gerade bleibt und sich nicht krümmt. Du kannst unten angekommen
    eine kleine Pause einlegen oder sofort weitermachen.'
  instructions:
  - Stand in front of a loaded barbell.
  - 'While keeping the back as straight as possible, bend your knees, bend forward
    and grasp the bar using a medium (shoulder width) overhand grip. This will be
    the starting position of the exercise. Tip: If it is difficult to hold on to the
    bar with this grip, alternate your grip or use wrist straps.'
  - While holding the bar, start the lift by pushing with your legs while simultaneously
    getting your torso to the upright position as you breathe out. In the upright
    position, stick your chest out and contract the back by bringing the shoulder
    blades back. Think of how the soldiers in the military look when they are in standing
    in attention.
  - Go back to the starting position by bending at the knees while simultaneously
    leaning the torso forward at the waist while keeping the back straight. When the
    weights on the bar touch the floor you are back at the starting position and ready
    to perform another repetition.
  - Perform the amount of repetitions prescribed in the program.
