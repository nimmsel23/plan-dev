  coaching_notes:
  - '**Stabile Basis bilden:** Platziere den Scheitel deines Kopfes und deine Unterarme
    fest auf dem Boden, sodass du ein stabiles Dreieck bildest. Die Ellbogen sollten
    schulterbreit sein, die Hände entweder flach oder miteinander verschränkt, um
    eine maximale Auflagefläche zu schaffen.'
  - '**Nacken entlasten:** Drücke deine Unterarme und Hände aktiv in den Boden, um
    deine Schultern von den Ohren wegzuschieben. Das primäre Gewicht sollte auf den
    Unterarmen liegen, nicht auf dem Kopf, um den Nacken zu schützen.'
  - '**Core aktiv halten:** Aktiviere deine gesamte Rumpfmuskulatur stark, indem du
    den Bauchnabel zur Wirbelsäule ziehst und die Rippen schließt. Dies stabilisiert
    die Wirbelsäule, verhindert ein Hohlkreuz und ermöglicht einen kontrollierten
    Aufstieg.'
  - '**Kontrollierter Aufstieg:** Hebe die Beine langsam und bewusst an. Dies kann
    entweder durch Anziehen der Knie zur Brust geschehen (Tuck-Variante) oder, bei
    ausreichender Kraft, durch ein langsames Hochschweben der gestreckten Beine durch
    reine Core-Aktivierung.'
  - '**Gerade Körperlinie:** Richte den Körper von den Handgelenken über die Schultern
    und Hüften bis zu den Fersen aus. Halte die Beine und Füße aktiv gestreckt, als
    ob du dich zur Decke schiebst, um eine präzise vertikale Linie zu erreichen.'
  - '**Atemfluss bewahren:** Atme ruhig und gleichmäßig durch die Nase, um die innere
    Stabilität aufrechtzuerhalten und unnötige Verspannungen im Rumpf zu vermeiden.'
  - '**Sicherheitsvorkehrungen:** Übe den Kopfstand anfänglich immer an einer Wand
    oder mit einem erfahrenen Spotter, um Balance und Vertrauen sicher aufzubauen
    und das Sturzrisiko zu minimieren.'
  common_errors:
  - '**Zu viel Gewicht auf dem Kopf:** Die häufigste und gefährlichste Fehlhaltung.
    Führt zu übermäßiger Belastung und potenziellen Verletzungen der Halswirbelsäule,
    da die Unterarme nicht ausreichend in den Boden drücken.'
  - '**Kollabierende Schultern:** Schultern, die nicht aktiv nach oben geschoben werden
    und zu den Ohren sinken, was die Stabilität der gesamten Struktur beeinträchtigt
    und den Nacken zusätzlich belastet.'
  - '**Hohlkreuz oder Rundrücken:** Mangelnde Core-Aktivierung führt zu einer Instabilität
    der Wirbelsäule. Ein Hohlkreuz ist besonders gefährlich und belastet die Lendenwirbelsäule
    stark.'
  - '**Ausrutschende Ellbogen:** Eine zu breite oder instabile Ellbogenposition destabilisiert
    die Basis des Kopfstands und erschwert das Halten der Balance erheblich.'
  - '**Schwunghafter Aufstieg:** Das Hochschwingen der Beine statt eines kontrollierten
    Anhebens. Führt oft zu Kontrollverlust, einem unsauberen Stand und erhöhtem Sturzrisiko.'
  - '**Atem anhalten:** Das Pressen oder Anhalten des Atems führt zu unnötiger Spannung
    im Körper und beeinträchtigt die Fähigkeit zur feinen Balancekontrolle.'
  - '**Fehlende Rumpf- und Schulterkraft:** Ein Versuch des Kopfstands ohne ausreichende
    Vorbereitung der notwendigen Core- und Schulterkraft, wodurch die Ausführung unsicher
    wird und das Verletzungsrisiko steigt.'
