  coaching_notes:
  - '**Startposition:** Stelle dich aufrecht hin, die Füße schulterbreit auseinander
    und die Knie leicht gebeugt für eine stabile Basis. Halte in jeder Hand eine Kurzhantel
    mit gestreckten Armen neben dem Körper. Die Handflächen zeigen zueinander (neutraler
    Griff). Die Schultern sind leicht nach hinten und unten gezogen, der Blick ist
    nach vorne gerichtet.'
  - '**Ausführung (Konzentrisch):** Spanne den Rumpf fest an, um jegliches Schwungholen
    zu vermeiden. Halte die Ellbogen dicht am Körper fixiert. Atme aus und beuge die
    Arme, um die Hanteln in einem kontrollierten Bogen nach oben zu führen. Während
    der Aufwärtsbewegung drehst du die Handflächen progressiv nach oben (Supination),
    sodass sie am höchsten Punkt vollständig zur Decke zeigen. Konzentriere dich dabei
    auf eine maximale Kontraktion des Bizeps.'
  - '**Spitzenkontraktion:** Halte die Position am oberen Punkt der Bewegung für einen
    kurzen Moment, um die Bizepsmuskulatur intensiv zu spannen und den Reiz zu maximieren.'
  - '**Ausführung (Exzentrisch):** Atme langsam ein und senke die Hanteln kontrolliert
    und gegen den Widerstand der Schwerkraft in die Ausgangsposition zurück. Drehe
    dabei die Handflächen wieder in die neutrale Ausgangsposition. Achte darauf, dass
    die Abwärtsbewegung (exzentrische Phase) doppelt so lange dauert wie die Aufwärtsbewegung,
    um den Muskel effektiv zu ermüden.'
  common_errors:
  - '**Schwungholen (Cheating):** Einer der häufigsten Fehler ist das Mitschwingen
    des Oberkörpers oder der Einsatz der Knie, um die Gewichte nach oben zu befördern.
    Dies nimmt die Belastung vom Bizeps und erhöht das Verletzungsrisiko für den unteren
    Rücken. Halte den Rumpf während der gesamten Bewegung stabil und isoliere den
    Bizeps.'
  - '**Ellbogen bewegen:** Die Ellbogen sollten während der gesamten Übung fixiert
    und dicht am Körper gehalten werden. Ein Vorschieben der Ellbogen nach vorne oder
    ein Abspreizen vom Körper verlagert die Belastung auf die Schultern und verringert
    die Effektivität für den Bizeps.'
  - '**Unvollständiger Bewegungsumfang:** Die Arme am unteren Punkt nicht vollständig
    zu strecken oder die Hanteln nicht hoch genug zu führen, schränkt den vollen Bewegungsumfang
    ein. Für optimale Ergebnisse sollten die Arme am unteren Punkt fast vollständig
    gestreckt und die Hanteln am oberen Punkt bis zur Schulterhöhe gebracht werden.'
  - '**Fehlende Supination:** Das Drehen der Handflächen während der Aufwärtsbewegung
    (Supination) ist entscheidend für die maximale Aktivierung aller Köpfe des Bizeps,
    insbesondere des langen Kopfs. Wenn die Handflächen während der gesamten Bewegung
    neutral bleiben, wird der Trainingsreiz reduziert.'
  - '**Zu schnelles Ablassen des Gewichts:** Die exzentrische Phase, also das kontrollierte
    Ablassen des Gewichts, ist für den Muskelaufbau genauso wichtig wie die konzentrische
    Phase. Ein unkontrolliertes Herabfallenlassen reduziert den Reiz und die Effizienz
    der Übung erheblich.'
  original_description:
  - 'Halte zwei Kurzhantel mit ausgestreckten Armen neben dem Körper, die Handflächen
    zeigen nach innen. Beuge die Arme und brige die Hanteln mit einer schnellen Bewegung
    nach oben wobei sie gleichzeitig um 90 Grad gedreht werden. Am höchsten Punkt
    kann man die Hanteln ganz leicht weiter nach außen drehen. Ohne Pause wird das
    Gewicht nun kontrolliert nach unten gebracht. Beachte, dass die Bewegung nach
    oben schneller ist als nach unten.

    Während des Bewegungablaufs darf der Körper nicht mitschwingen. Die Ellenbogen
    bleiben dabei immer an der Stelle.'
