  id: yuhonas_hammer_curls
  name: Dumbbell Cross Body Hammer Curl
  display_name: Kurzhantel-Kreuzkörper-Hammercurls
  german: Kurzhantel-Kreuzkörper-Hammercurls
  english: Dumbbell Cross Body Hammer Curl
  category: pull
  equipment:
  - dumbbell
  primary_muscles:
  - 402_biceps_brachii
  - 403_brachialis
  - 404_brachioradialis
  secondary_muscles: []
  stabilizers:
  - 206_erector_spinae
  - 501_rectus_abdominis
  - 301_anterior_deltoid
  instructions:
  - Stand up with your torso upright and a dumbbell on each hand being held at arms
    length. The elbows should be close to the torso.
  - The palms of the hands should be facing your torso. This will be your starting
    position.
  - 'Now, while holding your upper arm stationary, exhale and curl the weight forward
    while contracting the biceps. Continue to raise the weight until the biceps are
    fully contracted and the dumbbell is at shoulder level. Hold the contracted position
    for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow
    stationary and only moving your forearm.'
  - After the brief pause, inhale and slowly begin the lower the dumbbells back down
    to the starting position.
  - Repeat for the recommended amount of repetitions.
  coaching_notes:
  - '**Ausgangsposition:** Stehen Sie aufrecht mit schulterbreitem Stand, die Kurzhanteln
    in neutraler Griffhaltung (Handflächen zeigen zueinander) seitlich am Körper.
    Die Ellenbogen sind nah am Oberkörper fixiert.'
  - '**Bewegungsausführung:** Heben Sie die Kurzhantel langsam und kontrolliert in
    einem Bogen über den Körper zur gegenüberliegenden Schulter. Konzentrieren Sie
    sich dabei auf die Kontraktion des Brachialis und Brachioradialis.'
  - '**Ellenbogenfixierung:** Der Oberarm bleibt während der gesamten Bewegung stabil
    und der Ellenbogen fungiert als Scharnier. Vermeiden Sie, den Ellenbogen nach
    vorne oder hinten zu verschieben.'
  - '**Spitzenkontraktion:** Halten Sie die Kontraktion am oberen Punkt kurz, um die
    Zielmuskulatur maximal zu spüren und eine starke Geist-Muskel-Verbindung aufzubauen.'
  - '**Exzentrische Phase:** Senken Sie die Hantel ebenso langsam und kontrolliert
    in die Ausgangsposition zurück. Widerstehen Sie dem Gewicht aktiv, um zusätzliche
    Trainingsreize zu setzen.'
  - '**Atmung:** Atmen Sie während des Hochziehens des Gewichts (konzentrische Phase)
    aus und während des Absenkens (exzentrische Phase) ein.'
  - '**Rumpfspannung:** Achten Sie auf eine stabile Rumpfspannung, um ein Schwungholen
    aus dem Rücken oder den Schultern zu vermeiden und die Isolation der Armmuskulatur
    zu gewährleisten.'
  common_errors:
  - '**Schwungholen:** Der häufigste Fehler ist das Verwenden von Schwung aus dem
    Rücken oder den Schultern, um das Gewicht nach oben zu bringen. Dies reduziert
    die Effektivität für die Zielmuskulatur und erhöht das Verletzungsrisiko.'
  - '**Ellenbogenbewegung:** Die Ellenbogen sollten nicht nach vorne oder hinten wandern.
    Sie müssen fixiert bleiben, um die Spannung auf den Bizeps, Brachialis und Brachioradialis
    zu halten.'
  - '**Unkontrollierte Abwärtsbewegung:** Das Gewicht einfach fallen lassen, statt
    es kontrolliert abzusenken, nimmt einen Großteil des Trainingsreizes. Eine langsame,
    exzentrische Phase ist entscheidend für den Muskelaufbau.'
  - '**Zu viel Gewicht:** Die Wahl eines zu hohen Gewichts führt oft zu einer schlechten
    Form, dem oben genannten Schwungholen und mindert die Effektivität der Übung.'
  - '**Mangelnde volle Kontraktion/Extension:** Die Bewegung nicht über den vollen
    Bewegungsumfang auszuführen, reduziert das Potenzial für Muskelwachstum. Achten
    Sie auf eine volle Streckung am unteren Punkt (ohne die Ellenbogen zu überstrecken)
    und eine maximale Kontraktion am oberen Punkt.'
  - '**Schulterhochziehen:** Wenn die Schultern während der Bewegung nach oben gezogen
    werden, deutet dies auf eine Überlastung oder mangelnde Stabilisierung hin. Halten
    Sie die Schultern entspannt und unten.'
