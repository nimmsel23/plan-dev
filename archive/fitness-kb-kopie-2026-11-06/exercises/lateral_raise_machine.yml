  coaching_notes:
  - Stellen Sie den Sitz so ein, dass die Drehachse der Maschine etwa auf Höhe Ihres
    Schultergelenks liegt. Die Polster sollten stabil an Unterarmen oder Ellenbogen
    anliegen, damit der Widerstand sauber in die Abduktion übertragen wird.
  - Nehmen Sie eine aufrechte Sitzposition ein, halten Sie Brustbein und Kopf neutral
    und erzeugen Sie leichte Spannung in Bauch und Rumpf. Der Oberkörper bleibt ruhig,
    ohne seitliches Ausweichen oder Rücklage.
  - Starten Sie aus der Schulter, nicht aus den Händen. Denken Sie daran, die Ellenbogen
    seitlich nach außen und leicht nach oben zu führen, statt das Gewicht nur irgendwie
    anzuheben.
  - Halten Sie die Ellenbogen leicht gebeugt und diesen Winkel während des Satzes
    möglichst konstant. So bleibt die Spannung auf dem Zielmuskel und unnötiger Stress
    auf Ellbogen und Handgelenke wird reduziert.
  - Führen Sie die Arme in der Skapularebene sauber nach außen. Eine neutrale bis
    leicht außenrotierte Schulterposition ist meist angenehmer für den subakromialen
    Raum als eine forcierte Innenrotation.
  - Heben Sie kontrolliert bis ungefähr Schulterhöhe oder knapp darunter, sofern Sie
    die Spannung auf dem seitlichen Deltamuskel halten können. Die Bewegung soll aus
    aktiver Schulterabduktion kommen, nicht aus einem Schulterzucken.
  - Lassen Sie die Schultern bewusst unten und lang, während sich die Schulterblätter
    natürlich mitbewegen dürfen. Ziel ist kontrollierte Aufwärtsrotation des Schulterblatts
    ohne dominantes Hochziehen in den Nacken.
  - Nutzen Sie ein moderates Tempo mit klarer exzentrischer Kontrolle. Gerade das
    langsame Absenken liefert viel Trainingsreiz und zeigt, ob Sie das Gewicht wirklich
    beherrschen.
  - Arbeiten Sie im schmerzfreien Bewegungsbereich. Wenn sich die Endposition vorne
    im Schulterdach unangenehm anfühlt, reduzieren Sie Bewegungsumfang, Last oder
    justieren die Sitz- und Armposition.
  - Atmen Sie beim Anheben aus und beim kontrollierten Absenken ein. Halten Sie den
    Rumpfdruck konstant, ohne ins Pressen oder Hohlkreuz zu kippen.
  common_errors:
  - 'Zu viel Gewicht: Wenn Sie die Last nur mit Schwung, Nackenspannung oder verkürztem
    Bewegungsradius bewegen können, ist sie zu schwer für saubere laterale Deltoid-Arbeit.'
  - 'Schultern hochziehen: Ein dominantes Shrugging verlagert die Arbeit vom seitlichen
    Deltamuskel auf den oberen Trapezius und nimmt der Übung ihren eigentlichen Fokus.'
  - 'Mit dem Oberkörper mitarbeiten: Seitliches Lehnen, Rücklage oder Rotieren des
    Rumpfs reduziert die Isolation und erhöht die Wahrscheinlichkeit für eine unsaubere
    Belastung der Schulter.'
  - 'Ellbogenwinkel ständig verändern: Starkes Beugen oder Strecken während der Wiederholung
    macht die Bewegung inkonsistent und verändert den Hebel unnötig.'
  - 'Zu hoch anheben: Wer deutlich über Schulterhöhe hinausgeht, verliert oft die
    Spannung im Zielmuskel und kompensiert über Nacken und Schulterblatthebung.'
  - 'Innenrotation erzwingen: Das klassische ''Wasser ausgießen'' kann bei vielen
    Trainierenden den Schulterraum ungünstig verengen und die Übung unnötig unangenehm
    machen.'
  - 'Absenkphase fallen lassen: Das unkontrollierte Zurückfallen der Arme verschenkt
    exzentrischen Reiz und erhöht die Gelenkbelastung am Umkehrpunkt.'
  - 'Falsch eingestellt sitzen: Wenn Sitzhöhe oder Maschinenachse nicht zum Schultergelenk
    passen, fühlt sich die Bewegung oft unnatürlich an und trifft den Zielmuskel schlechter.'
  - 'Zu kurzer Bewegungsweg: Sehr kleine Teilwiederholungen aus Bequemlichkeit reduzieren
    den Trainingsreiz, sofern sie nicht bewusst als Intensitätstechnik eingesetzt
    werden.'
  - 'Schmerz ignorieren: Stechender Schmerz an der Vorder- oder Oberseite der Schulter
    ist kein normales Brennen im Muskel und sollte nicht einfach ''weggedrückt'' werden.'
