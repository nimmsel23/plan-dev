  original_description:
  - 'Das Seitheben an der Maschine ist eine Isolationsübung für den seitlichen Anteil
    des Deltamuskels, die zur Stabilität an einer Maschine ausgeführt wird. Sie beansprucht
    die äußere Schulter, indem du Polster oder Griffe seitlich auf Schulterhöhe anhebst
    und dann langsam absenkst, wobei du die Ellbogen leicht gebeugt und den Trapezmuskel
    nach unten gezogen hältst, um den Fokus auf den Deltamuskel zu legen. Diese Übung
    hilft, Schulterbreite aufzubauen, indem sie Schwung verhindert und für konstante
    Spannung sorgt, was sie ideal für Anfänger oder als Abschlussübung macht.

    So führst du das Seitheben an der Maschine aus

    Aufbau: Stelle den Sitz so ein, dass deine Schultern auf einer Linie mit dem Drehpunkt
    der Maschine sind, deine Brust am Polster anliegt (oder dein Rücken, falls du
    nach außen gewandt bist) und deine Arme einen 90-Grad-Winkel mit den Polstern/Griffen
    bilden.

    Ausgangsposition: Umfasse die Griffe mit lockerem Griff, die Ellbogen leicht gebeugt
    und die Schultern nach unten (weg von den Ohren) gezogen.

    Hebephase: Atme aus und hebe deine Arme seitlich an, wobei du deine Oberarme nach
    außen bewegst, bis sie parallel zum Boden sind.

    Maximale Kontraktion: Halte oben kurz inne und spanne den seitlichen Deltamuskel
    an, ohne dabei die Schultern hochzuziehen.

    Senkphase: Atme ein und senke das Gewicht langsam und kontrolliert wieder ab,
    wobei du dem Gewicht auf dem Weg nach unten Widerstand entgegensetzt.'
  instructions:
  - Select a weight and hold the handle of the low pulley with your right hand.
  - Bend at the waist until your torso is nearly parallel to the floor. Your legs
    should be slightly bent with your left hand placed on your lower left thigh. Your
    right arm should be hanging from your shoulder in front of you and with a slight
    bend at the elbow. This will be your starting position.
  - Raise your right arm, elbow slightly bent, to the side until the arm is parallel
    to the floor and in line with your right ear. Breathe out as you perform this
    step.
  - Slowly lower the weight back to the starting position as you breathe in.
  - Repeat for the recommended amount of repetitions and repeat the movement with
    the other arm.
