  coaching_notes:
  - 'Ausführung


    Zugphase (konzentrisch):

    - Ziehe deine Ellbogen nach unten und hinten und deine Brust in Richtung der Hände.

    - Halte deine Schultern tief und zurückgezogen (vermeide ein Hochziehen der Schultern).

    - Konzentriere dich darauf, am oberen Punkt deinen Latissimus und oberen Rücken
    zusammenzudrücken.

    - Der neutrale Griff aktiviert mehr Bizeps als breiter Griff – nutze das bewusst.


    Obere Position:

    - Dein Kinn sollte die Höhe deiner Hände erreichen oder darüber hinausgehen (oder
    Brust an die Stange).

    - Halte kurz inne und spanne deinen Latissimus kräftig an.


    Senkungsphasen (Eccentric):

    - Fahre kontrolliert und langsam herunter, nicht fallen lassen.

    - Führe eine 2-3 Sekunden lange Senkungsphase durch für maximalen Muskelaufbau.


    Körperspannung:

    - Halte während der gesamten Bewegung deinen Kern angespannt (Bauch einziehen).

    - Vermeide exzessives Schaukeln oder Pendeln – das reduziert die Effektivität.'
  common_errors:
  - 'Unvollständige Range of Motion: Nicht bis zum vollständigen Dead Hang herunterfahren
    reduziert die Effizienz und Verletzungsschutz.'
  - 'Schulterzuckend statt Schulterblattrück: Hochziehen der Schultern zum Ohr aktiviert
    die Fallen unerwünscht und reduziert den Lats-Fokus.'
  - 'Zu viel Armkraft: Den Pull zu sehr über Bizeps-Kraft treiben, statt den Rücken
    anzuspannen, führt zu weniger Rückenentwicklung.'
  - 'Schaukeln und Schwung: Zu viel Bewegung beim Hüften oder Beinen kompensiert Schwäche
    und reduziert den Muskelaufbau.'
  - 'Zu breiter Griff bei neutralem Griff: Übertrieben breite Armstellung mindert
    die Bizeps-Aktivation, die beim neutralen Griff stärker sein sollte.'
  - 'Keine Kernaktivation: Fehlende Bauchspannung führt zu Auswölbung und Instabilität,
    besonders bei mehreren Wiederholungen.'
  - 'Zu schnelle Eccentric-Phase: Unkontrolliertes Herunterfahren verringert Muskelaufbau
    und erhöht Verletzungsrisiko.'
