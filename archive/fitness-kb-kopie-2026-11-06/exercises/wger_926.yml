  coaching_notes:
  - Stellen Sie Sitz und Griffposition so ein, dass die Hände beziehungsweise Unterarme
    auf Höhe der Brustmitte arbeiten und die Schultergelenke sauber mit der Maschinenachse
    fluchten.
  - Setzen Sie sich aufrecht an, halten Sie Brustbein angehoben und den oberen Rücken
    stabil an der Lehne, ohne ins Hohlkreuz auszuweichen.
  - Ziehen Sie die Schultern sanft nach unten und hinten und behalten Sie diese Spannung,
    damit die Brustmuskulatur die Bewegung führt und nicht der Nacken.
  - Halten Sie die Ellenbogen leicht gebeugt und lassen Sie diesen Winkel während
    des gesamten Satzes nahezu unverändert, damit die Übung eine echte Fly- und keine
    Druckbewegung bleibt.
  - Führen Sie die Arme in einem gleichmäßigen Bogen vor dem Körper zusammen und denken
    Sie daran, die Oberarme zueinander zu führen statt die Griffe nur mit den Händen
    nach innen zu ziehen.
  - Atmen Sie beim Zusammenführen aus und spannen Sie die Brust in der Endposition
    aktiv an, ohne die Spannung durch Anschlagen der Gewichte oder hektisches Überkreuzen
    zu verlieren.
  - Senken Sie das Gewicht langsam und kontrolliert ab, bis eine deutliche, aber schmerzfreie
    Dehnung in der Brust entsteht, ohne die Schulter nach vorn kippen zu lassen.
  - Wählen Sie ein Gewicht, mit dem Sie die Zielmuskulatur klar spüren und die exzentrische
    Phase sauber bremsen können; Qualität der Spannung ist hier wichtiger als Last.
  common_errors:
  - Zu schweres Gewicht verlagert die Arbeit von der Brust auf vordere Schulter, Arme
    und Schwung und verschlechtert die Gelenkposition.
  - Durchgedrückte oder sich stark verändernde Ellenbogen machen aus dem Butterfly
    eine Mischform aus Fly und Press und erhöhen unnötig die Belastung auf Ellenbogen
    und Schulter.
  - Nach vorn gezogene oder hochgezogene Schultern reduzieren die Brustarbeit und
    provozieren oft Druckgefühl im vorderen Schulterbereich oder im Nacken.
  - Zu kurzer Bewegungsumfang nimmt sowohl die Dehnung als auch die Endkontraktion
    aus der Übung und verschenkt einen großen Teil des Trainingsreizes.
  - Zu tiefes Zurückführen trotz fehlender Beweglichkeit kann die vordere Schulter
    überlasten; die Dehnung soll kontrolliert und schmerzfrei bleiben.
  - Gewichte abprallen lassen oder die Wiederholung mit Schwung einleiten nimmt Spannung
    aus dem Zielmuskel und erhöht die Belastung auf passive Strukturen.
  - Mit den Händen ziehen statt die Oberarme aktiv zusammenzuführen verschiebt den
    Fokus weg von der Brust und macht die Ausführung unpräzise.
  - Den Rücken von der Lehne lösen oder den Brustkorb übermäßig nach vorne schieben,
    um mehr Range of Motion zu erzwingen, verfälscht die Bewegung und mindert die
    Isolation.
