  display_name: Brustpresse im Sitzen
  german: Brustpresse im Sitzen
  category: chest
  primary_muscles:
  - 101_pectoralis_major
  secondary_muscles: []
  equipment:
  - bench
  coaching_notes:
  - Stelle die Brustpressmaschine so ein, dass die Griffe im Sitzen auf Höhe deiner unteren Brust sind.
    Achte darauf, dass dein Rücken flach an der Lehne anliegt. Greife in jede Hand einen Griff, schiebe
    die Brust heraus und halte den Kopf an der Kopfstütze. Atme tief ein und drücke die Griffe langsam
    nach vorne, bis deine Arme nahezu vollständig gestreckt sind. Halte kurz vor der vollständigen Streckung
    inne und führe die Griffe dann langsam in die Ausgangsposition zurück. Halte kurz inne, bevor die
    Griffe vollständig zur Ruhe kommen, und führe eine weitere Wiederholung aus.
  tags:
