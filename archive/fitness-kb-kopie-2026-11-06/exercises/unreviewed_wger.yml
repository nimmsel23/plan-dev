  display_name: Tate Press mit Kurzhanteln
  german: Tate Press mit Kurzhanteln
  category: arms
  primary_muscles:
  - 401_triceps_brachii
  secondary_muscles:
  - 101_pectoralis_major
  - 301_anterior_deltoid
  equipment:
  - bench
  - dumbbell
  coaching_notes:
  - 'Aufbau: Lege dich flach hin, mit einer Kurzhantel in jeder Hand. Strecke deine Arme gerade über deiner
    Brust nach oben, als wärst du am obersten Punkt eines Kurzhantel-Bankdrückens.

    Ausgangsposition: Positioniere die Kurzhanteln so, dass sie sich berühren oder dicht beieinander sind,
    mit einem Obergriff (Handflächen zeigen zu deinen Füßen und Daumen zueinander).

    Absenken: Ohne deine Oberarme oder Schultern zu bewegen, beugst du die Ellenbogen und spreizt sie
    seitlich nach außen ab. Senke die inneren Enden der Kurzhanteln zur Mitte deiner Brust.

    Berühren und Pause: Berühre mit den Kurzhanteln sanft deine Brust. Lege das Gewicht nicht auf deinem
    Körper ab; halte die Spannung im Trizeps konstant.

    Drücken: Strecke deine Ellenbogen kraftvoll, um die Kurzhanteln in die Ausgangsposition zurückzubringen.
    Konzentriere dich darauf, „die kleinen Finger zum Himmel zu drücken“, um die Beanspruchung des Trizeps
    zu maximieren.


    https://www.youtube.com/watch?v=IgSjoXbpy1M&amp;t=2'
