- exercise_id: wger_82
  display_name: Vorgebeugtes Seitheben
  german: Vorgebeugtes Seitheben
  category: shoulders
  primary_muscles: []
  secondary_muscles: []
  equipment:
  - bench
  - dumbbell
  coaching_notes:
  - 'Setze dich auf dem Rand einer Flachbank und beuge den Körper so weit nach vorne, dass er parallel
    zum Boden ist. Nehme nun die Hanteln und hebe sie seitwärts bis etwas über schulterhöhe. Gehe langsam
    wieder runter.

    Es ist wichtig, während der Übung, die Arme nicht nach vorn oder nach hinten zu bewegen, sie sollten
    stets einen rechten Winkel mit dem Körper haben. Wie beim Seitheben im Stehen, sollten sich die Handflächen
    nicht drehen, sie zeigen also immer zum Boden oder zum Körper.'
  tags:
  - unreviewed
  - wger
  wger_id: 82
  wger_muscle_ids:
    primary: []
    secondary: []
- exercise_id: wger_112
  display_name: Body-Ups
  german: Body-Ups
  category: arms
  primary_muscles: []
  secondary_muscles: []
  equipment:
  - none (bodyweight exercise)
  coaching_notes:
  - 'Nehmen Sie eine Dielenposition auf dem Boden ein. Sie sollten Ihr Körpergewicht auf Zehen und Unterarmen
    abstützen und Ihren Oberkörper gerade halten. Ihre Unterarme sollten schulterbreit auseinander liegen.
    Dies wird Ihre Startposition sein.

    Drücken Sie Ihre Handflächen fest in den Boden und strecken Sie sie durch die Ellbogen, um Ihren Körper
    vom Boden abzuheben. Halten Sie Ihren Oberkörper steif, während Sie die Bewegung ausführen.

    Lassen Sie Ihre Unterarme langsam wieder auf den Boden sinken, indem Sie die Ellbogen beugen.

    Wiederholen Sie diesen Vorgang nach Bedarf.'
  tags:
  - unreviewed
  - wger
  wger_id: 112
  wger_muscle_ids:
    primary: []
    secondary: []
