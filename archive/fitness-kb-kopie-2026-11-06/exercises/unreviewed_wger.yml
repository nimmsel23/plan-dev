    Achte darauf, dass dein Körper eine gerade Linie von Kopf bis Knie bildet. Die Hände sollten sich
    unter den Schultern befinden.

    Senke deinen Oberkörper Richtung Boden, indem du die Ellbogen beugst, während du den Rumpf stabil
    hältst. Halte die Knie in Kontakt mit dem Boden.

    Drücke dich über die Hände in die Ausgangsposition zurück. Achte darauf, am höchsten Punkt der Bewegung
    die Spannung in Brust-, Schulter- und Armmuskulatur zu halten.

    Führe die gewünschte Anzahl an Wiederholungen aus, kontrolliere die Bewegung und behalte eine saubere
    Ausführung bei.'
