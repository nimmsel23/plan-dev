- exercise_id: wger_1547
  display_name: Eselstritt mit Kurzhantel
  german: Eselstritt mit Kurzhantel
  category: legs
  primary_muscles:
  - 603_gluteus_maximus
  - 604a_biceps_femoris
  - 604b_semitendinosus
  - 604c_semimembranosus
  secondary_muscles: []
  equipment:
  - dumbbell
  coaching_notes:
  - 'Der Eselstritt mit Kurzhantel ist eine effektive Übung, um die Gesäßmuskulatur und die hintere Oberschenkelmuskulatur
    zu trainieren. Diese Übung wird in der Regel im Vierfüßlerstand ausgeführt, wobei eine Kurzhantel
    verwendet wird, um den Widerstand zu erhöhen. Im Folgenden werden die Schritte beschrieben, um sie
    korrekt durchzuführen.

    Ausgangsposition: Begib dich auf einer Matte in den Vierfüßlerstand, wobei deine Hände auf einer Linie
    mit den Schultern und deine Knie auf einer Linie mit den Hüften sind.

    Platzierung der Kurzhantel: Nimm eine Kurzhantel und klemme sie hinter dem Knie des Beins ein, das
    du anheben möchtest. Achte darauf, dass sie gut fixiert ist, damit sie während der Übung nicht herunterfällt.

    Übung:

    Atme ein und hebe beim Ausatmen das Bein mit der Kurzhantel nach oben, wobei du das Knie in einem
    90-Grad-Winkel gebeugt hältst.

    Hebe das Bein an, bis es parallel zum Boden ist, und spüre dabei die Kontraktion in der Gesäßmuskulatur.

    Halte die Position oben eine Sekunde lang und senke das Bein dann langsam in die Ausgangsposition
    zurück.

    Wiederholungen: Führe 10 bis 15 Wiederholungen pro Bein aus und achte dabei während der gesamten Übung
    auf eine saubere Ausführung.

    Sätze: Absolviere 2 bis 3 Sätze, je nach deinem Fitnesslevel.'
  tags:
  - unreviewed
  - wger
  wger_id: 1547
  wger_muscle_ids:
    primary:
    - 11
    - 8
    secondary: []
