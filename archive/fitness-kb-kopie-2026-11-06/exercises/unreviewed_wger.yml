  display_name: Frontheben Mit Scheibe
  german: Frontheben Mit Scheibe
  category: shoulders
  primary_muscles:
  - 202a_trapezius_upper
  - 202b_trapezius_middle
  - 202c_trapezius_lower
  - 301_anterior_deltoid
  - 303_posterior_deltoid
  secondary_muscles: []
  equipment: []
  coaching_notes:
  - 'Das Frontheben mit Gewichtsscheibe ist eine Variante des Fronthebens mit Kurzhantel, bei der du eine
    Gewichtsscheibe zwischen beiden Händen hältst, statt eine Kurzhantel, Langhantel oder ein anderes
    Gewicht zu verwenden. Es kann für Abwechslung in einem schulterbetonten Muskelaufbautraining sorgen
    oder Teil eines Oberkörper- oder Ganzkörper-Zirkels sein.


    Halte im aufrechten Stand eine Hantelscheibe mit beiden Händen auf der 3- und 9-Uhr-Position. Deine
    Handflächen sollten einander zugewandt sein, deine Arme gestreckt und mit einer leichten Beugung im
    Ellbogen fixiert, und die Scheibe sollte so weit wie möglich unten vor dir auf Höhe der Taille gehalten
    werden. Tipp: Die Arme bleiben während der gesamten Übung in dieser Position. Das ist deine Ausgangsposition.

    Hebe die Scheibe langsam an, während du ausatmest, bis sie etwas über Schulterhöhe ist. Halte die
    Kontraktion eine Sekunde lang. Während du einatmest, senke die Scheibe langsam wieder in die Ausgangsposition.

    Wiederhole für die empfohlene Anzahl an Wiederholungen.'
  tags:
  - unreviewed
  - wger
  wger_id: 254
  wger_muscle_ids:
    primary:
