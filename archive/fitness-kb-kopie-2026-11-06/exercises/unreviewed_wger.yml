    Spanne deine Rumpfmuskulatur an und beginne, den Schlitten so schnell wie möglich nach vorne zu schieben,
    wobei du die Kraft aus dem gesamten Bein nimmst. Strecke deine Hüfte und Knie, während du den Schlitten
    nach vorne bewegst. Deine Fußstellung sollte deiner natürlichen Laufposition entsprechen.'
