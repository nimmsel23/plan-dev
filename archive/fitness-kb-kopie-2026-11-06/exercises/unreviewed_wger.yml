  secondary_muscles: []
  equipment: []
  coaching_notes:
  - 'Befestige einen einzelnen Griff an einem niedrigen Kabelzug.

    Stelle dich nach Auswahl des richtigen Gewichts ein paar Schritte zurück in einen weiten Ausfallschritt-Stand.
    Dein Arm sollte gestreckt und deine Schulter nach vorne gerichtet sein. Dies ist deine Ausgangsposition.

    Führe die Bewegung aus, indem du die Schulter zurückziehst und den Ellenbogen beugst. Während du ziehst,
    supiniere das Handgelenk und drehe dabei die Handfläche nach oben.

    Kehre nach einer kurzen Pause in die Ausgangsposition zurück.'
