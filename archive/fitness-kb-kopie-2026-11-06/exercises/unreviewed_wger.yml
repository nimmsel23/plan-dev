- exercise_id: wger_351
  display_name: Seitheben zum Frontheben
  german: Seitheben zum Frontheben
  category: shoulders
  primary_muscles:
  - 202a_trapezius_upper
  - 202b_trapezius_middle
  - 202c_trapezius_lower
  - 302_lateral_deltoid
  - 303_posterior_deltoid
  secondary_muscles: []
  equipment:
  - dumbbell
  coaching_notes:
  - '-(1) Führe ein Seitheben aus und halte am höchsten Punkt der Bewegung kurz inne (2).

    -Anstatt das Gewicht abzusenken, führe es vor deinen Körper, sodass du dich scheinbar in der oberen
    Position eines Fronthebens befindest. Dies erreichst du mit einer Pec-Fly-Bewegung bei gestreckten
    Armen. (3)

    -Senke nun das Gewicht zu deinen Oberschenkeln ab, mit anderen Worten, senke die Kurzhanteln so, als
    würdest du eine Frontheben-Wiederholung abschließen. (4)

    -Kehre die Bewegung um: Führe ein Frontheben aus (5), nutze am höchsten Punkt der Bewegung eine umgekehrte
    Fly-Bewegung, um die Gewichte in die obere Position eines Seithebens zu bringen (6), und senke schließlich
    die Gewichte ab, bis deine Handflächen praktisch die Außenseiten deiner Oberschenkel berühren (7).
    DAS IST EINE WIEDERHOLUNG.

    (1) l Frontansicht (2) -l- FA (3) l- Seitenansicht (4) l SA/FA (5) l- SA (6) -l- FA (7) l FA/SA'
