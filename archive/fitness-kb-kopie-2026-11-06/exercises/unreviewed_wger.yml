  display_name: Liegendes Trizepsstrecken
  german: Liegendes Trizepsstrecken
  category: arms
  primary_muscles:
  - 401_triceps_brachii
  secondary_muscles: []
  equipment:
  - barbell
  - dumbbell
  coaching_notes:
  - 'Die Ausgangsposition für diese

    praktische Trizepsübung ist liegend auf einer normalen Bank, mit einer Langhantel oder zwei Kurzhanteln
    in beiden Händen im Obergriff, die Hände schulterbreit auseinander.

    Beginne mit den Armen über deiner oberen

    Brust und den Ellbogen in einem Winkel von etwa 45 Grad nach hinten gebeugt.

    Beuge zuerst die Ellbogen und

    lasse dann den Oberarm nach hinten sinken, sodass die Langhantel/Kurzhanteln hinter deinen

    Kopf und nach unten Richtung Boden kommen. Was die Oberarmposition betrifft, sollte sich die Langhantel/sollten
    sich die Kurzhanteln nie vollständig über deinem Kopf befinden, sondern hinter ihm, um

    sicherzustellen, dass du den Trizeps ansprichst.

    Halte die Schulterblätter unten

    eingezogen, die Ellbogen eng am Kopf und deine Rumpfmuskulatur während

    der gesamten Bewegung aktiv.'
  tags:
  - unreviewed
