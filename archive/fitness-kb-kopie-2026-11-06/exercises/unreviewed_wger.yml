- exercise_id: wger_1003
  display_name: Kettlebell Kreuzheben
  german: Kettlebell Kreuzheben
  category: back
  primary_muscles: []
  secondary_muscles: []
  equipment:
  - kettlebell
  coaching_notes:
  - 'Ausgangsposition:

    Stellen Sie sich hüftbreit auseinander, die Kettlebell befindet sich in der Mitte zwischen Ihren Knöcheln.
    Der Rücken sollte gerade sein, der Kopf nach vorne zeigen.

    Schritte:


    Beugen Sie sich in der Hüfte und gehen Sie leicht in die Knie, um die Hände auf die Kettlebell-Griffe
    zu legen. Der Rücken sollte gerade sein, während Sie die Bewegung ausführen.

    Greifen Sie die Kettlebell-Griffe und drücken Sie mit den Händen in entgegengesetzte Richtungen, als
    ob Sie die Griffe auseinanderziehen wollten.

    Während Sie Ihre Bauch- und Gesäßmuskeln anspannen, richten Sie sich auf.

    Beugen Sie sich wieder in die Hüfte, um die Kettlebell wieder nach unten zu bringen, ähnlich wie in
    Schritt 1.

    Wiederholen Sie den Vorgang ab Schritt 3.


    Tipps:


    Achten Sie darauf, dass Sie die Bewegungen korrekt ausführen, da dies sonst zu Verletzungen führen
    kann. Gehen Sie z.B. nicht in die Hocke statt in die Hüfte, machen Sie den Rücken nicht rund, wenn
    Sie nach der Kettlebell greifen, und lehnen Sie sich beim Aufstehen nicht zurück.'
  tags:
  - unreviewed
  - wger
