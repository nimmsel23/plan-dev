- exercise_id: wger_1680
  display_name: YTWL-Übung
  german: YTWL-Übung
  category: shoulders
  primary_muscles:
  - 202a_trapezius_upper
  - 202b_trapezius_middle
  - 202c_trapezius_lower
  - 301_anterior_deltoid
  - 303_posterior_deltoid
  secondary_muscles: []
  equipment:
  - dumbbell
  - incline bench
  coaching_notes:
  - 'Zweck: Verbessert die Schulterstabilität, die Haltung und die Kontrolle der Schulterblätter. Wird
    häufig in der Physiotherapie und beim Aufwärmen eingesetzt.

    Ausgangsposition:

    Stehe mit schulterbreit aufgestellten Füßen. Beuge dich aus der Hüfte nach vorne (wie beim

    Kreuzheben) und halte deinen Rücken gerade, oder lege dich mit dem Gesicht nach unten auf eine Schrägbank.

    Halte deine Daumen die ganze Zeit nach oben gerichtet.

    Y (Arme nach oben):

    Strecke beide Arme gerade nach vorne und oben in einem 135-Grad-Winkel zu

    deinem Körper, sodass sie ein „Y“ bilden. Ziehe deine Schulterblätter am

    obersten Punkt zusammen.

    T (Arme zur Seite): Öffne deine Arme gerade zur Seite, senkrecht zu deinem Körper, sodass sie ein
    „T“ bilden. Konzentriere dich darauf, deine Schulterblätter zusammenzuziehen.

    W (Arme gebeugt): Ziehe deine Ellenbogen zurück, beuge sie auf 90 Grad und ziehe deine Schulterblätter
    zusammen, sodass ein „W“ entsteht. Halte deine Handgelenke fest.

    L (Arme gedreht):

    Beginne mit auf 90 Grad gebeugten Ellenbogen, die nah am Körper sind. Drehe

    deine Unterarme nach außen (Außenrotation) wie einen Torpfosten, sodass ein

    „L“ oder ein Tor entsteht.

    Wichtiger Fokus:

    Die Bewegungen sollten langsam und kontrolliert sein. Führe stets mit den Daumen

    und denke daran, die Schulterblätter zu bewegen, nicht nur die Arme.'
  tags:
  - unreviewed
  - wger
  wger_id: 1680
  wger_muscle_ids:
    primary:
    - 2
    - 9
    secondary: []
