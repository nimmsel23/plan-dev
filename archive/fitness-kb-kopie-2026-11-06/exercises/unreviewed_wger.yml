  display_name: Vorgebeugtes Rudern mit Außenrotation
  german: Vorgebeugtes Rudern mit Außenrotation
  category: back
  primary_muscles: []
  secondary_muscles: []
  equipment: []
  coaching_notes:
  - 'Ausgangsposition:

    Stelle dich hinter einen Stuhl oder vor einen Tisch. Beuge dich in der Hüfte nach vorne, um deine
    Stirn auf die Rückenlehne des Stuhls oder den Tisch zu legen, wobei du den Rücken gerade hältst. Deine
    Arme sollten gerade nach unten hängen und zum Boden zeigen.

    Ablauf:


    Hebe deine Ellbogen auf Schulterhöhe. Deine Unterarme sollten nach unten zeigen, senkrecht zu deinen
    Oberarmen. Deine Oberarme sollten sich auf gleicher Höhe wie dein Rücken befinden und senkrecht zu
    deiner Wirbelsäule stehen.

    Halte kurz.

    Rotiere in den Ellbogen, um deine Hände so weit wie möglich nach oben zu bringen.

    Halte kurz.

    Rotiere in den Ellbogen zurück in die vorherige Position.

    Senke deine Arme in die Ausgangsposition.

    Wiederhole.'
