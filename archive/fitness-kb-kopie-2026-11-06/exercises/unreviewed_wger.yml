  display_name: Rollout mit der Langhantel
  german: Rollout mit der Langhantel
  category: core
  primary_muscles:
  - 502_obliquus_externus
  - 503_obliquus_internus
  secondary_muscles: []
  equipment:
  - barbell
  coaching_notes:
  - 'Lege eine Langhantel auf den Boden vor deine Füße.

    Beuge dich in der Hüfte und greife die Langhantel schulterbreit im Obergriff.

    Rolle die Stange in einer langsamen, kontrollierten Bewegung nach vorne aus, sodass dein Rücken gerade
    ist.

    Rolle wieder zurück und hebe dabei deine Hüfte und dein Gesäß an, während du in die Ausgangsposition
    zurückkehrst.'
