  display_name: Cable Pull Through
  german: Cable Pull Through
  category: legs
  primary_muscles:
  - 603_gluteus_maximus
  secondary_muscles:
  - 601_quadriceps_femoris
  - 604a_biceps_femoris
  - 604b_semitendinosus
  - 604c_semimembranosus
  - 701_gastrocnemius
  - 702_soleus
  equipment: []
  coaching_notes:
  - 'Der Cable Pull Through ist eine Übung für den Unterkörper, die mit einer „Hüftbeuge"-Bewegung (Hip
    Hinge) die Gesäßmuskulatur und die hintere Oberschenkelmuskulatur beansprucht. Um sie auszuführen,
    befestige ein Seil an der niedrigsten Einstellung des Kabelzugs, wende dich von der Maschine ab, sodass
    das Seil zwischen deinen Beinen verläuft, und mache einen Schritt nach vorne, um Spannung aufzubauen.
    Halte deinen Rücken flach und deine Knie leicht gebeugt und schiebe deine Hüften nach hinten, als
    wolltest du eine Tür hinter dir schließen, bis du eine tiefe Dehnung in deiner hinteren Oberschenkelmuskulatur
    spürst.

    Um die Wiederholung abzuschließen, schiebe deine Hüften explosiv nach vorne, um in die stehende Position
    zurückzukehren, und spanne dabei oben deine Gesäßmuskulatur kräftig an. Es ist wichtig, sich zu merken,
    dass dies keine Kniebeuge ist; deine Knie sollten sich nicht tief beugen, und deine Arme sollten gestreckt
    und entspannt bleiben und nur als Haken für das Seil dienen. Diese Bewegung sorgt für konstante Spannung
    auf der Gesäßmuskulatur und belastet dabei den unteren Rücken weniger als ein klassisches Kreuzheben.'
  tags:
  - unreviewed
  - wger
  wger_id: 1577
  wger_muscle_ids:
    primary:
