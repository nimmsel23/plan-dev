- exercise_id: wger_204
  display_name: Bizeps KH-Curls Schrägbank
  german: Bizeps KH-Curls Schrägbank
  category: arms
  primary_muscles:
  - 402_biceps_brachii
  secondary_muscles:
  - 403_brachialis
  equipment:
  - dumbbell
  coaching_notes:
  - 'Sitz auf einer ca. 45° nach hinten geneigten Schrägbank; Oberkörper und Kopf an die Rückenlehne angelehnt.

    Rumpfmuskulatur anspannen, Rücken bleibt gerade, Blick geradeaus.

    Die Kurzhanteln werden jeweils im neutralen Hammergriff gefasst (Handinnenflächen zeigen zueinander).
    Die Arme hängen, leicht gebeugt, seitlich herab. Durch die Neigung der Rückenlehne befinden sich die
    leicht gebeugten Arme hinter der Körperachse.

    Handgelenke in Verlängerung des Unterarms.

    Beugen und Strecken im Ellbogengelenk in einer gleichmäßigen, parallelen Bewegung nah am Körper vorbei;
    Dabei zeigt der Oberarm weiter nahezu unverändert senkrecht nach unten.

    Die Unterarme während der Beugephase entweder auswärts drehen (Supination), so dass in der Endposition
    die Handinnenfläche zum Körper hin zeigt bzw. die Kurzhantel im Untergriff gehalten wird oder ohne
    Auswärtsdrehung der Unterarme beugen, so dass in der Endposition der Daumen zum Körper zeigt bzw.
    die Kurzhantel im neutralen Hammergriff gehalten wird.

    Die Arme weder maximal beugen noch ganz durchstrecken.

    Bei der Spuinationsvariante werden die Unterarme in der Abwärtsbewegung wieder nac innen zurückgedreht.

    Richtige Atmung: Beim Beugen ausatmen, beim Strecken einatmen.'
  tags:
  - unreviewed
  - wger
  wger_id: 204
  wger_muscle_ids:
    primary:
    - 1
    secondary:
    - 13
