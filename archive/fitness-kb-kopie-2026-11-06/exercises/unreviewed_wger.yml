  display_name: Frontheben am Kabelzug mit kurzer Stange
  german: Frontheben am Kabelzug mit kurzer Stange
  category: shoulders
  primary_muscles:
  - 301_anterior_deltoid
  secondary_muscles: []
  equipment: []
  coaching_notes:
  - 'Das Frontheben am Kabelzug mit kurzer Stange isoliert deinen vorderen Deltamuskel (vordere Schulter)
    durch konstante Spannung. Dabei stehst du mit dem Rücken zu einem niedrigen Kabelzug, greifst die
    Stange im Obergriff und hebst sie mit leicht gebeugten Armen vor dir auf Schulterhöhe an, ohne zu
    schwingen, und hältst deinen Rumpf für eine kontrollierte Aufwärts- und Abwärtsbewegung angespannt.
    Verwende ein leichtes bis moderates Gewicht und konzentriere dich auf langsame, kontrollierte Wiederholungen,
    um den Muskel arbeiten zu spüren, nicht den Schwung.

    So führst du das Frontheben am Kabelzug (Stange) aus

    Aufbau: Befestige eine kurze gerade Stange an einem niedrigen Kabelzug. Stelle das Gewicht leicht
    bis moderat ein.

    Ausgangsposition: Stelle dich mit dem Rücken zur Maschine und halte die Stange im Obergriff (Handflächen
    nach unten) auf Hüfthöhe, die Arme gestreckt, aber nicht durchgedrückt. Die Füße schulterbreit, der
    Rumpf angespannt, die Schultern nach hinten und unten.

    Das Heben: Atme aus und hebe die Stange langsam gerade vor dir nach oben, wobei du eine leichte Beugung
    in den Ellbogen beibehältst, bis deine Hände Schulterhöhe (oder etwas darunter) erreichen.

    Das Halten: Halte oben kurz inne und spanne deinen vorderen Deltamuskel an.

    Das Absenken: Atme ein, während du die Stange langsam und kontrolliert in die Ausgangsposition zurückführst
    und dabei die Spannung beibehältst.'
  tags:
  - unreviewed
  - wger
  wger_id: 1571
  wger_muscle_ids:
    primary:
    - 2
    secondary: []
