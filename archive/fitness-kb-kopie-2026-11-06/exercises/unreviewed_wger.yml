  coaching_notes:
  - '-Lege dich auf den Rücken und hebe deine gestreckten Beine in einem Winkel von 45 Grad vom Boden
    ab.

    -Während dein linker Fuß nach unten wandert und den Boden fast berührt, sollte dein rechter Fuß einen
    Winkel von 90 Grad erreichen, oder so nah wie möglich daran.

    -Bringe deinen rechten Fuß nach unten, bis er den Boden fast berührt, und führe deinen linken Fuß
    nach oben. Halte die Beine während der gesamten Übung steif. Dein Kopf sollte vom Boden abgehoben
    bleiben, gestützt durch die angespannte obere Bauchmuskulatur.

    -(L hoch R runter, L runter R hoch, x2) ^v, v^, ^v, v^ = 1 Wiederholung

    -Beansprucht vor allem den geraden Bauchmuskel (Rectus abdominis), die Hüftbeuger und den unteren
    Rücken. Sekundär werden die seitlichen Bauchmuskeln (Obliques) beansprucht. Der Schwerpunkt liegt
    auf dem unteren Bereich der Bauchmuskulatur.'
