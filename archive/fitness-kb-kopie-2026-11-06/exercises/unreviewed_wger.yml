  coaching_notes:
  - 'Drop Curls in einer abgewandelten Position und in langsamem Tempo aktivieren effektiv den Brachialis
    für die Armbreite.

    Die Ausgangsposition ist mit beiden Armen in einem leichten Winkel zueinander auf Brusthöhe, mit einer
    Kurzhantel in jeder Hand. Senke eine Kurzhantel während der ersten Hälfte des Curls langsam und kontrolliert
    bis nahe an die vollständig gestreckte Armposition ab, curle sie dann wieder zurück in die Ausgangsposition,
    während die andere Kurzhantel in ihrer Ausgangsposition bleibt. Senke nun die andere Kurzhantel ab.
    So bleibt die Spannung auf dem Brachialis. Sobald wir auf dem Weg nach unten die 90-Grad-Marke passieren,
    übernimmt der Bizeps die Arbeit.'
