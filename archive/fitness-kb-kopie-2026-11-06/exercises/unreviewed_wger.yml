  coaching_notes:
  - Hampelmänner sind eine plyometrische Übung. Plyometrische Übungen sind explosive, aerobe Bewegungen,
    die Geschwindigkeit, Schnelligkeit und Kraft steigern und den ganzen Körper trainieren. Hampelmänner
    beanspruchen die Arme, Schultern, Bauchmuskeln, Hüftmuskeln und Hüftbeuger sowie die Oberschenkel,
    Kniesehnen und den vierköpfigen Oberschenkelmuskel (Quadrizeps). Sprünge sind gesundheitsfördernd,
    da sie Krafttraining mit Herz-Kreislauf-Training kombinieren. Da Sprünge den Puls erhöhen, können
    sie auch die kardiovaskuläre Fitness verbessern.
