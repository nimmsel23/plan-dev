  display_name: Kettlebell Sumo High Pull
  german: Kettlebell Sumo High Pull
  category: back
  primary_muscles:
  - 202a_trapezius_upper
  - 202b_trapezius_middle
  - 202c_trapezius_lower
  - 303_posterior_deltoid
  secondary_muscles:
  - 301_anterior_deltoid
  - 601_quadriceps_femoris
  - 603_gluteus_maximus
  - 604a_biceps_femoris
  - 604b_semitendinosus
  - 604c_semimembranosus
  equipment:
  - kettlebell
  coaching_notes:
  - 'Eine Verbundübung, die Elemente des Sumo-Kreuzhebens und des High Pull kombiniert. Sie beansprucht
    die hintere Kette, insbesondere die Gesäßmuskulatur, die hintere Oberschenkelmuskulatur und den oberen
    Rücken. Der Sumo-Stand erhöht die Hüftbeteiligung, während der High Pull ein explosives Element hinzufügt
    und so die Entwicklung von Kraft fördert.


    Stehe aufrecht über einer Kettlebell, die Füße weiter als schulterbreit und die Fußspitzen leicht
    nach außen gedreht.

    Halte deinen Rumpf während der gesamten Übung angespannt und die Wirbelsäule neutral.

    Beuge die Hüfte nach hinten und strecke die Arme, um die Kettlebell mit einem doppelten Obergriff
    zu greifen.

    Während deine Unterschenkel nahezu senkrecht zum Boden stehen, strecke die Hüfte, um die Kettlebell
    mit hohen Ellbogen anzuheben und sie dabei nah am Körper zu halten.

    Sobald die Kettlebell die Schulterhöhe erreicht hat, senke sie wieder in die Ausgangsposition ab.'
