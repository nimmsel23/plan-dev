- exercise_id: wger_1279
  display_name: Kabel-Fly am unteren Kabelzug
  german: Kabel-Fly am unteren Kabelzug
  category: chest
  primary_muscles:
  - 101_pectoralis_major
  secondary_muscles:
  - 301_anterior_deltoid
  equipment: []
  coaching_notes:
  - 'Stelle die Kabelmaschine ein: Setze den Kabelzug auf die niedrigstmögliche Position.

    Wähle deine Griffe: Du kannst Griffe mit neutralem Griff (Handflächen zueinander) oder gerade Griffe
    verwenden, je nach Vorliebe. Ein neutraler Griff ist möglicherweise schonender für deine Handgelenke.

    Stelle dich in der richtigen Haltung hin: Stelle dich mit schulterbreit aufgestellten Füßen hin, die
    Knie leicht gebeugt und die Rumpfmuskulatur angespannt. Halte während der gesamten Übung eine leichte
    Wölbung im unteren Rücken.

    Greife die Griffe: Greife die Griffe mit deinem gewählten Griff und gehe ein bis zwei kleine Schritte
    zurück, bis eine leichte Spannung auf den Kabeln liegt.

    Leite die Bewegung ein: Halte deine Ellbogen während der gesamten Übung leicht gebeugt. Stelle dir
    vor, du würdest jemanden fest umarmen. Spanne deine Brustmuskeln an, während du deine Hände vor deiner
    Brust zusammenführst.

    Kontrolliere die Bewegung: Konzentriere dich darauf, deine Brustmuskeln anzuspannen, statt mit deinen
    Armen die Griffe zu ziehen.

    Maximale Kontraktion: Halte die Anspannung kurz am oberen Punkt der Bewegung, mit deinen Händen zusammen
    auf Brusthöhe.

    Kehre langsam zurück: Löse langsam die Spannung und führe die Griffe wieder nach unten in die Ausgangsposition,
    mit leicht gestreckten, aber nicht durchgedrückten Armen.'
  tags:
  - unreviewed
  - wger
  wger_id: 1279
  wger_muscle_ids:
    primary:
    - 4
    secondary:
    - 2
