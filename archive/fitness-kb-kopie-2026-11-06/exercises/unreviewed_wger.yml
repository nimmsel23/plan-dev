- exercise_id: wger_623
  display_name: Unterarmtraining mit Rollstange im Stehen
  german: Unterarmtraining mit Rollstange im Stehen
  category: arms
  primary_muscles: []
  secondary_muscles: []
  equipment: []
  coaching_notes:
  - Greife eine Unterarmrolle mit beiden Händen, während du mit etwa schulterbreit auseinander stehenden
    Füßen stehst. Falls dein Fitnessstudio keine Unterarmrolle hat, kannst du ganz leicht selbst eine
    bauen. Alles, was du brauchst, ist eine Gewichtsscheibe mit 5 oder 10 Pfund, ein starkes, dünnes Seil
    von etwa 90 cm Länge und ein 15 bis 20 cm langer Stab oder eine Stange. Befestige das Seil sicher
    in der Mitte der Stange bzw. des Stabs und binde das andere Ende des Seils an die Gewichtsscheibe.
    Um diese Übung zu beginnen, greife die Stange bzw. den Stab mit beiden Händen im Obergriff. Strecke
    beide Arme gerade vor dir aus, parallel zum Boden. Rolle als Nächstes das Gewicht vom Boden hoch,
    indem du die Stange bzw. den Stab schnell mit deinen Händen und Handgelenken drehst. Sobald das Gewicht
    oben angekommen ist, senke die Scheibe langsam wieder zum Boden, indem du die Bewegung deiner Hände
    und Handgelenke umkehrst. Wiederhole (wenn du kannst!).
  tags:
  - unreviewed
  - wger
  wger_id: 623
  wger_muscle_ids:
    primary: []
    secondary: []
