  display_name: Archer-Klimmzug
  german: Archer-Klimmzug
  category: back
  primary_muscles:
  - 201_latissimus_dorsi
  secondary_muscles:
  - 202a_trapezius_upper
  - 202b_trapezius_middle
  - 202c_trapezius_lower
  - 303_posterior_deltoid
  - 402_biceps_brachii
  equipment: []
  coaching_notes:
  - 'Der Archer-Klimmzug ist eine fortgeschrittene Körpergewichtsübung, die deinen Rücken und Bizeps kräftigt
    und als Vorstufe zum einarmigen Klimmzug dient. Seinen Namen verdankt er der „bogenspannenden" Position,
    die dein Körper oben einnimmt. So führst du ihn aus: 1. Griff: Greife eine Klimmzugstange mit einem
    Obergriff, der breiter als schulterbreit ist. 2. Startposition: Hänge mit vollständig gestreckten
    Armen, spanne deine Rumpfmuskulatur an und halte deine Schulterblätter nach unten gezogen. 3. Der
    Zug: Ziehe deinen Körper zu einer Hand hoch, ähnlich wie bei einem normalen Klimmzug. Strecke gleichzeitig
    den anderen Arm zur Seite aus und halte ihn so gerade wie möglich. Dein Kinn sollte sich zur ziehenden
    Hand bewegen. 4. Halten &amp; Absenken: Halte kurz die obere Position, in der ein Arm gebeugt ist
    und zieht und der andere gestreckt ist. Senke dich langsam und kontrolliert zurück in die Startposition.
    5. Wechseln: Wiederhole die Bewegung und ziehe dich zur gegenüberliegenden Hand hoch. Der Schlüssel
    zu dieser Übung ist, den unterstützenden Arm so gerade wie möglich zu halten, um die Last auf dem
    arbeitenden Arm zu maximieren. Das macht sie zu einer anspruchsvollen, aber effektiven Übung für die
    einseitige Zugkraft.'
  tags:
  - unreviewed
  - wger
  wger_id: 1500
  wger_muscle_ids:
