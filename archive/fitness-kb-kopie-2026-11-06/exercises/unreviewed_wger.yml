- exercise_id: wger_423
  display_name: Muscle-up
  german: Muscle-up
  category: back
  primary_muscles:
  - 402_biceps_brachii
  - 604a_biceps_femoris
  - 604b_semitendinosus
  - 604c_semimembranosus
  secondary_muscles: []
  equipment:
  - pull-up bar
  coaching_notes:
  - 'Der Körper wird dann explosiv durch die Arme in einem kraftvollen Klimmzug nach oben gezogen, mit
    größerer Geschwindigkeit als bei einem normalen Klimmzug. Wenn die Stange sich der oberen Brust nähert,
    werden die Handgelenke rasch gebeugt, um die Unterarme über die Stange zu bringen. Der Körper wird
    nach vorne gelehnt und die Ellbogen werden durch Aktivierung des Trizeps gestreckt. Die Bewegung gilt
    als abgeschlossen, wenn die Stange auf Höhe der Taille ist und die Arme vollständig gestreckt sind.

    Zum Absteigen werden die Arme im Ellbogen gebeugt und der Körper zum Boden abgesenkt, und die Übung
    kann wiederholt werden.

    Da es sich um eine relativ fortgeschrittene Übung handelt, werden Muscle-ups in der Regel zunächst
    mit einem unterstützenden Kip erlernt. Die Beine schwingen (Kip) nach oben und liefern Schwung, um
    die explosive Aufwärtskraft zu unterstützen, die nötig ist, um über die Stange aufzusteigen. Fortgeschrittenere
    Athleten können eine strikte Variante des Muscle-ups ausführen, die langsam und ohne jeglichen Kip
    durchgeführt wird. Diese Variante beginnt aus einem ruhigen Dead Hang und nutzt isometrische Muskelkontraktion,
    um langsam und kontrolliert über die Stange aufzusteigen.'
  tags:
  - unreviewed
  - wger
  wger_id: 423
  wger_muscle_ids:
    primary:
    - 1
    - 11
    secondary: []
