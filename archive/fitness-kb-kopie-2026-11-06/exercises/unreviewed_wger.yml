- exercise_id: wger_1473
  display_name: Kabelzug-Fly für die untere Brust
  german: Kabelzug-Fly für die untere Brust
  category: chest
  primary_muscles:
  - 101_pectoralis_major
  secondary_muscles: []
  equipment: []
  coaching_notes:
  - 'Ausführung



    Startposition:


    Die Arme sind seitlich in einer „Y"-Form ausgestreckt.

    Spüre eine Dehnung in der Brust (leichte Beugung in den Ellenbogen — strecke sie nicht durch).




    Bewegung:


    Führe deine Hände nach unten und zusammen vor deiner unteren Brust oder oberen Bauchmuskulatur, in
    einer flüssigen Bogenbewegung.

    Drücke deine Brustmuskulatur unten für 1–2 Sekunden kräftig zusammen.




    Rückführung:


    Hebe deine Arme langsam auf demselben Weg wieder nach oben, bis du eine gute Dehnung in der Brust
    spürst.

    Bleibe kontrolliert — lass dich nicht zu schnell von den Gewichten zurückziehen.'
  tags:
  - unreviewed
  - wger
  wger_id: 1473
  wger_muscle_ids:
    primary:
    - 4
    secondary: []
- exercise_id: wger_1475
  display_name: Trizepsstrecken über Kopf
  german: Trizepsstrecken über Kopf
  category: arms
  primary_muscles:
  - 202a_trapezius_upper
  - 202b_trapezius_middle
  - 202c_trapezius_lower
  - 303_posterior_deltoid
  secondary_muscles: []
  equipment:
  - sz-bar
  coaching_notes:
  - 'Trizepsstrecken über Kopf mit der SZ-Stange – Kurzanleitung

    Die Position über Kopf betont den langen Kopf des Trizeps (weil er unter Last gedehnt wird), die Übung
    beansprucht jedoch alle drei Trizepsköpfe (langer, seitlicher und mittlerer) während der Streckung
    in gewissem Maße.


    Aufbau:

    Setze dich auf eine Bank (oder stehe) und halte eine SZ-Stange mit einem engen Obergriff. Hebe die
    Stange über den Kopf, die Arme vollständig gestreckt. Halte deinen Rumpf angespannt und die Ellenbogen
    nah am Kopf.

    Ausführung:

    Senke die Stange langsam hinter deinen Kopf, indem du die Ellenbogen beugst, bis sie etwa 90° erreichen.
    Halte die Ellenbogen nach vorne gerichtet (lass sie nicht nach außen ausscheren).

    Abschluss: Strecke deine Arme wieder nach oben in die Ausgangsposition und drücke deinen Trizeps oben
    zusammen.


    Tipps:


    Kontrolliere die Bewegung, um deine Schultern nicht zu überlasten.

    Verwende ein moderates Gewicht für den vollen Bewegungsumfang.

    Halte deinen Rücken gerade und vermeide ein Hohlkreuz.'
  tags:
  - unreviewed
  - wger
  wger_id: 1475
  wger_muscle_ids:
    primary:
    - 9
    secondary: []
- exercise_id: wger_1476
  display_name: Statisches Halten auf der Schrägbank
  german: Statisches Halten auf der Schrägbank
  category: chest
  primary_muscles:
  - 101_pectoralis_major
  secondary_muscles: []
  equipment:
  - dumbbell
  coaching_notes:
  - 'Ausführung



    Halteposition:


    Senke die Kurzhanteln bis wenige Zentimeter über deine Brust — etwa auf den Mittelpunkt eines normalen
    Schrägbankdrückens.

    Hier steht deine obere Brust unter maximaler Spannung.




    Statisches Halten:


    Halte die Position für 20–45 Sekunden und halte dabei die Brust angespannt.

    Atme langsam, bleibe aber unter Spannung — entspanne weder deine Brust noch deine Schultern.




    Satz beenden:


    Führe die Kurzhanteln nach dem Halten vorsichtig nach unten und ruhe dich aus.'
  tags:
  - unreviewed
  - wger
  wger_id: 1476
  wger_muscle_ids:
    primary:
    - 4
    secondary: []
