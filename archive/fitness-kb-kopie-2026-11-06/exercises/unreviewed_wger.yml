  - 402_biceps_brachii
  - 403_brachialis
  equipment: []
  coaching_notes:
  - 'Die Ausführung ist sehr ähnlich wie beim freien vorgebeugtem Rudern, nur ist hier die Stange fest.

    Stelle dich auf das Gerät in die entsprechende Stelle und greife die Gewichtsstange mit mittelbreitem
    Griff. Gehe etwas in die Knie, bringe die Brust raus und führe den Oberkörper nach vorne. Hebe das
    Gewicht und ziehe es in Richtung Bauchnabel hoch (Ellenbogen am Körper lassen). Lasse es dann langsam
    wieder runter und spüre die Dehnung in den Kreuzmuskeln.'
  tags:
  - unreviewed
  - wger
  wger_id: 513
  wger_muscle_ids:
    primary:
