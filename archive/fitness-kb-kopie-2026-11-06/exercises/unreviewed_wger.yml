- exercise_id: wger_1113
  display_name: Liegestütze | Parallettes
  german: Liegestütze | Parallettes
  category: chest
  primary_muscles:
  - 101_pectoralis_major
  secondary_muscles:
  - 301_anterior_deltoid
  - 401_triceps_brachii
  equipment: []
  coaching_notes:
  - 'Parallettes-Liegestütze sind eine Variante des klassischen Liegestützes, die mit den Händen auf parallelen
    Stangen, den sogenannten Parallettes, ausgeführt wird. Um einen Parallettes-Liegestütz auszuführen,
    nimmst du eine Liegestützposition ein, die Hände auf den Parallettes und die Füße auf dem Boden. Senke
    deinen Körper zum Boden, während du die Ellbogen nah am Körper hältst, und drücke dich dann wieder
    in die Ausgangsposition hoch.

    Parallettes-Liegestütze legen im Vergleich zu klassischen Liegestützen mehr Betonung auf Brust und
    Schultern, da sie einen größeren Bewegungsumfang im Schultergelenk ermöglichen. Dieser größere Bewegungsumfang
    kann auch helfen, die Stabilität und Beweglichkeit der Schulter zu verbessern. Außerdem beanspruchen
    Parallettes-Liegestütze die Rumpfmuskulatur stärker als klassische Liegestütze, da die Instabilität
    der Parallettes eine stärkere Aktivierung des Rumpfes erfordert, um die saubere Ausführung zu halten.

    Die zusätzliche Herausforderung, auf den Parallettes zu balancieren, erfordert außerdem mehr Kraft
    und Kontrolle im Oberkörper, wodurch Parallettes-Liegestütze eine fortgeschrittenere Variante des
    klassischen Liegestützes sind. Sie können eine großartige Möglichkeit sein, dich selbst herauszufordern
    und Abwechslung in dein Oberkörpertraining zu bringen. Achte wie immer auf eine saubere Ausführung
    und beginne mit einem Niveau, das zu deiner Kraft und deinem Fitnesslevel passt.'
  tags:
  - unreviewed
  - wger
  wger_id: 1113
  wger_muscle_ids:
    primary:
    - 4
    secondary:
    - 2
    - 5
