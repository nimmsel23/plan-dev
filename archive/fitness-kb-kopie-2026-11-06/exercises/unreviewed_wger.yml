  coaching_notes:
  - 'Schulterrotationen mit Kurzhantel sind darauf ausgelegt, die Muskulatur der Rotatorenmanschette zu
    stärken sowie die Stabilität und Mobilität der Schulter zu verbessern.


    Außenrotation: Halte eine Kurzhantel in einer Hand, den Ellbogen im 90-Grad-Winkel gebeugt und nah
    am Körper. Rotiere deinen Unterarm nach außen, weg von deinem Körper, und halte dabei deinen Ellbogen
    ruhig. Kehre langsam in die Startposition zurück.

    Innenrotation: Halte eine Kurzhantel in einer Hand, den Ellbogen im 90-Grad-Winkel gebeugt und nah
    am Körper. Rotiere deinen Unterarm nach innen, zu deinem Körper hin, und kehre langsam in die Startposition
    zurück. Führe die Übung mit kontrollierten Bewegungen aus, um Verletzungen zu vermeiden.'
