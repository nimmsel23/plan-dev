  display_name: Sitzendes Rudern am Kabelzug
  german: Sitzendes Rudern am Kabelzug
  category: back
  primary_muscles: []
  secondary_muscles: []
  equipment: []
  coaching_notes:
  - 'Setze dich auf die Maschine, die Füße fest aufgesetzt und etwas mehr als schulterbreit. Drücke über
    die Fersen und spanne die Gesäßmuskulatur an. Greife den Kabelgriff.

    Sitze aufrecht mit leicht gebeugten Knien. Spanne Bauch und unteren Rücken an, um mit deinem Oberkörper
    einen rechten Winkel zum Boden zu halten.

    Rolle die Schultern nach hinten und unten. Ziehe sie beim Rudern zusammen und stelle dir vor, du würdest
    einen Stift zwischen ihnen einklemmen. Ziehe dabei den Griff zu dir heran, bis er knapp oberhalb deines
    Bauchnabels ankommt.

    Halte hier einen Moment inne, bevor du den Griff zurückführst, während du die Schulterblätter weiterhin
    zusammendrückst. Sobald du das Gewicht zum Stapel zurückgeführt hast, lass die Schulterblätter entspannen,
    ohne den Oberkörper nach vorne zu ziehen.

    Wiederhole die Bewegung.'
