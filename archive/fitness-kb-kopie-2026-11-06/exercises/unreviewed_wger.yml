  - 303_posterior_deltoid
  secondary_muscles:
  - 401_triceps_brachii
  equipment: []
  coaching_notes:
  - 'Der Reverse Butterfly am Kabel, auch als Cable Rear Delt Fly bekannt, ist eine Übung zur Kräftigung
    und Definition des Deltamuskels. Sie ist eine der besten Isolationsübungen für deinen Rücken und den
    hinteren Deltamuskel. Dieses Training beansprucht deine hinteren Deltamuskeln und nutzt dabei eine
    Reihe von Oberkörpermuskeln.


    Stelle das Gewicht und die Umlenkrollen auf die richtige Höhe ein. Du solltest die Rollen sehen können,
    denn sie sollten sich über deinem Kopf befinden.

    Greife mit deiner rechten Hand die linke Rolle und mit deiner linken Hand die rechte Rolle, sodass
    sie sich vor dir kreuzen. Hier beginnt deine Reise.

    Starte die Bewegung, indem du deine Arme vor- und zurückbewegst und dabei die Arme gestreckt hältst.

    Halte am Ende der Bewegung einen kurzen Moment inne, bevor du die Griffe in ihre Ausgangsposition
    zurückführst.'
