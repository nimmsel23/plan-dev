  coaching_notes:
  - 'Der Plank ist eine Körpergewichtsübung. Als multifunktionale Bewegung beansprucht der Plank nicht
    nur deine Bauchmuskulatur, sondern auch die Wirbelsäule und die Hüfte. Der Plank kräftigt und strafft
    deinen gesamten Körper, verbessert deine Haltung und dein Gleichgewicht, reduziert Körperfett und
    kann dabei helfen, deinen Stoffwechsel anzukurbeln.

    Übungen wie die „Plank-Position“ helfen, die Ausdauer der stabilisierenden Bauchmuskulatur zu stärken.
    Sie können außerdem dabei helfen, Rückenschmerzen zu lindern, die mit einer geschwächten Funktion
    der stabilisierenden Muskeln des Körpers zusammenhängen.

    Planks sind eine vielseitige Übung, die viele der wichtigsten Muskelgruppen des Körpers beansprucht,
    sodass sie von jedem genutzt werden können, um die Ausdauer und die gesamte Körperkraft zu verbessern.'
