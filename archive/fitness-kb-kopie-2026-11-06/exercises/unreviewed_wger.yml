- exercise_id: wger_1131
  display_name: Gesäßstrecken am Kabelzug
  german: Gesäßstrecken am Kabelzug
  category: legs
  primary_muscles:
  - 603_gluteus_maximus
  secondary_muscles: []
  equipment: []
  coaching_notes:
  - 'Diese Übung ermöglicht es dir, den Bereich der oberen bzw. großen Gesäßmuskulatur zu trainieren.
    Deshalb darf sie in deiner Routine aus isolierten Übungen für die Gesäßmuskulatur nie fehlen.

    Stelle dich vor eine Kabelzugmaschine und suche den unteren Haken. Befestige ihn dann an den Fußschlaufen,
    um am unteren Kabelzug zu arbeiten. Was die Haltung betrifft, musst du jederzeit aufrecht bleiben.
    Achte besonders auf deinen Rücken, um ihn gerade zu halten und dich nicht zu verletzen.

    Es ist empfehlenswert, dich an der Maschine festzuhalten, um mehr Gleichgewicht zu haben. Führe mit
    dem Bein, das das Gewicht des Kabelzugs trägt, eine langsame Streckung nach hinten aus, ohne das Knie
    zu beugen.'
  tags:
  - unreviewed
  - wger
  wger_id: 1131
  wger_muscle_ids:
    primary:
