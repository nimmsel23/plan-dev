    indem sie auf die Gesäßmuskulatur, die Hüftbeuger, die vordere Oberschenkelmuskulatur, die hintere
    Oberschenkelmuskulatur und die Muskeln der Oberschenkelinnenseite wirken. Außerdem können Kniebeugen
