- exercise_id: wger_1136
  display_name: Latzug zur Brust mit neutralem Griff
  german: Latzug zur Brust mit neutralem Griff
  category: back
  primary_muscles:
  - 105_serratus_anterior
  - 201_latissimus_dorsi
  - 402_biceps_brachii
  secondary_muscles: []
  equipment: []
  coaching_notes:
  - 'Der Latzug zur Brust ist eine wichtige Übung, um den Rücken zu kräftigen und die Haltung zu verbessern,
    was zu einem gesünderen Leben beitragen kann. Um diese Übung korrekt auszuführen und Verletzungen
    zu vermeiden, ist es wichtig, einige zentrale Schritte zu befolgen:



    Stelle dich vor die Kabelzugmaschine, die Knie leicht gebeugt und die Füße auf dem Boden.



    Greife den Griff des Kabelzugs mit den Handflächen zueinander und den Händen schulterbreit auseinander.



    Ziehe den Griff nach unten, bis er die Brust berührt oder sich ihr nähert, und halte die Position
    ein bis zwei Sekunden.



    Führe den Griff langsam wieder in die Ausgangsposition nach oben und achte darauf, Arme und Hände
    gerade und den Rücken während der gesamten Bewegung gerade zu halten.'
  tags:
  - unreviewed
  - wger
  wger_id: 1136
  wger_muscle_ids:
    primary:
    - 1
    - 12
    - 3
    secondary: []
