  coaching_notes:
  - Geh in die Liegestützposition, deine Schultern befinden sich direkt über den Händen, deine Füße sind
    hüftbreit voneinander entfernt. Zieh den Bauchnabel in Richtung Wirbelsäule und spann die Bauchmuskulatur
