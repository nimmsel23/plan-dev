- exercise_id: wger_1419
  display_name: Kurzhantel-Rudern im Untergriff aus dem Dead Stop
  german: Kurzhantel-Rudern im Untergriff aus dem Dead Stop
  category: arms
  primary_muscles:
  - 402_biceps_brachii
  secondary_muscles:
  - 201_latissimus_dorsi
  equipment:
  - dumbbell
  coaching_notes:
  - 'Das Kurzhantel-Rudern im Untergriff aus dem Dead Stop beansprucht den Rücken, das heißt, du kannst
    etwas schwereres Gewicht ausprobieren. Der Haken ist, dass du das Gewicht über alle Wiederholungen
    kontrollieren können musst.


    Beginne, indem du ein Paar Kurzhanteln hältst, die Füße schulterbreit auseinander und die Knie leicht
    gebeugt.

    Beuge dich in der Hüfte nach vorne, um deinen Oberkörper abzusenken, bis er fast parallel zum Boden
    ist, halte dabei den Rücken gerade und die Knie leicht gebeugt.

    Atme aus, während du die Kurzhanteln seitlich bis auf Brusthöhe ruderst, dabei führen die Ellbogen,
    bis deine Oberarme knapp über parallel zum Boden sind und die Kurzhanteln sich auf Höhe des Brustkorbs
    befinden.

    Senke die Kurzhanteln langsam in die Ausgangsposition ab und wiederhole. Halte den Rücken die ganze
    Zeit gerade.'
  tags:
  - unreviewed
  - wger
  wger_id: 1419
  wger_muscle_ids:
