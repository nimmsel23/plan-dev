- exercise_id: wger_1481
  display_name: Ball Slams
  german: Ball Slams
  category: cardio
  primary_muscles:
  - 201_latissimus_dorsi
  - 501_rectus_abdominis
  - 502_obliquus_externus
  - 503_obliquus_internus
  secondary_muscles:
  - 301_anterior_deltoid
  - 603_gluteus_maximus
  equipment: []
  coaching_notes:
  - 'Stelle dich mit den Füßen etwa schulterbreit auseinander, die Knie und Hüften leicht gebeugt, und
    halte den Ball mit beiden Händen auf Brusthöhe. Spanne deine Rumpfmuskulatur an und behalte eine gute
    Haltung bei.

    Strecke deine Knie und schiebe deine Hüfte nach vorne, während du gleichzeitig den Ball anhebst. Strecke
    dich so groß wie möglich, der Ball über dem Kopf, die Arme nach oben, die Hüfte leicht nach vorne,
    und durch die Kraft deines Antriebs auf den Zehenspitzen.

    Nutze deine Rumpfmuskulatur und deine Arme, um den Medizinball mit so viel Kraft wie möglich gerade
    nach unten zwischen deine Füße zu schmettern. Drücke deine Hüfte zurück und beuge deine Knie, um den
    Schlag weiter zu verstärken. Atme aus, während du den Ball nach unten schmetterst.

    Gehe in die Hocke, um den Ball vom Boden aufzuheben, und gehe dann sofort in den nächsten Schlag über,
    indem du die Bewegung wiederholst. Wiederhole für Wiederholungen oder auf Zeit.'
  tags:
  - unreviewed
  - wger
  wger_id: 1481
  wger_muscle_ids:
    primary:
