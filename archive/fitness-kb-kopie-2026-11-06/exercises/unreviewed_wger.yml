- exercise_id: wger_977
  display_name: Box Squat
  german: Box Squat
  category: core
  primary_muscles:
  - 601_quadriceps_femoris
  - 603_gluteus_maximus
  - 702_soleus
  secondary_muscles: []
  equipment:
  - none (bodyweight exercise)
  coaching_notes:
  - 'Box aufstellen: Positioniere die Box hinter dir, etwa 90 cm von einem Kniebeugenständer entfernt,
    falls du eine Langhantel verwendest. Wähle eine Höhe, bei der du dich absenken und mit geradem Rücken
    die Gesäßmuskulatur sanft auf der Box auftippen kannst.

    Mit korrekter Haltung stehen: Stehe mit schulterbreit aufgestellten Füßen, die Fußspitzen leicht nach
    außen gedreht. Spanne deinen Rumpf an und halte den Rücken neutral. Wenn du eine Langhantel verwendest,
    lege sie auf Schulterhöhe ab.

    Absenken: Setze dich nach hinten, als würdest du dich auf einen Stuhl setzen, beuge die Knie und senke
    die Hüfte zur Box ab. Halte deinen Rumpf angespannt und den Rücken während der gesamten Bewegung gerade.

    Kontrolliertes Absenken: Senke dich kontrolliert ab, bis deine Gesäßmuskulatur die Box sanft berührt.
    Lass dich nicht fallen.

    Innehalten und hochdrücken: Halte unten kurz inne, mit geradem Rücken und angespanntem Rumpf. Drücke
    dich dann über die Fersen wieder in die Ausgangsposition hoch.


    Verbesserungen bei Koordination, Gleichgewicht und Ausdauer, Straffung der Bein- und Gesäßmuskulatur
    sowie eine allgemeine Steigerung der Knochendichte, die das Risiko einer Osteoporose verringert.'
