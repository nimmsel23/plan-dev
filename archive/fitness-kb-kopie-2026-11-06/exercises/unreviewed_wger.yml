  coaching_notes:
  - 'Setze dich auf eine Bank und greife eine Langhantel mit nach unten zeigenden Handflächen, die Hände
    schulterbreit auseinander. Lege deine Unterarme auf den Oberschenkeln ab und lass deine Handgelenke
    über die Knie hinausragen.

    Rolle deine Knöchel in Richtung deines Gesichts und hebe dabei die Langhantel an. Halte einen Moment
