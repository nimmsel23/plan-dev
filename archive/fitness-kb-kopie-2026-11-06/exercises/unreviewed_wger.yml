- exercise_id: wger_1208
  display_name: Prisoner Squat
  german: Prisoner Squat
  category: legs
  primary_muscles: []
  secondary_muscles: []
  equipment:
  - none (bodyweight exercise)
  coaching_notes:
  - Stell dich mit leicht angehobenem Brustkorb aufrecht hin, deine Füße sind hüftbreit voneinander entfernt,
    die Zehen zeigen gerade nach vorne. Nimm deine Hände mit leicht verschränkten Fingern an den Hinterkopf,
    die Ellbogen zeigen zur Seite. Schiebe deine Hüfte nach hinten und beuge deine Knie, der Oberkörper
    bleibt dabei so aufrecht wie möglich. Drück deine Knie nach außen, sie dürfen auf keinen Fall zueinanderzeigen.
    Wenn sich dein Oberkörper leicht nach vorne bewegt, achte darauf, dass er sich nicht krümmt. Halte
    die Ellbogen stets auf Höhe der Ohren, indem du die Muskeln zwischen deinen Schulterblättern anspannst.
    Wenn du beweglich genug bist, kannst du so weit nach unten sinken, bis dein Gesäß deine Waden berührt.
    Achte dabei aber darauf, dass du deine Wirbelsäule nicht krümmst. Bevor das passiert, kehrst du die
    Bewegung um und drückst dich aus deinen Fersen und Gesäßmuskeln mit so viel Schwung nach oben, dass
    deine Füße kurz abheben und du einen kleinen Hüpfer machst. Korrigiere gegebenenfalls die Position
    der Füße, Arme und des Oberkörpers, bevor du die nächste Wiederholung anschließt.
  tags:
  - unreviewed
  - wger
  wger_id: 1208
  wger_muscle_ids:
    primary: []
    secondary: []
