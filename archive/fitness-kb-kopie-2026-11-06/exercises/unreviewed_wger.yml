  display_name: Bankdrücken LH
  german: Bankdrücken LH
  category: chest
  primary_muscles:
  - 101_pectoralis_major
  secondary_muscles:
  - 301_anterior_deltoid
  - 401_triceps_brachii
  equipment:
  - barbell
  - bench
  coaching_notes:
  - 'Lege dich auf die Bank, die Stange direkt über die Augen, die Knie etwas angewinkelt und die Füße
    fest auf dem Boden. Greife die Stange breit und lasse sie langsam und kontrolliert runter, dabei sollte
    die Stange kurz auf Brustwarzenhöhe den Körper berühren. Dann das Gewicht wieder hochdrücken bis die
    Arme durchgestreckt sind.

    Bei hohem Gewicht, empfielt sich natürlich einen Spotter zu haben, der einen hilft falls man die Stange
    nicht alleine hochdrücken kann.

    Mit der Breite des Griffs kann außerdem kontrolliert werden, welcher Bereich der Brust stärker belastet
    wird:


    breiter Griff: äußere Brustmuskeln

    enger Griff: innere Brustmuskeln und Trizeps'
