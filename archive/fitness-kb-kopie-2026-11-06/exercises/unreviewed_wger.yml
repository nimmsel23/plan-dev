  coaching_notes:
  - 'Belade den Schlitten mit 25 % deiner maximalen Last. Wenn du diese nicht kennst, wähle ein Gewicht,
    das du 10 Minuten lang mit kurzen Pausen schieben kannst. Anfänger können den Schlitten auch ohne
    Gewicht schieben.

