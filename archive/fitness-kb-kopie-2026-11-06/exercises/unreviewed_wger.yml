- exercise_id: wger_1293
  display_name: Dynamische Planche
  german: Dynamische Planche
  category: core
  primary_muscles:
  - 501_rectus_abdominis
  secondary_muscles:
  - 502_obliquus_externus
  - 503_obliquus_internus
  equipment:
  - none (bodyweight exercise)
  coaching_notes:
  - 'Beginne in einer Plank-Position, mit deinen Händen direkt unter deinen Schultern und deinen Füßen
    hüftbreit auseinander.

    Spanne deine Rumpfmuskulatur an, um deinen Körper in einer geraden Linie von Kopf bis Fuß zu halten.

    Beuge aus dieser Position deine Knie leicht und springe mit beiden Füßen nach innen, sodass du sie
    so nah wie möglich an deinen Rumpf bringst.

    Sobald deine Füße den Boden berühren, drücke dich kraftvoll ab, um erneut zu springen und in die Ausgangs-Plank-Position
    zurückzukehren.

    Wiederhole diese Sprungbewegung weiter und behalte während der gesamten Übung Kontrolle und Rumpfstabilität
    bei.

    Achte darauf, deine Atmung beim Springen gleichmäßig zu halten, atme tief und kontrolliere deine Atmung.

    Halte deinen Blick auf den Boden gerichtet, um eine korrekte Ausrichtung der Wirbelsäule zu wahren.

    Wiederhole die Sprünge für die gewünschte Dauer oder die für dein Trainingsprogramm empfohlene Anzahl
    an Wiederholungen.

    Um die Übung zu beenden, ruhe dich aus, indem du die Plank-Position löst, und dehne dann bei Bedarf,
    um deine Muskeln zu lockern.'
  tags:
  - unreviewed
  - wger
