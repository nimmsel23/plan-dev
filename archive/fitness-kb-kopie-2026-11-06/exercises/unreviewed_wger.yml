- exercise_id: wger_1686
  display_name: Umsetzen und Stoßen
  german: Umsetzen und Stoßen
  category: shoulders
  primary_muscles:
  - 301_anterior_deltoid
  secondary_muscles:
  - 601_quadriceps_femoris
  equipment:
  - barbell
  coaching_notes:
  - 'Der erste Zug: Hebe die Stange vom Boden bis auf Kniehöhe, indem du aus den Beinen arbeitest und
    den Winkel deines Rückens konstant hältst.

    Die "Power"-Position: Sobald die Stange die Mitte der Oberschenkel erreicht, ziehe explosiv die Schultern
    hoch und strecke die Hüfte, um vertikalen Schwung zu erzeugen.

    Das schnelle Umsetzen der Ellbogen: In der Fangphase drehst du die Ellbogen rasch unter die Stange,
    um ein "Ablagebrett" auf deinen vorderen Deltamuskeln zu schaffen.

    Das senkrechte Drücken: Drücke die Stange in einer geraden Linie nach oben; dein Kopf sollte sich
    leicht nach vorne schieben, sobald die Stange deine Stirn passiert, um die volle Streckung zu erreichen.'
  tags:
  - unreviewed
  - wger
  wger_id: 1686
  wger_muscle_ids:
    primary:
