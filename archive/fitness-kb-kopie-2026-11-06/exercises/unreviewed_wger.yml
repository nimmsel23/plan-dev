- exercise_id: wger_993
  display_name: 'Seilspringen: Grundsprünge'
  german: 'Seilspringen: Grundsprünge'
  category: cardio
  primary_muscles: []
  secondary_muscles: []
  equipment:
  - none (bodyweight exercise)
  coaching_notes:
  - 'Ausgangsposition:

    Füße dicht beieinander stellen, Knie leicht beugen, Kopf und Körper gerade halten, Ellenbogen angewinkelt
    halten, Arme öffnen.

    Schritte:


    Drehen Sie nur Ihre Handgelenke mit so viel Kraft, dass sich das Seil dreht.

    Springe gerade so hoch, dass das Seil unter deinen Füßen durchläuft.

    Wiederhole die Übung.


    Anmerkungen:

    Für diese Übung benötigen Sie ein Springseil. Achten Sie darauf, dass die Seillänge auf Ihre Körpergröße
    abgestimmt ist. Eine Möglichkeit, dies zu überprüfen, ist, beide Griffe mit einer Hand zu ergreifen
    und sich mit einem Fuß auf die Mitte des Seils zu stellen, das am Boden hängt. Wenn das Seil (ohne
    die Griffe) bis knapp unter Ihre Brust reicht, ist es richtig lang. Ein kürzeres Seil wäre gefährlich,
    da Sie sich daran stoßen könnten, und ein längeres Seil wäre schlecht für die Form.'
  tags:
  - unreviewed
  - wger
