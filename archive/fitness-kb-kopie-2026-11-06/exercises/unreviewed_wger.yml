  coaching_notes:
  - 'Ausgangsposition:

    Beginnen Sie in der aufrechten Liegestützposition, auch bekannt als die hohe Plank-Position.Die Hände
    sollten sich direkt unter den Schultern befinden.Halten Sie Ihren Kopf in einer Linie mit dem Rücken
    und schauen Sie zum Boden.Die Füße sollten etwa hüftbreit auseinander stehen.

    Die Schritte:


    Bewegen Sie ein Knie in Richtung Körpermitte zu den Ellbogen und lassen Sie das andere Bein gestreckt.

    In einer schnellen, hüpfenden Bewegung strecken Sie das gebeugte Bein aus und ziehen das andere Knie
    zum Körper.

    Wiederholen Sie Schritt 2 im Wechsel mit dem anderen Bein.


    Anmerkungen:

    Während der gesamten Übung sollte Ihr Rücken so gerade wie möglich bleiben - vermeiden Sie einen Buckel
    oder einen durchhängenden Rücken.'
