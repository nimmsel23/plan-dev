- exercise_id: wger_1762
  display_name: Einarmiges Trizepsdrücken am Kabelzug
  german: Einarmiges Trizepsdrücken am Kabelzug
  category: arms
  primary_muscles:
  - 401_triceps_brachii
  secondary_muscles:
  - 501_rectus_abdominis
  equipment: []
  coaching_notes:
  - 'Das einarmige Trizepsdrücken am Kabelzug ist eine einseitige Isolationsübung, die den Trizeps (Musculus
    triceps brachii) beansprucht. Da jeweils nur ein Arm arbeitet, hilft sie, Kraftunterschiede zwischen
    den Seiten auszugleichen, und beansprucht zugleich den Rumpf zur Stabilisierung.

    Ausgangsposition:

    Stelle dich mit Blick zur Kabelzugmaschine, die Füße schulterbreit. Befestige einen einzelnen Griff
    an der oberen Rolle. Greife den Griff mit einer Hand im Obergriff (pronierter Griff), der Ellbogen
    ist um etwa 90° gebeugt und nah am Körper. Halte deinen Rumpf angespannt und den Rücken gerade.

    Ausführung:

    Drücke den Griff in einer kontrollierten Bewegung nach unten, indem du den Ellbogen streckst, bis
    dein Arm vollständig gestreckt ist. Halte die Kontraktion unten 1 Sekunde lang und kehre dann langsam
    in die Ausgangsposition zurück.'
  tags:
  - unreviewed
  - wger
  wger_id: 1762
  wger_muscle_ids:
    primary:
    - 5
    secondary:
    - 6
