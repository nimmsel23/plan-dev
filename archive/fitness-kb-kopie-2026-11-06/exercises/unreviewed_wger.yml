  display_name: Skorpion-Kick
  german: Skorpion-Kick
  category: back
  primary_muscles: []
  secondary_muscles: []
  equipment:
  - none (bodyweight exercise)
  coaching_notes:
  - 'Geh in die Liegestützposition, deine Schultern befinden sich direkt über deinen Händen, deine Füße
    sind hüftbreit voneinander entfernt.

    Achte darauf, dass dein Körper vom Kopf bis zu den Fersen eine gerade Linie bildet.

    Nun zieh dein rechtes Knie Richtung Brust. Während das Knie gebeugt bleibt, hebst du dein rechtes
    Bein so weit wie möglich an, der rechte Unterschenkel zeigt gerade nach oben.

    Drehe jetzt deine Hüfte, sodass dein rechter Fuß über dein linkes Bein schwingt. Rotiere weiter und
    bewege den rechten Fuß so weit Richtung Boden, bis du gezwungen bist, auf die Außenseite deines linken
    Standfußes zu rollen. Achte darauf, dass du den Oberkörper nicht mitdrehst.

    Kehre nun in die Ausgangsposition zurück und wiederhole die Übung mit dem linken Bein.'
  tags:
  - unreviewed
  - wger
