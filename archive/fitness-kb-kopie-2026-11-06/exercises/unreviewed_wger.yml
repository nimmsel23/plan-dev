- exercise_id: wger_1614
  display_name: Tiefe Kniebeuge mit Langhantel
  german: Tiefe Kniebeuge mit Langhantel
  category: legs
  primary_muscles:
  - 601_quadriceps_femoris
  - 603_gluteus_maximus
  - 604a_biceps_femoris
  - 604b_semitendinosus
  - 604c_semimembranosus
  secondary_muscles:
  - 501_rectus_abdominis
  - 701_gastrocnemius
  equipment:
  - barbell
  coaching_notes:
  - 'Die tiefe Kniebeuge mit Langhantel ist eine Grundübung, die mehrere Muskelgruppen im Unterkörper
    anspricht, darunter die vordere Oberschenkelmuskulatur, die hintere Oberschenkelmuskulatur und die
    Gesäßmuskulatur.

    Eine korrekte Ausführung ist entscheidend, um die Ergebnisse zu maximieren und Verletzungen während
    der tiefen Kniebeuge mit Langhantel zu vermeiden. Dazu gehören ein schulterbreiter Stand, eine Ganzkörperspannung,
    ein kontrolliertes Absenken sowie die richtige Tiefe und Knieposition.

    Hilfsübungen wie die Frontkniebeuge, die Goblet-Kniebeuge, die Split-Kniebeuge und die bulgarische
    Split-Kniebeuge können deine Leistung in der tiefen Kniebeuge mit Langhantel verbessern, indem sie
    bestimmte Muskelgruppen ansprechen und die Gesamttechnik verbessern.

    Um neue persönliche Rekorde in der Kniebeuge zu erreichen, steigere das Gewicht nach und nach, variiere
    die Wiederholungs- und Satzbereiche, um das Muskelwachstum zu stimulieren, und priorisiere Ruhe und
    Erholung zwischen den Trainingseinheiten.'
  tags:
