  equipment:
  - barbell
  coaching_notes:
  - 'Lege die Langhantel auf die Rückseite deiner Schultern. Stelle dich aufrecht hin und mache dann den
    ersten Schritt nach vorne. Der Schritt sollte dich so weit nach vorne bringen, dass das Knie deines
    stützenden Beins den Boden berühren kann. Richte dich anschließend wieder auf und wiederhole das Ganze
    mit dem anderen Bein.

    Denk daran, eine gute Körperhaltung zu bewahren.'
