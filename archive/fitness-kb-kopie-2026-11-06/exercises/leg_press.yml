  coaching_notes:
  - Setze Becken und gesamten unteren Rücken stabil an die Lehne und halte diese Position
    über den kompletten Satz, damit die Kraft sauber über Hüfte und Knie auf die Plattform
    übertragen wird.
  - Positioniere die Füße etwa hüft- bis schulterbreit mittig auf der Platte und richte
    Zehen und Knie in dieselbe Richtung aus, damit das Kniegelenk sauber geführt bleibt.
  - Senke den Schlitten kontrolliert ab, bis du eine tiefe, schmerzfreie Knie- und
    Hüftbeugung erreichst, ohne dass das Becken nach hinten kippt oder der Rücken
    rund wird.
  - Drücke die Plattform aus dem ganzen Fuß heraus und halte besonders Ferse und Großzehenballen
    in Kontakt, um Stabilität und gleichmäßige Kraftentfaltung zu sichern.
  - Lass die Knie in der Druckphase aktiv über dem Fuß mitlaufen und denke daran,
    den Schlitten wegzuschieben statt dich aus der Hüfte herauszuwinden.
  - Stoppe oben kurz vor der vollständigen Knieverriegelung, damit Spannung auf der
    Zielmuskulatur bleibt und du nicht passiv in die Gelenke hängst.
  - Nutze ein kontrolliertes Tempo mit ruhiger exzentrischer Phase und kraftvoller,
    aber technisch sauberer konzentrischer Phase statt den Schlitten federn zu lassen.
  - Wähle die Tiefe und Fußposition so, dass du den Quadrizeps belastest, ohne im
    unteren Umkehrpunkt die Position der Lendenwirbelsäule oder der Kniekontrolle
    zu verlieren.
  common_errors:
  - Das Becken kippt im unteren Punkt nach hinten und der untere Rücken löst sich
    von der Lehne, wodurch unnötiger Stress auf die Lendenwirbelsäule entsteht.
  - Die Knie fallen nach innen oder weichen unkontrolliert nach außen aus, anstatt
    sauber in Linie mit dem Fuß zu laufen.
  - Der Bewegungsumfang wird künstlich verkürzt, obwohl mehr saubere Tiefe möglich
    wäre, sodass Trainingsreiz und Gelenkkontrolle verschenkt werden.
  - Oben werden die Knie hart durchgedrückt und die Spannung geht aus Quadrizeps und
    Gesäß in eine passive Gelenkposition über.
  - Der Schlitten wird in der unteren Position abgefedert oder mit Schwung umgekehrt,
    statt die exzentrische Phase aktiv zu kontrollieren.
  - Die Füße stehen zu hoch, zu tief oder asymmetrisch auf der Plattform, sodass Druckverteilung,
    Kniepfad und Zielmuskulatur unnötig verfälscht werden.
  - Das Gewicht ist zu schwer gewählt, sodass nur noch halbe Wiederholungen, Hüftverschiebungen
    oder ein Verlust der Rumpfspannung möglich sind.
  - Die Last wird einseitig über Vorfuß oder Fersen verschoben, wodurch Stabilität
    verloren geht und die Kraftübertragung auf die Plattform schlechter wird.
