  coaching_notes:
  - '**Startposition:** Greife die Langhantel schulterbreit oder leicht weiter im
    Obergriff. Stelle dich hüftbreit mit leicht gebeugten Knien hin.'
  - Beuge den Oberkörper aus der Hüfte nach vorne, bis er annähernd parallel zum Boden
    ist, oder so weit wie deine Flexibilität es zulässt, ohne den Rücken zu krümmen.
  - Halte den Rücken gerade, bewahre die natürliche Krümmung der Wirbelsäule, Brust
    raus und Schultern aktiv zurückziehen. Der Blick ist leicht nach vorne unten gerichtet,
    um eine neutrale Kopfhaltung zu gewährleisten.
  - Die Arme sind vollständig zum Boden gestreckt. Spüre eine leichte Vordehnung im
    Latissimus.
  - '**Ausführung:** Ziehe die Hantel explosiv, aber kontrolliert zum Bauchnabel oder
    zur unteren Brust. Die Ellenbogen bleiben eng am Körper und werden nach hinten
    oben geführt.'
  - Ziehe die Schulterblätter am oberen Punkt der Bewegung bewusst und aktiv zusammen.
    Konzentriere dich darauf, die Bewegung primär aus dem Rücken (Latissimus und oberer
    Rücken) einzuleiten.
  - Halte am obersten Punkt kurz die Spannung, bevor du die Hantel kontrolliert und
    langsam wieder in die Ausgangsposition absenkst. Die Arme werden dabei vollständig
    gestreckt, um den vollen Bewegungsradius zu nutzen.
  - Der Oberkörperwinkel sollte während der gesamten Übung stabil bleiben und sich
    nicht aufrichten oder weiter beugen.
  - '**Atmung:** Atme ein, während du die Hantel absenkst, und atme kraftvoll aus,
    während du die Hantel nach oben ziehst.'
  common_errors:
  - '**Rundrücken:** Ein Krümmen des oberen oder unteren Rückens während der Übung.
    Dies erhöht das Verletzungsrisiko für die Wirbelsäule. Achte auf eine neutrale
    Wirbelsäulenposition durch aktive Rumpfspannung.'
  - '**Schwung holen / Zu viel Gewicht:** Die Hantel wird durch ein starkes Auf- und
    Abwippen des Oberkörpers hochgerissen, anstatt sie kontrolliert aus der Rückenmuskulatur
    zu ziehen. Reduziere das Gewicht und konzentriere dich auf die Muskelkontraktion.'
  - '**Ellenbogen weit vom Körper:** Wenn die Ellenbogen zu weit nach außen gehen,
    wird die Belastung vom Latissimus auf die Schultern (hintere Deltamuskeln) und
    den oberen Trapezius verlagert. Halte die Ellenbogen eng am Körper.'
  - '**Unvollständiger Bewegungsradius:** Die Hantel wird nicht weit genug hochgezogen
    oder die Arme werden beim Ablassen nicht vollständig gestreckt. Nutze den vollen
    Bewegungsbereich für maximale Muskelaktivierung.'
  - '**Schultern hochziehen (Shrug):** Ein aktives Hochziehen der Schultern während
    der Zugphase überbeansprucht die oberen Fasern des Trapezius und nimmt Spannung
    vom Latissimus. Die Schultern sollten während der Übung unten und hinten bleiben.'
  - '**Falsche Kopfhaltung:** Den Kopf stark in den Nacken legen oder übermäßig nach
    unten beugen kann zu Nackenbeschwerden führen. Halte den Kopf in einer neutralen
    Position, in Verlängerung der Wirbelsäule.'
  original_description:
  - 'Ausführung



    Startposition:


    Halte die Langhantel mit vollständig zum Boden gestreckten Armen.

    Halte die Spannung im Latissimus und in der Rückenmuskulatur.'
