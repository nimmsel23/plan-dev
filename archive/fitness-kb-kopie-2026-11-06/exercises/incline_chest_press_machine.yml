  coaching_notes:
  - Sitz so einstellen, dass die Griffe zu Beginn auf Höhe der oberen Brust liegen.
  - Brust und Kopf aufrecht, Schulterblätter nach hinten ziehen, Ellbogen leicht unter
    den Handgelenken führen.
  - Nicht die Schultern in Richtung Ohren schieben; die Bewegung schräg nach oben-vorn
    führen und kontrolliert zurückkommen.
  common_errors:
  - 'Zu steile Einstellung: die vordere Schulter übernimmt, der obere Brustanteil
    verliert Reiz.'
  - Schulterblätter lösen sich von der Lehne, der Oberkörper schiebt mit.
  - Zu schnelle negative Phase, die Gewichtsplatten schlagen an.
