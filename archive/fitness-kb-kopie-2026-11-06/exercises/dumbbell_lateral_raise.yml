  original_description:
  - 'Aufrechter Stand, Kopf nach vorne gerichtet, eine Kurzhantel in jeder Hand.

    Handflächen nach innen, in Richtung des Körpers, gerichtet.

    Hebe die Hanteln seitlich nach oben, ohne Schwung zu holen. Atme aus. Die Ellenbogen
    sind leicht gebeugt. Hebe die Kurzhanteln soweit, bis die Arme parallel zum Boden
    sind.

    Am obersten Punkt sollten deine Handflächen nach unten zeigen.

    Am höchsten Punkt hältst du für 1-2 Sekunden inne und ziehst deine Schulterblätter
    zusammen.

    Führe die Hanteln langsam wieder nach unten in die Ausgangsposition und atme ein.'
  instructions:
  - Pick a couple of dumbbells and stand with a straight torso and the dumbbells by
    your side at arms length with the palms of the hand facing you. This will be your
    starting position.
  - While maintaining the torso in a stationary position (no swinging), lift the dumbbells
    to your side with a slight bend on the elbow and the hands slightly tilted forward
    as if pouring water in a glass. Continue to go up until you arms are parallel
    to the floor. Exhale as you execute this movement and pause for a second at the
    top.
  - Lower the dumbbells back down slowly to the starting position as you inhale.
  - Repeat for the recommended amount of repetitions.
