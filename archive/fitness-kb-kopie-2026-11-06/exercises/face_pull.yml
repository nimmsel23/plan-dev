  primary_muscles:
  - 202a_trapezius_upper
  - 202b_trapezius_middle
  - 202c_trapezius_lower
  - 303_posterior_deltoid
  - 303_posterior_deltoid
  secondary_muscles:
  - 205_rhomboids
  instructions:
  - Facing a high pulley with a rope or dual handles attached, pull the weight directly
    towards your face, separating your hands as you do so. Keep your upper arms parallel
    to the ground.
  coaching_notes:
  - 'Die Übung trainiert die Rückseite der Schulter.

    Die Ausführung erfolgt mit dem Seil am Kabelzug. Beide Enden des Seils in jeweils
    einer Hand halten, dabei die Schultern maximal vorwärts strecken und das Kabel
    leicht gespannt halten (Ruheposition).

    Dann das Seil auf das Gesicht zuziehen. Die Hände bewegen sich dabei so weit wie
    möglich seitlicht am Kopf vorbei, die Schulter rotiert also nach hinten/außen.'
