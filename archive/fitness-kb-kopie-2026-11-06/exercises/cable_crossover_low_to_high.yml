  original_description:
  - 'Ausführung



    Startposition:


    Die Arme sind nach unten und leicht hinter dem Körper, die Ellenbogen leicht gebeugt.

    Spüre eine leichte Dehnung in der Brust.




    Bewegung:


    Führe deine Hände nach oben und zusammen vor deiner oberen Brust — etwa auf Kinn-
    bis Schlüsselbeinhöhe.

    Nutze eine flüssige, kontrollierte Bewegung (vermeide Ruckeln).

    Drücke deine Brustmuskulatur oben für 1–2 Sekunden zusammen.




    Rückführung:


    Lass die Arme langsam wieder nach unten und zu den Seiten zurückgehen, kontrolliert
    und unter Spannung.'
  instructions:
  - To move into the starting position, place the pulleys at the low position, select
    the resistance to be used and grasp a handle in each hand.
  - Step forward, gaining tension in the pulleys. Your palms should be facing forward,
    hands below the waist, and your arms straight. This will be your starting position.
  - With a slight bend in your arms, draw your hands upward and toward the midline
    of your body. Your hands should come together in front of your chest, palms facing
    up.
  - Return your arms back to the starting position after a brief pause.
