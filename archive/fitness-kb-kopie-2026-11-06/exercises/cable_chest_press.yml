  original_description:
  - 'Stelle die Sitzhöhe so ein, dass sich die Griffe auf Höhe deiner Brust befinden.

    Drücke mit deinen Beinen das Fußpedal nach vorne.

    Bringe die Griffe in die Ausgangsposition.

    Halte deinen Rücken in Kontakt mit dem Polster und drücke nach außen.

    Drücke die Griffe von deiner Brust weg und atme aus.

    Lasse die Griffe sanft zurückkommen, bis sie deine Brust erreichen.

    Lasse die Griffe zu deiner Brust zurückkehren, während du einatmest.'
  instructions:
  - Adjust the weight to an appropriate amount and be seated, grasping the handles.
    Your upper arms should be about 45 degrees to the body, with your head and chest
    up. The elbows should be bent to about 90 degrees. This will be your starting
    position.
  - Begin by extending through the elbow, pressing the handles together straight in
    front of you. Keep your shoulder blades retracted as you execute the movement.
  - After pausing at full extension, return to th starting position, keeping tension
    on the cables.
  - You can also execute this movement with your back off the pad, at an incline or
    decline, or alternate hands.
