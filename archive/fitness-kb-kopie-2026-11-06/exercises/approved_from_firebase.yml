  english: Incline Dumbbell Press
  coaching_notes:
  - Wähle in der Regel eine Bankneigung von etwa 30 bis 45 Grad; damit triffst du
    die obere Brust deutlich, ohne die Übung unnötig in Richtung Schulterdrücken zu
    verschieben.
  - Setze Füße, Gesäß und oberen Rücken stabil auf und baue vor dem Ausheben Ganzkörperspannung
    auf, damit der Oberkörper während des Satzes ruhig bleibt.
  - Ziehe die Schulterblätter leicht nach hinten und unten und halte diese Position
    kontrolliert, damit die Brust arbeiten kann und der Schulterkopf vorne nicht ausweicht.
  - Führe die Kurzhanteln unten etwa auf Höhe der oberen Brust beziehungsweise knapp
    außerhalb der Schulterlinie, statt sie zu tief oder zu weit Richtung Hals absinken
    zu lassen.
  - Lasse die Ellenbogen in einer natürlichen schrägen Linie unter den Hanteln arbeiten;
    ein Winkel von ungefähr 45 bis 70 Grad zum Oberkörper ist meist deutlich gelenkschonender
    als extremes Abspreizen.
  - Drücke die Hanteln nicht senkrecht über das Gesicht, sondern in einer leicht bogenförmigen
    Bahn über Schulter und Brustmitte, sodass Unterarm und Hantel in der Druckphase
    sauber übereinander bleiben.
  - Beende jede Wiederholung kurz vor dem harten Lockout, wenn du die Spannung gezielt
    auf der Brust halten willst; verriegle nur dann vollständig, wenn die Trainingsabsicht
    klar auf maximale Standardisierung oder Last ausgerichtet ist.
  - 'Nutze den vollen kontrollierbaren Bewegungsumfang: tief genug für eine deutliche
    Brustdehnung, aber nur so tief, wie du Schulterposition, Ellbogenpfad und Handgelenke
    sauber stabil halten kannst.'
