  german: Face Pull am Kabel
  coaching_notes:
  - Stellen Sie den Kabelzug ungefähr auf Augen- bis Stirnhöhe ein und verwenden Sie
    idealerweise ein Seil, damit sich die Hände am Ende der Zugphase frei nach außen
    bewegen können.
  - Nehmen Sie einen stabilen Stand ein, spannen Sie Bauch und Gesäß leicht an und
    halten Sie Brustbein und Kopf neutral, damit der Oberkörper während des gesamten
    Satzes ruhig bleibt.
  - 'Leiten Sie die Bewegung mit den Schulterblättern ein: Ziehen Sie die Schulterblätter
    kontrolliert nach hinten, bevor Sie das Seil zum Gesicht führen.'
  - Führen Sie die Ellbogen hoch und seitlich, etwa auf Schulterhöhe, und denken Sie
    daran, die Hände am Ende auseinanderzuziehen, statt das Seil nur gerade nach hinten
    zu ziehen.
  - Enden Sie mit den Händen ungefähr neben Ohren oder Wangenknochen, sodass Schulteraußenrotation
    und hintere Schulter aktiv mitarbeiten, ohne dass die Schultern zu den Ohren hochziehen.
  - Ziehen Sie kontrolliert, halten Sie die Endposition kurz unter Spannung und lassen
    Sie das Gewicht langsam zurück, damit der obere Rücken und die hintere Schulter
    die exzentrische Phase mitarbeiten.
  - Wählen Sie ein Gewicht, bei dem Sie die Ellbogenposition, die Außenrotation und
    die Schulterblattkontrolle sauber halten können; beim Face Pull ist Ausführung
    wichtiger als Last.
