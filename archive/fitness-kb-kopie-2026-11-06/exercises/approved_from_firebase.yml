  coaching_notes:
  - 'Starte mit dem ganzen Fuß im Druck und halte den Oberkörper über dem ersten Zug
    ruhig: Die Hüfte und Schultern steigen zunächst gemeinsam, damit der Rückenwinkel
    bis knapp über das Knie stabil bleibt.'
  - Führe die Stange im ersten und zweiten Zug eng am Körper nach oben. Aktive Lat-Spannung
    hält die Bahn vertikal und verhindert, dass die Hantel nach vorn wegschwingt.
  - Beschleunige nicht zu früh mit den Armen. Erst wenn Hüfte, Knie und Sprunggelenk
    explosiv gestreckt sind, folgt der aktive Zug nach oben und unmittelbar danach
    das schnelle Untertauchen unter die Stange.
  - Denke beim Umsetzen unter die Hantel nicht an 'hochziehen', sondern an 'schnell
    nach unten'. Der erfolgreiche Snatch wird vor allem durch präzises Timing und
    aggressives Unterziehen entschieden, nicht durch Armkraft.
  - Fange die Hantel mit aktivem Lockout, nach oben rotierenden Schulterblättern und
    stabilem Rumpf. Die Achseln zeigen leicht nach vorn, damit Schultergürtel und
    Rotatorenmanschette die Überkopfposition sicher verriegeln.
  - Im Catch sofort Spannung in Rumpf und Hüfte halten und die Tiefe kontrolliert
    annehmen. Eine stabile tiefe Überkopfkniebeuge ist Teil der Zielposition, nicht
    nur das Ende des Abfangens.
  - Stehe aus der tiefen Position erst auf, wenn die Hantel vollständig kontrolliert
    über dem Mittelfuß balanciert ist. Priorität hat Stabilität über der Körpermitte,
    nicht das übereilte Aufrichten.
