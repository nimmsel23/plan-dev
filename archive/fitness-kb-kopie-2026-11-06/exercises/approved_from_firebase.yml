  - Den Arm durch deutliche Innenrotation anzuheben oder die Hand nach unten zu kippen,
    statt das Schultergelenk neutral und stabil zu führen.
  - Den Ellbogenwinkel ständig zu verändern und die Bewegung damit eher in eine Mischung
    aus Seitheben und Zugbewegung zu verwandeln.
  - Zu hoch zu heben, obwohl dabei die Spannung verloren geht oder die Schulterposition
    unsauber wird. Mehr Höhe ist hier nicht automatisch besser.
  - Das Gewicht unten einfach fallen zu lassen und dadurch die exzentrische Kontrolle
    und den Vorteil der konstanten Kabelspannung zu verschenken.
  - Den Arm zu weit hinter dem Körper oder in einer unnatürlichen Linie zu führen,
    was die Schultermechanik häufig verschlechtert.
  - Den Rumpf nicht zu stabilisieren, sodass du zur Gegenseite ausweichst oder ins
    Hohlkreuz gehst, um die Wiederholung zu erleichtern.
  - Mit dem Handgelenk oder Unterarm zu arbeiten, anstatt die Last über den Oberarm
    und den seitlichen Deltoid zu bewegen.
  - Die Bewegung hektisch auszuführen und jede Wiederholung anders zu starten, statt
    eine konstante Zuglinie und reproduzierbare Technik beizubehalten.
