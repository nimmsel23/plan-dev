  - Ellbogen etwa schulterbreit bis leicht enger ausrichten und während des Satzes
    kontrolliert in dieser Linie halten.
  - Das Gewicht langsam hinter oder neben die Stirn absenken, sodass die Trizepsmuskulatur
    unter Spannung bleibt und kein Fallenlassen entsteht.
  - Am tiefsten Punkt eine kontrollierte Dehnung zulassen, ohne die Schulter nach
    vorn kippen oder die Oberarme nach hinten wegdriften zu lassen.
  - In der Streckphase aktiv bis kurz vor die volle Ellbogenstreckung arbeiten, ohne
    die Gelenke hart einzurasten.
  - Handgelenke neutral halten und die Hantel oder Stange fest, aber nicht verkrampft
    führen.
  - Brustkorb stabil halten, Nacken lang lassen und den Kopf ruhig auf der Bank positionieren.
  - Ein moderates Gewicht wählen, das eine saubere exzentrische Phase und eine präzise
    Ellbogenführung über alle Wiederholungen erlaubt.
