  instructions:
  - To begin, step onto the elliptical and select the desired option from the menu.
    Most ellipticals have a manual setting, or you can select a program to run. Typically,
    you can enter your age and weight to estimate the amount of calories burned during
    exercise. Elevation can be adjusted to change the intensity of the workout.
  - The handles can be used to monitor your heart rate to help you stay at an appropriate
    intensity.
