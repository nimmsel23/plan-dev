  coaching_notes:
  - Halten Sie eine aufrechte Körperhaltung mit leicht angespanntem Rumpf und schauen
    Sie geradeaus. Vermeiden Sie ein übermäßiges Nach-vorne-Lehnen.
  - Der gesamte Fuß sollte stets flächig auf der Trittfläche bleiben, um eine optimale
    Muskelaktivierung der Beine und Gesäßmuskulatur zu gewährleisten und die Gelenke
    zu schonen.
  - Nutzen Sie die Armstangen aktiv, indem Sie abwechselnd eine Drück- und Zugbewegung
    ausführen, um den Oberkörper effektiv in das Training einzubeziehen.
  - Variieren Sie Widerstand, Steigung und Trittrichtung (vorwärts/rückwärts), um
    unterschiedliche Muskelgruppen anzusprechen und neue Reize zu setzen.
  - Achten Sie auf eine fließende, gleichmäßige Bewegung ohne Ruckeln, um die Gelenke
    zu schonen und die Trainingseffizienz zu maximieren.
  - Aktivieren Sie bewusst Ihre Rumpfmuskulatur (Bauch- und untere Rückenmuskulatur),
    um Stabilität zu gewährleisten und die Kraftübertragung zu optimieren.
  common_errors:
  - Sich stark auf die Armstangen zu stützen oder zu lehnen, wodurch der Unterkörper
    entlastet wird und der Trainingseffekt für Beine und Gesäß reduziert wird.
  - Eine gebeugte oder gekrümmte Haltung im oberen Rücken einzunehmen, was zu Fehlbelastungen
    und Verspannungen in Nacken und Schultern führen kann.
  - Nur die Beine oder nur die Arme zu nutzen und den anderen Körperbereich passiv
    mitzuführen, was den Ganzkörperaspekt des Trainings vernachlässigt.
  - Ein zu hoher Widerstand, der eine ruckartige Bewegung erzwingt und die Gelenke
    unnötig belastet, anstatt eine harmonische Bewegung zu ermöglichen.
  - Den Blick nach unten auf die Füße oder das Display zu richten, was die Nackenhaltung
    ungünstig beeinflusst und zu Nackenschmerzen führen kann.
  original_description:
  - Er verbessert die Muskelstraffung, stärkt die Beinmuskulatur (vordere Oberschenkelmuskulatur,
    Gesäßmuskulatur, Waden), fördert die Durchblutung und steigert die Ausdauer. Der
    Crosstrainer ist außerdem sehr nützlich, wenn du abnehmen möchtest.
