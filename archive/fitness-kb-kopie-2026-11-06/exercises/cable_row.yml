  original_description:
  - 'Beginne,

    indem du den Aufsatz hoch an der Kabelstation positionierst und etwa 1 m vom Aufsatz
    zurücktrittst. Greife

    den Griff des Kabelzugs mit der linken Hand auf etwa Kopfhöhe, mit leicht gebeugtem
    Ellbogen. Tritt mit dem linken Fuß zurück.

    Ziehe

    dein Ellbogengelenk zum Oberkörper hin, während du dich leicht drehst, und führe
    ein

    einarmiges Rudern aus. Aktiviere den Latissimus, während du dich drehst.

    Kehre

    mit Kabelzug und linkem Fuß in die Ausgangsposition zurück und greife den Griff
    des Kabelzugs mit der

    rechten Hand. Wiederhole diese Bewegung auf der gegenüberliegenden Seite, mit
    dem rechten Fuß nach hinten gestellt.'
  instructions:
  - Grasp a straight bar cable attachment that is attached to a low pulley with a
    pronated (palms facing your thighs) grip that is slightly less than shoulder width.
    The bar should be resting on top of your thighs. Your arms should be extended
    with a slight bend at the elbows and your back should be straight. This will be
    your starting position.
  - 'Use your side shoulders to lift the cable bar as you exhale. The bar should be
    close to the body as you move it up. Continue to lift it until it nearly touches
    your chin. Tip: Your elbows should drive the motion. As you lift the bar, your
    elbows should always be higher than your forearms. Also, keep your torso stationary
    and pause for a second at the top of the movement.'
  - Lower the bar back down slowly to the starting position. Inhale as you perform
    this portion of the movement.
  - Repeat for the recommended amount of repetitions.
