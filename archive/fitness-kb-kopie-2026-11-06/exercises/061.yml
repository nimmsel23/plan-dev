  coaching_notes:
  - 'Baue zuerst ein sauberes Front-Rack: Stange liegt auf den vorderen Schultern,
    nicht in den Händen; Ellbogen aktiv nach vorne-oben führen.'
  - Atme tief in Bauch und Flanken ein und spanne den Rumpf vor jeder Wiederholung
    hart an, damit der Oberkörper aufrecht bleibt.
  - Setze dich zwischen die Hüften, während die Knie kontrolliert nach vorne über
    die Zehen reisen; so bleibt die Last mittig über dem Fuß.
  - Halte den Druck über Mittelfuß bis Ferse, ohne die Zehen zu verlieren; der ganze
    Fuß bleibt belastet.
  - Denke an Brustbein hoch und oberen Rücken lang, damit die Stange nicht nach vorne
    abrollt.
  - Gehe nur so tief, wie du Spannung, neutrale Wirbelsäule und stabile Fußposition
    halten kannst.
  - Drücke aus dem tiefsten Punkt gleichzeitig Boden weg und Ellbogen hoch, statt
    die Hüfte zuerst nach hinten schießen zu lassen.
  - Wenn Mobilität limitiert ist, priorisiere eine stabile Front-Rack- und Sprunggelenksposition
    vor zusätzlicher Last.
  common_errors:
  - Ellbogen sinken ab, wodurch die Stange nach vorne kippt und die Bewegung in eine
    Good-Morning-Mechanik abrutscht.
  - Die Hüfte schießt aus dem Loch zuerst hoch, sodass der Oberkörper stark nach vorne
    fällt.
  - Knie kollabieren nach innen, statt aktiv über dem zweiten bis dritten Zeh geführt
    zu werden.
  - Fersen heben ab oder der Druck wandert nur auf den Vorfuß, meist durch fehlende
    Dorsalflexion oder verlorene Rumpfspannung.
  - Die Stange wird mit den Händen getragen, statt auf den Schultern abgelegt zu sein,
    was Handgelenke unnötig überlastet.
  - Tiefe wird erzwungen, obwohl Becken, LWS oder Oberkörperposition dabei sichtbar
    die Spannung verlieren.
  - Im unteren Umkehrpunkt wird passiv gebounced, ohne Spannung in Rumpf, Fuß und
    Knielinie zu halten.
  - Zu frühes Ausatmen in der Aufwärtsphase führt zum Kollaps im Rumpf und zu instabiler
    Stangenbahn.
