  coaching_notes:
  - Bewegen Sie die Schulterblätter aktiv auf dem Brustkorb, ohne die Bewegung aus
    den Ellenbogen oder der Lendenwirbelsäule zu holen.
  - Halten Sie den Hals lang und die Schultern entspannt, damit nicht der obere Trapezius
    die Arbeit dominiert.
  - Arbeiten Sie langsam durch Protraktion, Retraktion, Depression und kontrollierte
    Aufwärtsrotation, damit jede Position bewusst angesteuert wird.
  - Lassen Sie den Brustkorb ruhig und den Rumpf stabil, damit die Bewegung lokal
    aus dem Schultergürtel kommt.
  - Denken Sie bei der Protraktion daran, die Schulterblätter nach vorne um den Brustkorb
    gleiten zu lassen, statt nur die Arme nach vorne zu schieben.
  - Bei Retraktion und Depression die Schulterblätter sanft nach hinten-unten führen,
    ohne ins Hohlkreuz auszuweichen.
  - Nutzen Sie nur so viel Bandspannung oder Bewegungsumfang, wie Sie sauber kontrollieren
    können; Qualität ist wichtiger als Widerstand.
  - Atmen Sie ruhig weiter und halten Sie die Rippen unten, damit Serratus anterior
    und unterer Trapezius sauber zusammenarbeiten können.
  common_errors:
  - Die Bewegung wird überwiegend mit den Armen ausgeführt, während die Schulterblätter
    kaum aktiv gleiten.
  - Die Schultern werden hochgezogen und der obere Trapezius übernimmt die Übung.
  - Ausweichbewegungen über Brustkorb oder Lendenwirbelsäule statt isolierter Schulterblattkontrolle.
  - Zu viel Bandspannung oder zu großer Bewegungsumfang, sodass die Kontrolle in den
    Endpositionen verloren geht.
  - Ruckartige Wiederholungen ohne kurze bewusste Kontrolle in den einzelnen Schulterblattpositionen.
  - Protraktion wird mit Rundrücken verwechselt, statt die Schulterblätter aktiv nach
    vorne am Brustkorb zu führen.
  - Retraktion wird durch starkes Herausstrecken der Brust erzwungen, statt aus der
    Scapula selbst erzeugt.
  - Fehlende Rumpfspannung und abgespreizte Rippen, wodurch die Übung instabil und
    unsauber wird.
