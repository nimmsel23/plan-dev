  coaching_notes:
  - Stellen Sie Sitzhöhe und Kniepolster so ein, dass die Oberschenkel sicher fixiert
    sind und Sie bei gestreckten Armen die Stange sauber greifen können, ohne aus
    dem Sitz gezogen zu werden.
  - Greifen Sie eng im Untergriff. Die Handgelenke bleiben neutral, die Brust ist
    angehoben und der Kopf bleibt in Verlängerung der Wirbelsäule.
  - Nehmen Sie nur eine leichte Rücklage ein. Der Oberkörper bleibt während des Satzes
    weitgehend ruhig, damit der Zug nicht zu einer Rudervariante wird.
  - 'Beginnen Sie jede Wiederholung mit aktiver Schulterblattdepression: Ziehen Sie
    die Schultern weg von den Ohren, bevor Sie die Ellbogen beugen.'
  - Führen Sie die Ellbogen eng am Körper nach unten in Richtung Flanken. Denken Sie
    daran, die Oberarme nach unten zu ziehen, statt nur die Hände zur Brust zu bewegen.
  - Ziehen Sie die Stange kontrolliert bis zum oberen Brustbein oder knapp darunter,
    sofern Sie dabei Brustkorb und Schulterposition stabil halten können.
  - Halten Sie am unteren Punkt kurz Spannung auf dem Latissimus, ohne in ein Hohlkreuz
    oder ein starkes Zurücklehnen auszuweichen.
  - Lassen Sie die Stange exzentrisch langsam ansteigen und geben Sie den Lats am
    oberen Punkt eine spürbare Dehnung, ohne passiv in die Schultergelenke zu hängen.
  - Atmen Sie beim Herunterziehen aus und beim kontrollierten Hochlassen ein. Halten
    Sie den Rumpf über die gesamte Bewegung aktiv angespannt.
  - Wählen Sie ein Gewicht, bei dem Sie die Schulterblätter kontrollieren und den
    vollen Bewegungsradius ohne Schwung oder Formverlust halten können.
  common_errors:
  - Zu starkes Zurücklehnen, wodurch die Übung biomechanisch eher zu einem Kabelrudern
    wird und der vertikale Zug verloren geht.
  - Die Bewegung nur aus den Armen einzuleiten, statt zuerst die Schulterblätter nach
    unten zu setzen und dann die Ellbogen zu führen.
  - Die Schultern während des Zugs hochzuziehen, was die Spannung vom Latissimus nimmt
    und den Nacken unnötig belastet.
  - Die Stange mit Schwung nach unten zu reißen und die exzentrische Phase unkontrolliert
    nach oben schnellen zu lassen.
  - Die Handgelenke stark abzuknicken oder den Griff zu verkrampfen, sodass Unterarme
    und Ellenbogen unnötig überlastet werden.
  - Die Stange zu tief hinter den Brustkorb zu ziehen und dafür den Brustkorb stark
    aufzureißen oder ins Hohlkreuz auszuweichen.
  - Am oberen Punkt passiv in die Schultern zu hängen, anstatt die Dehnung kontrolliert
    mit stabiler Schulterposition zuzulassen.
  - Ein zu breiter oder uneinheitlicher Griff, obwohl die Variante gezielt mit engem
    Untergriff ausgeführt werden soll.
  - Den Kopf nach vorne zu schieben oder den Nacken zu überstrecken, statt die Halswirbelsäule
    neutral zu halten.
  - Zu viel Gewicht zu wählen, sodass Bewegungsradius, Schulterblattkontrolle und
    Zugrichtung unsauber werden.
