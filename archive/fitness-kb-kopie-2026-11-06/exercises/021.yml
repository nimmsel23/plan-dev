  coaching_notes:
  - Greife etwa schulterbreit oder leicht enger im Untergriff, sodass die Handgelenke
    gerade bleiben und die Ellenbogen sauber unter der Stange arbeiten können.
  - 'Beginne im aktiven Hang: Schulterblätter leicht nach unten setzen, Rumpf anspannen
    und die Beine ruhig halten, bevor die erste Zugphase startet.'
  - Denke daran, die Ellenbogen nach unten Richtung Rippen zu ziehen, statt nur das
    Kinn zur Stange vorzuschieben; so kommt der Zug aus Latissimus und Armbeugern.
  - Halte Brustbein stolz und Rippen kontrolliert, damit du weder ins Hohlkreuz fällst
    noch dich in eine lose Bananenform schwingst.
  - Ziehe bis das Kinn klar über der Stange ist oder die obere Brust die Stange annähert,
    ohne die Spannung in Schultergürtel und Rumpf zu verlieren.
  - Senke dich kontrolliert in die volle Ellbogenstreckung zurück und nutze die exzentrische
    Phase bewusst, statt unten einfach in die passive Schulterposition zu fallen.
  common_errors:
  - Aus einem passiven Hang mit hochgezogenen Schultern anziehen, wodurch die Schulterblattkontrolle
    und ein sauberer Kraftaufbau verloren gehen.
  - Schwung aus Hüfte, Knien oder Kipping nutzen, statt jede Wiederholung aus ruhiger
    Rumpfspannung und kontrolliertem Zug zu erzeugen.
  - Das Kinn nur nach vorne schieben, um die Wiederholung künstlich zu beenden, obwohl
    Brustkorb und Ellenbogen nicht sauber nach oben beziehungsweise unten geführt
    wurden.
  - Zu weit oder zu eng greifen, sodass Handgelenke einknicken und Ellenbogen unnötig
    gereizt werden.
  - Unten nicht vollständig strecken oder oben die Endposition abkürzen, wodurch Bewegungsumfang
    und Trainingsreiz deutlich sinken.
  - Beim Hochziehen die Rippen aufreißen und ins Hohlkreuz kippen, statt Becken und
    Rumpf stabil zu halten.
