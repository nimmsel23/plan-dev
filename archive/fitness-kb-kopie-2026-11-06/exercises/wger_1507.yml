  original_description:
  - 'Der Liegestütz mit Klatschen ist eine explosive Oberkörperbewegung, die Schnellkraft
    und die Stärke der schnellzuckenden Muskelfasern aufbaut. Er fügt dem klassischen
    Liegestütz eine plyometrische Komponente hinzu, da die Hände während der Wiederholung
    den Boden verlassen müssen.


    Beginne in einer stabilen Liegestützposition mit den Händen etwas weiter als schulterbreit
    und angespanntem Rumpf

    Senke deinen Körper explosiv ab und drücke dich so kraftvoll vom Boden ab, dass
    deine Hände abheben.

    Klatsche schnell auf Brusthöhe in die Hände, bevor du sie wieder auf den Boden
    setzt.

    Lande mit leicht gebeugten Ellbogen, um den Aufprall abzufedern, und gehe sofort
    in die nächste Wiederholung über'
  instructions:
  - Move into a prone position on the floor, supporting your weight on your hands
    and toes.
  - Your arms should be fully extended with the hands around shoulder width. Keep
    your body straight throughout the movement. This will be your starting position.
  - Descend by flexing at the elbow, lowering your chest towards the ground.
  - At the bottom, reverse the motion by pushing yourself up through elbow extension
    as quickly as possible. Attempt to push your upper body up until your hands leave
    the ground.
  - Return to the starting position and repeat the exercise.
  - For added difficulty, add claps into the movement while you are air borne.
