  coaching_notes:
  - 'Baue jede Wiederholung aus einer sauberen hohen Liegestützposition auf: Hände
    etwa schulterbreit bis leicht breiter, Finger nach vorn, Schultern über den Händen.
    Kopf, Brustkorb, Becken, Knie und Fersen bleiben in einer geraden Linie.'
  - Erzeuge vor dem Absenken Ganzkörperspannung. Spanne Bauch, Gesäß und Oberschenkel
    aktiv an, ziehe die Rippen kontrolliert nach unten und halte die Halswirbelsäule
    neutral. Je besser die Rumpfspannung, desto sauberer wird die Kraft in den Boden
    übertragen.
  - Senke dich kontrolliert ab, bis die Brust knapp über dem Boden ist. Die Ellbogen
    zeigen dabei nicht starr nach außen, sondern ungefähr 30 bis 60 Grad zur Körperseite,
    damit Schulter und Brust günstig zusammenarbeiten.
  - Nutze unten keinen passiven Kollaps. Wechsle zügig, aber kontrolliert aus der
    Bremsphase in den explosiven Abdruck. Ziel ist nicht nur hochzukommen, sondern
    den Boden maximal schnell wegzudrücken.
  - Drücke dich so explosiv ab, dass beide Hände klar den Boden verlassen. Der Klatscher
    ist nur das sichtbare Ergebnis eines starken Abdrucks; der eigentliche Trainingsfokus
    liegt auf Schnellkraft und Rate of Force Development im gesamten Push-Muster.
  - Halte den Körper auch in der Flugphase lang und stabil. Vermeide es, in der Luft
    die Hüfte einzuknicken oder die Beine unruhig werden zu lassen. Der Rumpf bleibt
    fest, damit du in derselben Linie wieder landest.
  - Lande aktiv und weich über die ganze Handfläche. Fange den Aufprall mit leicht
    gebeugten Ellbogen ab, ohne in den Schultergürtel einzusacken. Die Landung soll
    kontrolliert, leise und reaktiv sein.
  - 'Lass die Schulterblätter natürlich arbeiten: In der Druckphase dürfen sie aktiv
    nach vorn gleiten, ohne dass du die Schultern zu den Ohren ziehst. So unterstützt
    du Serratus anterior und eine stabile Schultermechanik.'
  - Beende den Satz, sobald Explosivität, Körperspannung oder Landekontrolle deutlich
    nachlassen. Bei plyometrischen Liegestützvarianten zählt Wiederholungsqualität
    klar mehr als Ermüdung.
  - Als Progression eignet sich zunächst der explosive Liegestütz ohne Klatschen oder
    mit erhöhter Handposition. Erst wenn Höhe, Landung und Rumpfkontrolle konsistent
    sauber sind, ist der Klatscher sinnvoll.
  common_errors:
  - Die Hüfte hängt durch oder schiebt sich nach oben. Dadurch geht die starre Körperlinie
    verloren, die Kraftübertragung wird schlechter und die Lendenwirbelsäule unnötig
    belastet.
  - Es wird zu wenig explosiv gedrückt, sodass die Hände den Boden kaum verlassen.
    Dann wird der Klatscher hektisch erzwungen statt durch einen echten Schnellkraftimpuls
    ermöglicht.
  - Die Landung erfolgt hart mit gestreckten oder fast gestreckten Ellbogen. Das erhöht
    die Stoßbelastung auf Handgelenke, Ellbogen und Schultern deutlich.
  - Die Ellbogen flaren seitlich fast auf 90 Grad auf. Das verschlechtert meist die
    Schulterposition und nimmt der Bewegung die stabile Druckbahn.
  - Der Athlet fällt in der exzentrischen Phase einfach nach unten, statt Spannung
    zu halten und den Richtungswechsel vorzubereiten. So geht Kontrolle verloren und
    die Reaktivkraft wird schlechter genutzt.
  - Zwischen Landung und nächstem Abdruck entsteht eine deutliche Pause. Damit geht
    der plyometrische Charakter verloren, weil der Dehnungs-Verkürzungs-Zyklus nicht
    mehr effektiv genutzt wird.
  - Der Kopf wird vorgeschoben oder die Halswirbelsäule überstreckt, um scheinbar
    früher vom Boden wegzukommen. Das verschlechtert die Gesamtausrichtung des Körpers.
  - Die Schultern werden in der Landung hochgezogen und der Oberkörper sackt zwischen
    den Armen ein. Das reduziert die aktive Schulterstabilität und macht die Wiederholung
    unsauber.
  - Der Bewegungsumfang wird verkürzt, indem nur halbe Wiederholungen ausgeführt werden.
    Ohne ausreichende Tiefe sinken mechanische Spannung und Trainingsreiz für Brust,
    Trizeps und vordere Schulter.
  - Es wird trotz nachlassender Höhe und Kontrolle weitergemacht. Bei dieser Übung
    ist das ein typischer Qualitätsfehler, weil Explosivität und sichere Landung der
    Kern der Ausführung sind.
