  original_description:
  - Der Beinbeuger, auch als Hamstring-Curl bekannt, ist eine Isolationsübung, die
    auf die hintere Oberschenkelmuskulatur abzielt. Bei der Übung wird der Unterschenkel
    gegen Widerstand in Richtung Gesäß gebeugt. Weitere Übungen, mit denen sich die
    hintere Oberschenkelmuskulatur stärken lässt, sind das Glute-Ham-Raise und das
    Kreuzheben.
  instructions:
  - 'Adjust the machine lever to fit your height and lie face down on the leg curl
    machine with the pad of the lever on the back of your legs (just a few inches
    under the calves). Tip: Preferably use a leg curl machine that is angled as opposed
    to flat since an angled position is more favorable for hamstrings recruitment.'
  - Keeping the torso flat on the bench, ensure your legs are fully stretched and
    grab the side handles of the machine. Position your toes straight (or you can
    also use any of the other two stances described on the foot positioning section).
    This will be your starting position.
  - As you exhale, curl your legs up as far as possible without lifting the upper
    legs from the pad. Once you hit the fully contracted position, hold it for a second.
  - As you inhale, bring the legs back to the initial position. Repeat for the recommended
    amount of repetitions.
