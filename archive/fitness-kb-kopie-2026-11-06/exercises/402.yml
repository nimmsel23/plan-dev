  coaching_notes:
  - Richte die Maschine so ein, dass die Kniegelenkachse sauber mit dem Drehpunkt
    der Maschine fluchtet und das Polster knapp oberhalb der Ferse sitzt.
  - Halte Becken und Bauchspannung stabil gegen das Polster, damit die Bewegung aus
    der Kniebeugung kommt und nicht aus einer Ausweichbewegung in Hüfte oder Lendenwirbelsäule.
  - Starte jede Wiederholung kontrolliert aus der gestreckten Position, ohne das Gewicht
    auf den Anschlag fallen zu lassen, und baue Spannung bereits vor dem ersten Zentimeter
    der Beugung auf.
  - Ziehe die Rolle über die Ferse nach unten beziehungsweise hinten, bis du eine
    klare aktive Peak-Kontraktion der hinteren Oberschenkel erreichst, ohne das Becken
    anzuheben.
  - Führe die exzentrische Phase bewusst langsam zurück und nutze die Dehnposition
    der Hamstrings, ohne die Kontrolle über Knieachse und Becken zu verlieren.
  - Halte das Fußgelenk neutral bis leicht in Dorsalflexion, wenn du den Hamstring-Fokus
    erhöhen und unnötige Dominanz der Waden reduzieren willst.
  common_errors:
  - Das Becken hebt vom Polster ab, um mit Schwung oder Hüftextension die letzten
    Grade der Wiederholung zu erzwingen.
  - Die exzentrische Phase wird fallen gelassen, sodass Spannung und Dehnreiz in den
    Hamstrings verloren gehen.
  - Die Maschine ist falsch eingestellt, wodurch der Drehpunkt nicht zum Knie passt
    oder das Polster unangenehm am Sprunggelenk hebelt.
  - Es wird nur in verkürzter Teilbewegung gearbeitet, ohne die kontrollierte Dehnung
    und ohne saubere Endkontraktion auszunutzen.
  - Mit zu viel Last wird die Bewegung ruckartig eingeleitet, statt die Kniebeugung
    gleichmäßig und muskulär zu starten.
  - Die Füße werden verkrampft eingesetzt, sodass Wadenkrämpfe oder eine unnötige
    Verlagerung der Arbeit weg von den Hamstrings entstehen.
