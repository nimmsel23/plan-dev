  name: Machine Triceps Extension
  display_name: Trizepsmaschine
  german: Trizepsmaschine
  english: Machine Triceps Extension
  category: push
  equipment:
  - machine
  primary_muscles:
  - 401_triceps_brachii
  secondary_muscles: []
  stabilizers:
  - 501_rectus_abdominis
  - 502_obliquus_externus
  - 503_obliquus_internus
  - 405_forearm_flexors
  - 406_forearm_extensors
  movements:
  - elbow_extension
  - upper_body
  - isolation
  - machine_based
  instructions:
  - Adjust the seat to the appropriate height and make your weight selection. Place
    your upper arms against the pads and grasp the handles. This will be your starting
    position.
  - Perform the movement by extending the elbow, pulling your lower arm away from
    your upper arm.
  - Pause at the completion of the movement, and then slowly return the weight to
    the starting position.
  - Avoid returning the weight all the way to the stops until the set is complete
    to keep tension on the muscles being worked.
  coaching_notes:
  - Stellen Sie den Sitz so ein, dass Ihre Ellbogen exakt mit dem Drehpunkt der Maschine
    ausgerichtet sind, um die Effektivität und den natürlichen Bewegungsablauf zu
    maximieren.
  - Positionieren Sie Ihre Oberarme fest gegen die Polster und halten Sie sie während
    der gesamten Bewegung dort, um eine reine Isolation des Trizeps zu gewährleisten
    und unerwünschtes Mitschwingen zu vermeiden.
  - Umfassen Sie die Griffe fest, aber ohne die Handgelenke zu überstrecken oder zu
    beugen; halten Sie diese in einer neutralen, stabilen Position.
  - Strecken Sie die Arme vollständig aus und spannen Sie den Trizeps am Ende der
    Bewegung bewusst an. Vermeiden Sie jedoch ein vollständiges Durchdrücken oder
    Hyperextendieren der Ellbogengelenke.
  - Führen Sie das Gewicht kontrolliert und langsam in die Ausgangsposition zurück
    (Exzentrik), um die Muskelspannung aufrechtzuerhalten und den gesamten Bewegungsbereich
    optimal zu nutzen.
  - Konzentrieren Sie sich während der gesamten Ausführung ausschließlich auf die
    Kontraktion des Trizeps und vermeiden Sie jeglichen Schwung aus dem Rumpf oder
    den Schultern.
  common_errors:
  - 'Abheben der Ellbogen von den Polstern: Dies verlagert die Belastung vom Trizeps
    auf Schultern und Brust und mindert die Isolation.'
  - 'Verwendung von Schwung aus dem Oberkörper/Rumpf: Reduziert die Effizienz der
    Übung für den Trizeps und erhöht das Risiko für den unteren Rücken.'
  - 'Unvollständige Bewegungsausführung: Sowohl das Nichterreichen der vollen Streckung
    als auch das zu frühe Beenden der Rückführung limitiert den Trainingsreiz und
    den Bewegungsumfang.'
  - 'Zu schnelles Ablassen des Gewichts (unkontrollierte Exzentrik): Verlust der Muskelspannung,
    verminderter hypertropher Reiz und erhöhtes Verletzungsrisiko für die Ellbogengelenke.'
  - 'Instabile Handgelenksposition (Beugen oder Überstrecken): Kann zu Handgelenksbeschwerden
    oder -verletzungen führen und die Kraftübertragung ineffizient machen.'
