  coaching_notes:
  - 'Starte mit engem Kontakt zur Hantel: Mittelfuß unter der Stange, Brust angehoben,
    Latissimus angespannt und der Oberkörperwinkel im ersten Zug möglichst konstant.'
  - Beschleunige die Hantel aus den Beinen und der Hüfte, nicht aus den Armen. Die
    Arme bleiben im Zug lang, bis die Streckung in Sprunggelenk, Knie und Hüfte abgeschlossen
    ist.
  - Im Umsetzen die Ellenbogen schnell und aggressiv nach vorn bringen, damit die
    Hantel sauber auf den Schultern im Front Rack landet und nicht in den Händen hängen
    bleibt.
  - Für den Stoß zuerst einen kontrollierten, geraden Dip ausführen, dann explosiv
    vertikal treiben. Der Impuls kommt aus den Beinen; die Arme vollenden nur die
    Fixierung über Kopf.
  - 'Überkopf eine stabile Linie herstellen: Stange über Mittelfuß, Rippen unten,
    Gesäß angespannt und Schultergürtel aktiv nach oben rotiert. Erst vollständig
    kontrollieren, dann die Füße wieder zusammenführen.'
  - Die Bewegung ist hochtechnisch und ermüdungssensibel. Last nur steigern, wenn
    Startposition, Rack-Position und Overhead-Fixierung unter Geschwindigkeit reproduzierbar
    sauber bleiben.
  common_errors:
  - Die Hantel zu früh mit den Armen reißen, wodurch der Beinschub verloren geht und
    der Zugweg unruhig oder bogenförmig wird.
  - Im ersten Zug die Hüfte zu schnell hochschieben, sodass der Oberkörper nach vorn
    kippt und die Hantel vom Körper wegdriftet.
  - Im Clean die Ellenbogen zu langsam nach vorn bringen; dadurch crasht die Hantel
    auf die Schultern oder wird unsauber mit den Händen gefangen.
  - Im Jerk nach vorn oder nach hinten dippen statt senkrecht, was den Kraftvektor
    verschiebt und die Hantel aus der idealen Überkopf-Linie bringt.
  - Den Stoß mit den Armen ausdrücken zu wollen, anstatt aktiv unter die Hantel zu
    gehen; das limitiert die Last und macht die Fixierung instabil.
  - Überkopf in ein Hohlkreuz fallen oder den Rumpf nicht verspannen, wodurch die
    Lendenwirbelsäule ausweicht und die Schulterposition unsicher wird.
