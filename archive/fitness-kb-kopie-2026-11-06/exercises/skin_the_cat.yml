  coaching_notes:
  - 'Beginne im aktiven Hang: Schultern leicht nach unten ziehen, Brustkorb kontrollieren
    und den Griff fest schließen. Die Bewegung startet aus Schulterspannung, nicht
    aus einem passiven Aushängen in die Gelenke.'
  - Ziehe zuerst die Knie eng zur Brust und rolle das Becken nach hinten, damit der
    Körperschwerpunkt kontrolliert unter und dann hinter die Stange oder die Ringe
    wandert. Je kompakter der Tuck, desto leichter lässt sich die Rotation sauber
    steuern.
  - 'Halte die Arme lang und die Ellenbogen ruhig, ohne sie aggressiv zu verriegeln.
    So bleibt die Last dort, wo sie hingehört: in Schultergürtel, Latissimus, Rotatorenmanschette
    und Rumpfspannung.'
  - Führe die negative Phase in den German Hang langsam aus und bremse den Weg aktiv
    ab. Ziel ist nicht maximale Tiefe um jeden Preis, sondern eine Position, die du
    unter Spannung schmerzfrei kontrollieren kannst.
  - Lass die Schulterblätter während der Rotation arbeiten, statt sie starr festzuklemmen.
    Gute Skin-the-Cat-Technik ist aktive Scapula-Kontrolle mit Depression und sauberer
    Anpassung an den Bewegungsbogen, nicht starres Ziehen nach hinten.
  - Behalte eine klare Rumpfspannung vom Griff bis zu den Füßen. Auch im Tuck soll
    der Bauch aktiv bleiben, damit du nicht ins Hohlkreuz kippst oder in der Umkehrposition
    unkontrolliert pendelst.
  - 'Steuere die Ausleitung bewusst: Entweder kontrolliert zurückrollen oder zunächst
    kurz im sicheren German Hang stabilisieren, bevor du umkehrst. Die exzentrische
    Kontrolle ist der eigentliche Qualitätsmarker dieser Übung.'
  - Auf Ringen darf sich die Schulter natürlicher ausrichten als an einer starren
    Stange, gleichzeitig steigt aber der Stabilitätsanspruch. Arbeite deshalb nur
    so tief, wie du Ringposition, Schulterspannung und Rumpf sauber halten kannst.
  common_errors:
  - 'Passiv in den German Hang fallen lassen: Wer die untere Position nur durch Schwerkraft
    erreicht, lädt die vordere Schulterkapsel und die lange Bizepssehne unnötig. Die
    gesamte Abwärtsbewegung muss aktiv gebremst werden.'
  - 'Zu früh auf volle Tiefe gehen: Fehlende Schulterextension oder mangelnde Rotationskontrolle
    wird oft mit Gewalt kompensiert. Das führt typischerweise zu stechendem Zug an
    der Vorderseite der Schulter statt zu einer kontrollierten Dehnung.'
  - 'Schultern zu den Ohren ziehen und im Hang kollabieren: Verlorene Schulterspannung
    reduziert die Kontrolle über die Scapula und verschlechtert die Lastverteilung
    im Schultergürtel deutlich.'
  - 'Knie und Becken nicht aktiv einrollen: Ohne sauberen Tuck wird die Rotation unnötig
    schwer, der Körper schwingt und der Athlet versucht die Bewegung über Schwung
    statt über Positionierung zu lösen.'
  - 'Ellenbogen stark beugen, um sich durch die Bewegung zu mogeln: Das verkürzt den
    Hebel kurzfristig, nimmt aber Arbeit aus Schultergürtel und Rumpf und verändert
    die Zielmechanik der Übung.'
  - 'Im unteren Bereich ins Hohlkreuz ausweichen: Sobald die Bauchspannung verloren
    geht, übernimmt die Lendenwirbelsäule Stabilisationsarbeit, die eigentlich über
    Rumpf und Schulterkette organisiert werden sollte.'
  - 'Schmerz mit normaler Dehnung verwechseln: Ein breites Spannungsgefühl in Brust
    und vorderer Schulter kann tolerierbar sein, punktueller Schmerz, Instabilitätsgefühl
    oder ein plötzliches Ziehen im Schultervorderbereich sind klare Stoppsignale.'
