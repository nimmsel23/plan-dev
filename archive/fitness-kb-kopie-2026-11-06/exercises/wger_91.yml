  coaching_notes:
  - '**Startposition:** Stelle dich schulterbreit auf, die Knie sind leicht gebeugt.
    Fasse die Langhantel im Untergriff (Handflächen zeigen nach vorne) etwa schulterbreit.
    Die Arme sind vollständig ausgestreckt, die Ellenbogen bleiben nah am Körper.
    Ziehe die Schultern leicht zurück und spanne den Rumpf an, um eine stabile Basis
    zu schaffen.'
  - '**Konzentrische Phase (Aufwärtsbewegung):** Atme ein. Beuge die Ellenbogen und
    ziehe die Langhantel kontrolliert nach oben, indem du bewusst den Bizeps anspannst.
    Die Ellenbogen bleiben während der gesamten Bewegung fixiert und eng am Körper
    – sie dienen als Drehpunkt. Vermeide jegliches Schwungholen aus dem Oberkörper,
    der Fokus liegt rein auf der Armbeugung.'
  - '**Spitzenkontraktion:** Hebe die Hantel bis kurz bevor die Unterarme die Bizeps
    berühren oder bis zum Punkt der maximalen Bizepskontraktion. Halte diese Position
    für einen kurzen Moment (1-2 Sekunden), um die maximale Spannung im Bizeps zu
    spüren und die Mind-Muscle-Connection zu intensivieren.'
  - '**Exzentrische Phase (Abwärtsbewegung):** Atme aus. Senke die Langhantel langsam
    und hochkontrolliert über den gleichen Bewegungspfad zurück in die Startposition.
    Die Abwärtsbewegung sollte etwa doppelt so lange dauern wie die Aufwärtsbewegung
    (z.B. 2 Sekunden hoch, 4 Sekunden runter). Achte darauf, das Gewicht nicht einfach
    ''fallen zu lassen'', sondern die Spannung im Bizeps während der gesamten exzentrischen
    Phase beizubehalten.'
  - '**Voller Bewegungsradius:** Strecke die Arme am unteren Punkt vollständig aus,
    um den Bizeps maximal zu dehnen und den vollen Bewegungsradius zu nutzen. Dies
    maximiert den Trainingsreiz und fördert die Flexibilität der Ellenbogenbeuger.
    Vermeide ein Überstrecken der Gelenke.'
  common_errors:
  - '**Schwungholen (Cheating):** Der häufigste Fehler ist der Einsatz des Oberkörpers
    (nach hinten lehnen oder schwingen), um die Hantel nach oben zu ''schleudern''.
    Dies entlastet den Bizeps erheblich, verringert den Trainingseffekt und erhöht
    das Verletzungsrisiko für den unteren Rücken. Halte den Rumpf während der gesamten
    Bewegung stabil und bewege nur die Unterarme.'
  - '**Ellenbogenbewegen:** Das Bewegen der Ellenbogen nach vorne oder zur Seite reduziert
    die Isolation des Bizeps und aktiviert stattdessen andere Muskelgruppen wie die
    vordere Schulter. Die Ellenbogen sollten wie ein Drehpunkt fixiert am Körper bleiben.
    Stelle dir vor, sie sind an deinem Oberkörper ''festgeklebt''.'
  - '**Unvollständiger Bewegungsradius:** Das Nicht-vollständige-Strecken der Arme
    am unteren Punkt oder das Nicht-weit-genug-Hochziehen der Hantel verhindert eine
    maximale Dehnung und Kontraktion des Bizeps. Nutze den vollen Bewegungsradius
    für optimale Ergebnisse in Bezug auf Muskelwachstum und Kraftentwicklung.'
  - '**Zu schnelles Absenken (Dropping the Weight):** Wenn das Gewicht auf dem Weg
    nach unten einfach ''fallen gelassen'' wird, geht ein großer Teil des Trainingsreizes
    verloren. Die exzentrische (absenkende) Phase ist entscheidend für Muskelwachstum
    und Kraftzuwachs. Senke die Hantel immer langsam und kontrolliert ab, um die Muskeln
    maximal zu fordern.'
  - '**Verkrampfter Griff:** Ein übermäßig fester Griff kann zu einer vorzeitigen
    Ermüdung der Unterarme führen und die Konzentration vom eigentlichen Zielmuskel,
    dem Bizeps, ablenken. Halte einen festen, aber entspannten Griff, der das Gewicht
    sicher hält, ohne die Unterarme übermäßig zu beanspruchen.'
  original_description:
  - 'Halte die Hantel mit etwa schulterbreitem Griff, die Arme sind ausgestreckt.
    Beuge die Arme und brige die Hantel mit einer schnellen Bewegung nach oben. Ohne
    Pause wird das Gewicht nun kontrolliert nach unten gebracht. Beachte, dass die
    Bewegung nach oben schneller ist als nach unten.

    Während des Bewegungablaufs sollte der Körper nicht mitschwingen. Die Ellenbogen
    bleiben dabei immer an der Stelle.'
