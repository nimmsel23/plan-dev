  coaching_notes:
  - Stelle die Kabel tief ein und nimm eine stabile vorgebeugte Position ein, sodass
    der Oberkörper klar nach vorne geneigt bleibt und der Zug sauber auf den hinteren
    Delt trifft.
  - Halte Brustbein lang, Bauch fest und Wirbelsäule neutral; die Bewegung kommt aus
    dem Schultergelenk, nicht aus Schwung im Rumpf.
  - Führe die Arme mit leicht gebeugten Ellbogen nach außen hinten und halte diesen
    Ellbogenwinkel über die ganze Wiederholung konstant.
  - Denke daran, die Oberarme auseinanderzuziehen, statt die Griffe mit den Händen
    nach hinten zu reißen; so bleibt die Spannung auf dem hinteren Deltoid.
  - Ziehe bis ungefähr auf Schulterlinie oder knapp darunter und stoppe dort, wo du
    den hinteren Delt maximal spürst, ohne ins Hohlkreuz oder Schulterzucken zu fallen.
  - Lass die Schulterblätter kontrolliert mitarbeiten, aber übertreibe die Retraktion
    nicht; zuerst soll der hintere Delt die Bewegung einleiten.
  - Nutze am unteren Punkt die gedehnte Position bewusst und kehre kontrolliert um,
    ohne die Gewichte aufeinanderprallen zu lassen.
  - Wähle ein Gewicht, das dir saubere Wiederholungen mit klarer Endposition erlaubt;
    bei Rear-Delt-Arbeit ist lokale Kontrolle wichtiger als Last.
  - Halte den Nacken lang und die Schultern weg von den Ohren, damit der obere Trapez
    nicht die Arbeit des hinteren Deltoids übernimmt.
  - Atme ruhig, brace den Rumpf vor jeder Wiederholung und halte die Körperposition
    von der ersten bis zur letzten Wiederholung identisch.
  common_errors:
  - Zu aufrechter Oberkörper, wodurch die Übung eher in Richtung oberer Rücken statt
    hinterer Schulter verschoben wird.
  - Schwung aus Hüfte oder Rücken holen, um die Griffe zu beschleunigen, statt die
    Wiederholung muskulär zu kontrollieren.
  - Die Schultern hochziehen und damit den oberen Trapez dominieren lassen.
  - Die Ellbogen während der Bewegung stark beugen oder strecken, sodass aus dem Fly
    eine andere Zugbewegung wird.
  - Mit den Händen ziehen, statt die Oberarme zu führen; dadurch sinkt die Spannung
    auf dem hinteren Deltoid.
  - Zu weit nach hinten ziehen und dabei ins Hohlkreuz gehen oder die Rippen aufklappen.
  - Die exzentrische Phase fallen lassen und die Spannung am unteren Punkt verlieren.
  - Zu viel Gewicht wählen und deshalb nur halbe Wiederholungen oder unsaubere Endpositionen
    erreichen.
  - Die Schulterblätter sofort maximal zusammenpressen, sodass die Bewegung aus dem
    Rücken statt aus dem Schultergelenk gestartet wird.
  - Den Kopf nach vorne schieben oder den Nacken verspannen, anstatt die Halswirbelsäule
    neutral zu halten.
