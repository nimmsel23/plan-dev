  coaching_notes:
  - Strecken Sie die Beine nach oben und heben Sie das Becken mit einer klaren Einrollbewegung Richtung Decke an.
  - Denken Sie daran, die Fersen aktiv nach oben zu schicken statt nur die Beine zu wippen.
  - Senken Sie das Becken kontrolliert ab, ohne die Spannung im unteren Bauch zu verlieren.
  common_errors:
  - Das Becken wird nur minimal bewegt und die Übung wird zu reinem Beinhalten.
  - Schwung aus den Beinen ersetzt die aktive Crunch-Komponente.
  - Der Nacken presst in den Boden, obwohl die Bewegung aus dem Rumpf kommen soll.
