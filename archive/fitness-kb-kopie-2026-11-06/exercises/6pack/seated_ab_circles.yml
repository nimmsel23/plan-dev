  coaching_notes:
  - Lehnen Sie den Oberkörper leicht zurück und halten Sie die Brust stabil, während die Beine einen Kreis zeichnen.
  - Denken Sie an eine gleichmäßige Kreisbahn statt an hektische Richtungswechsel.
  - Atmen Sie ruhig weiter und halten Sie die Spannung tief im Bauch, nicht nur vorne sichtbar.
  common_errors:
  - Die Kreisbewegung wird fast nur aus den Beinen und nicht aus dem Rumpf gesteuert.
  - Der Oberkörper kippt bei jeder Runde stark zurück.
  - Die Füße werden einfach geschleudert, ohne saubere Kontrolle über die Endpunkte.
