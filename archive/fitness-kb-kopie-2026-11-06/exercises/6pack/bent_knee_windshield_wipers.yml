  coaching_notes:
  - Halten Sie Arme und Schulterblätter breit am Boden, während die gebeugten Beine von Seite zu Seite kippen.
  - Bremsen Sie den Richtungswechsel aktiv über die Schrägbauchmuskeln ab.
  - Wählen Sie nur so viel Bewegungsradius, wie Sie ohne Abheben der Rippen kontrollieren können.
  common_errors:
  - Die Knie fallen einfach seitlich herunter und werden nicht aktiv zurückgeholt.
  - Eine Schulter hebt ab und nimmt die Rotationskontrolle aus dem Rumpf.
  - Das Tempo ist höher als die Fähigkeit, den unteren Rücken sauber zu stabilisieren.
