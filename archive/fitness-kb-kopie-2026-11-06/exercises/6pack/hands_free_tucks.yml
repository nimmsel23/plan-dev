  coaching_notes:
  - Balancieren Sie ohne Handstütze in einer leichten V-Sit-Position und ziehen Sie die Knie kontrolliert zum Oberkörper.
  - Halten Sie Brustkorb und Becken aktiv gekoppelt, damit die Spannung nicht nur über Hüftbeuger läuft.
  - Arbeiten Sie mit ruhigem Tempo und klaren Endpunkten statt mit Pendelbewegung.
  common_errors:
  - Der Oberkörper kippt zurück und die Übung wird nur durch Balance gerettet.
  - Die Füße werden nach vorne geschleudert und wieder eingefangen.
  - Die Hände rudern stark mit, obwohl die Stabilität aus dem Rumpf kommen soll.
