  coaching_notes:
  - Sitzen Sie aufrecht an, stützen Sie die Hände leicht hinter dem Körper und ziehen Sie die Knie kontrolliert zur Brust.
  - Rollen Sie das Becken aktiv nach hinten ein, damit der Zug aus dem unteren Bauch und nicht aus Schwung entsteht.
  - Strecken Sie die Beine nur so weit, wie Sie die Lendenwirbelsäule unter Kontrolle halten können.
  common_errors:
  - Das Zurücklehnen wird mit Schulterzug statt mit Rumpfspannung gehalten.
  - Die Beine werden mit Schwung hineingeworfen und nicht kontrolliert getuckt.
  - Der untere Rücken fällt beim Ausstrecken ins Hohlkreuz.
