  coaching_notes:
  - Finden Sie zuerst eine stabile V-Sit- oder Tuck-Position und rotieren Sie dann kontrolliert von Seite zu Seite.
  - Lassen Sie Rippen und Becken gekoppelt, damit die Rotation aus dem Rumpf und nicht aus losem Armwerfen kommt.
  - Halten Sie den Brustkorb lang und die Füße möglichst ruhig in der Luft.
  common_errors:
  - Die Arme schlagen nur von links nach rechts, während der Rumpf kaum mitarbeitet.
  - Der untere Rücken kollabiert im Tuck.
  - Die Knie werden unkontrolliert eingezogen und gestreckt, statt eine feste Position zu halten.
