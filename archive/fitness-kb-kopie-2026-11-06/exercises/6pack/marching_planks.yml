  coaching_notes:
  - Halten Sie die Plank-Linie stabil und heben Sie jeweils nur einen Fuß wenige Zentimeter vom Boden ab.
  - Vermeiden Sie sichtbares Beckenpendeln; der Wert der Übung liegt in der Anti-Rotationskontrolle.
  - Drücken Sie aktiv über Unterarme und Ballen in den Boden, damit der obere Rücken mitarbeitet.
  common_errors:
  - Die Hüfte kippt bei jedem Schritt nach links und rechts.
  - Die Füße werden zu hoch angehoben und die Spannung im Rumpf geht verloren.
  - Die Schultern sinken zwischen den Armen ein.
