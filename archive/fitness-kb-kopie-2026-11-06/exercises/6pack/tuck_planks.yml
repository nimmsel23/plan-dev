  coaching_notes:
  - Ziehen Sie aus der Plank-Position ein Knie kontrolliert Richtung Brust und halten Sie den Rest des Körpers ruhig.
  - Wenn die App links und rechts einzeln zählt, behandeln Sie beide Seiten als dieselbe Übung mit Seitenwechsel.
  - Halten Sie Schulterdruck und Bauchspannung konstant, statt im Tuck einzusacken.
