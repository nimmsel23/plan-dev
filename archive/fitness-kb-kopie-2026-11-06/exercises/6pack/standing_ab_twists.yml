  coaching_notes:
  - Richten Sie sich auf und rotieren Sie Brustkorb und Becken koordiniert gegeneinander in einen aktiven Kniehub.
  - Halten Sie die Bewegung elastisch, aber vermeiden Sie loses Armfuchteln ohne Rumpfansteuerung.
  - Nutzen Sie den Standfuß aktiv, damit die Rotation sauber aus dem Körperzentrum übertragen wird.
  common_errors:
  - Die Arme schwingen nur quer durch den Raum, während der Rumpf starr bleibt.
  - Der Standfuß kollabiert und die Bewegung verliert Balance.
  - Das Tempo steigt, bevor eine saubere Kniehub-Rotation kontrolliert werden kann.
