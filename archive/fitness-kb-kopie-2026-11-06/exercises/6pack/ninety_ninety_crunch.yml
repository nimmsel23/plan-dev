  coaching_notes:
  - Halten Sie Hüfte und Knie in etwa 90 Grad, damit der untere Rücken leichter flach bleiben kann.
  - Rollen Sie Brustbein und Rippen weich nach vorne ein, statt nur den Kopf anzuheben.
  - Machen Sie jede Wiederholung kurz und sauber, mit klarer Endkontraktion im oberen Bauch.
  common_errors:
  - Am Nacken ziehen, statt den Oberkörper über die Bauchwand zu beugen.
  - Die Beine verlieren die 90/90-Position und übernehmen die Bewegung.
  - Zu weit hochsitzen und dadurch aus dem Crunch einen Sit-up machen.
