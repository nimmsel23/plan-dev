  coaching_notes:
  - Führen Sie einen sauberen Crunch aus und rotieren Sie oben kontrolliert zur Seite, statt beide Bewegungen zu verschmieren.
  - Halten Sie die Rippen weich unten und holen Sie die Rotation aus dem Rumpf, nicht nur aus den Ellenbogen.
  - Jede Wiederholung sollte in der Mitte neu Spannung aufbauen, bevor die nächste Seite kommt.
  common_errors:
  - Nur der Ellenbogen wandert zur Gegenseite, während der Oberkörper kaum rotiert.
  - Das Tempo wird so hoch, dass weder Crunch noch Twist sauber abgeschlossen werden.
  - Unten wird komplett abgelegt und die Serie verliert durchgehende Spannung.
