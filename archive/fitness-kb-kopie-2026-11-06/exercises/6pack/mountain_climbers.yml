  coaching_notes:
  - Bleiben Sie in einer starken High-Plank und ziehen Sie die Knie schnell, aber sauber unter den Körper.
  - Halten Sie Schultern über den Händen und den Oberkörper möglichst ruhig.
  - Nutzen Sie ein zügiges Tempo nur, wenn Becken und Rumpfposition stabil bleiben.
  common_errors:
  - Die Hüfte springt hoch und macht die Übung zu einem Sprint statt zu Core-Arbeit.
  - Die Schritte sind kurz und hektisch, ohne dass die Knie wirklich unter den Körper kommen.
  - Die Schulterlinie wandert bei jeder Wiederholung nach hinten weg.
