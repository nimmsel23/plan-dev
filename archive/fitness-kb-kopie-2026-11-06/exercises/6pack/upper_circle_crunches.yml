  coaching_notes:
  - Heben Sie den oberen Rücken in einen Crunch und zeichnen Sie aus dieser Position kleine kontrollierte Kreise.
  - Lassen Sie die Kreise aus dem Brustkorb und Rumpf kommen, nicht aus Kopf- oder Armbewegungen.
  - Halten Sie die Bauchspannung oben konstant, statt zwischen den Kreisen abzulegen.
  common_errors:
  - Die Kreise werden zu groß und die Crunch-Position geht verloren.
  - Der Kopf führt die Bewegung statt des Oberkörpers.
  - Unten wird nach jeder Teilbewegung entspannt.
