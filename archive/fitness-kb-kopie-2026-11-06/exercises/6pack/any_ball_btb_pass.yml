  - Wenn kein Ball da ist, kann derselbe Bewegungsablauf trocken nachgebaut werden.
  common_errors:
  - Der Oberkörper fällt zwischen den Übergaben jedes Mal komplett ab.
  - Die Rotation wird nur aus den Armen gemacht.
  - Das Tempo steigt, bevor die Übergaben sauber und symmetrisch sind.
