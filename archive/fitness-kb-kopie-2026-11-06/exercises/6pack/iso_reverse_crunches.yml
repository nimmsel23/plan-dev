  coaching_notes:
  - Ziehen Sie die Knie über die Bauchspannung zur Brust und halten Sie die eingerollte Beckenposition kurz fest.
  - Denken Sie an ein Einrollen des Beckens vom Boden weg statt an bloßes Hochschwingen der Beine.
  - Senken Sie nur so weit ab, wie die Lendenwirbelsäule Kontakt und Kontrolle behält.
  common_errors:
  - Die Bewegung wird mit Schwung aus den Beinen gestartet.
  - Die Hüfte fällt unten komplett zurück und jede Wiederholung beginnt aus dem Hohlkreuz.
  - Der Nacken spannt unnötig mit, obwohl die Arbeit im unteren Bauch liegen sollte.
