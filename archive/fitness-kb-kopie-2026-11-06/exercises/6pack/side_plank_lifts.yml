  coaching_notes:
  - Stapeln Sie Schulter, Rippen und Becken sauber übereinander, bevor Sie die Hüfte anheben.
  - Heben und senken Sie die Hüfte kontrolliert, ohne in der Schulter einzusacken.
  - Halten Sie Kopf und Brustkorb lang, statt die Bewegung über die Halswirbelsäule zu kompensieren.
  common_errors:
  - Die obere Schulter rollt nach vorne und nimmt die Last aus den Schrägbauchmuskeln.
  - Die Hüfte fällt unten komplett weg und der Rebound übernimmt die Arbeit.
  - Die Beine werden weich und die Seitlinie verliert Spannung.
