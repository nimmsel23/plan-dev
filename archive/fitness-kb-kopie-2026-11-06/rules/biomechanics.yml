# Biomechanical Consistency Rules
# New exercise `category` values are Primal Movement Pattern buckets:
# push, pull, squat, lunge, gait, twist, carry. Old `movement_pattern` values
# remain here as compatibility aliases while legacy exercises are migrated.

primal_movement_rules:
  push:
    required_primary: [chest, shoulders, arms, 101_pectoralis_major, 102_pectoralis_major_clavicular, 103_pectoralis_major_sternal, 301_anterior_deltoid, 302_lateral_deltoid, 401_triceps_brachii]
    description: "Push patterns should target chest, shoulders, and/or triceps."

  pull:
    required_primary: [back, middle_back, upper_back, lower_back, shoulders, arms, bizeps, hamstrings, glutes, 201_latissimus_dorsi, 202b_trapezius_middle, 202c_trapezius_lower, 205_rhomboids, 206_erector_spinae, 303_posterior_deltoid, 304_rotator_cuff, 306_infraspinatus, 307_teres_minor, 402_biceps_brachii, 403_brachialis, 603_gluteus_maximus, 604a_biceps_femoris, 604b_semitendinosus, 604c_semimembranosus]
    description: "Pull patterns should target back, elbow flexors, rear shoulder, or posterior chain."

  horizontal_press:
    required_primary: [chest, 101_pectoralis_major, 102_pectoralis_major_clavicular, 103_pectoralis_major_sternal]
    description: "Horizontal pressing should target the chest."
  
  vertical_press:
    required_primary: [shoulders, 301_anterior_deltoid, 302_lateral_deltoid]
    description: "Vertical pressing should target the shoulders."
    
  vertical_pull:
    required_primary: [back, upper_back, 201_latissimus_dorsi]
    description: "Vertical pulling should target the lats/back."
    
  horizontal_pull:
    required_primary: [back, middle_back, rhomboids, 202b_trapezius_middle, 202c_trapezius_lower, 205_rhomboids, 201_latissimus_dorsi]
    description: "Horizontal pulling (rows) should target the back (lats, trapezius, rhomboids)."
    
  squat:
    required_primary: [quadriceps, legs, 601_quadriceps_femoris]
    description: "Squat patterns should target the quadriceps."

  lunge:
    required_primary: [quadriceps, glutes, 601_quadriceps_femoris, 603_gluteus_maximus]
    description: "Lunge patterns should target quads and/or glutes."

  gait:
    required_primary: [legs, quadriceps, glutes, hamstrings, calves, 601_quadriceps_femoris, 603_gluteus_maximus, 701_gastrocnemius]
    description: "Gait patterns should target the lower body locomotion chain."

  twist:
    required_primary: [abs, 502_obliquus_externus, 503_obliquus_internus, 504_transverse_abdominis]
    description: "Twist patterns should target trunk rotation or anti-rotation."

  carry:
    required_primary: [abs, lower_back, upper_back, shoulders, 501_rectus_abdominis, 504_transverse_abdominis, 206_erector_spinae, 202a_trapezius_upper]
    description: "Carry patterns should target bracing, posture, and load carriage."
    
  hinge:
    required_primary: [glutes, hamstrings, lower_back, 603_gluteus_maximus, 604a_biceps_femoris, 206_erector_spinae]
    description: "Hinge patterns (deadlifts) should target the posterior chain."

isolation_rules:
  max_primary_muscles: 2
  description: "Isolation exercises should usually target only 1 or 2 primary muscles."
