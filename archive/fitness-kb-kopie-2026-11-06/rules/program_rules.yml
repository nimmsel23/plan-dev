program_rules:
  # default_split zeigte bisher auf "full_body" - ein Template das nie existiert
  # hat (nur push_day/pull_day/legs_day gab's je). build_plan() ohne Argumente
  # ist damit immer mit "Unknown plan template: full_body" gecrasht - nie
  # bemerkt, weil build_plan() nie ohne explizites template/day aufgerufen wurde.
  default_template: push_day
  coverage_defaults:
    sets: 1
    rpe: 8
  # Wochen-Ebene: welche Tages-Templates in welcher Reihenfolge eine Woche
  # ergeben. Tag ohne Eintrag oder mit null = Ruhetag. Neu (vorher gab's das
  # nicht - max_sessions_per_week: 4 war eine Zahl ohne jede Verbindung zu den
  # Templates, nirgends benutzt, um tatsächlich eine Woche zusammenzubauen).
  default_program: ppl_3day
  splits:
    ppl_3day:
      label: "Push/Pull/Legs (3x/Woche)"
      days:
        mo: push_day
        di: null
        mi: pull_day
        do: null
        fr: legs_day
        sa: null
        so: null
    ppl_6day:
      label: "Push/Pull/Legs (6x/Woche)"
      days:
        mo: push_day
        di: pull_day
        mi: legs_day
        do: push_day
        fr: pull_day
        sa: legs_day
        so: null
  templates:
    push_day:
      slots:
        # 041 = einziger noch gueltige Expert-ID (User-approved). Restliche
        # choose_from-Eintraege sind Bulk-Fallback (wger_*/yuhonas_*,
        # unreviewed) - keine Expert-Alternative existiert aktuell im Katalog,
        # nur so bleibt der Slot ueberhaupt befuellbar. Bei Katalog-Kuration
        # durch Expert-IDs ersetzen, sobald vorhanden.
        - name: main_chest_press
          choose_from:
            - 041
            - wger_1788
        - name: secondary_press
          choose_from:
            - yuhonas_incline_dumbbell_press
            - yuhonas_seated_dumbbell_press
        - name: shoulder_press_or_raise
          choose_from:
            - wger_687
            - wger_1580
        - name: chest_isolation
          choose_from:
            - wger_1689
            - wger_1425
        - name: triceps_isolation
          choose_from:
            - wger_1185
            - wger_1781
    pull_day:
      slots:
        # 020/021 = Expert-IDs (User-approved), bleiben erste Wahl. Rest Bulk-Fallback.
        - name: vertical_pull
          choose_from:
            - 020
            - 021
        - name: horizontal_pull
          choose_from:
            - wger_448
            - iso_lateral_row_high
        - name: secondary_row_or_pulldown
          choose_from:
            - wger_1466
            - wger_1785
        - name: rear_delt_or_face_pull
          choose_from:
            - face_pull
            - wger_222
        - name: biceps_movement
          choose_from:
            - yuhonas_dumbbell_bicep_curl
            - yuhonas_machine_bicep_curl
    legs_day:
      slots:
        # 061/080/081/402 = Expert-IDs (User-approved), bleiben erste Wahl. Rest Bulk-Fallback.
        - name: main_squat
          choose_from:
            - 061
            - yuhonas_barbell_squat
        - name: main_hinge
          choose_from:
            - 081
            - 080
        - name: unilateral_or_machine
          choose_from:
            - wger_1692
            - yuhonas_leg_press
        - name: hamstring_isolation
          choose_from:
            - 402
            - yuhonas_lying_leg_curls
        - name: calves
          choose_from:
            - wger_1422
            - yuhonas_donkey_calf_raises
        - name: core_optional
          choose_from:
            - plank
            - wger_167
