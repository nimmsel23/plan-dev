# yuhonas/free-exercise-db: primaryMuscles/secondaryMuscles-Labels → Katalog-Muskel-ID → FMA.
#
# Quelle: github.com/yuhonas/free-exercise-db, dist/exercises.json (Stand 2026-10-22,
# 876 Übungen, 17 verschiedene Labels). Die Labels sind freie Gruppen-Namen, keine
# Muskel-IDs. Die tatsächliche Auflösung läuft über muscle_index.yml → string_aliases
# (siehe core/muscle_normalization.py::canonicalize_muscle_id). Diese Datei ist die
# lesbare Übersicht derselben Zuordnung plus FMA-Bezug; bei Änderungen beide Dateien
# synchron halten (Test: tests/test_yuhonas_muscle_labels.py).
#
# status:
#   direct  — Label entspricht genau einem Muskel-Konzept (fma_id vorhanden)
#   group   — Label ist eine Muskelgruppe, Ziel ist die Gruppen-ID (kein FMA-Whole-Muscle)
#   context — Label wird erst über den Übungsnamen aufgelöst (refine_generic_region_labels)
#   none    — kein Katalog-Muskel vorhanden, bewusst nicht gemappt
