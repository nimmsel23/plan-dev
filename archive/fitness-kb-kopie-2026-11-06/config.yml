app:
  name: fitness-agent
  version: 0.1.0
  language: de

paths:
  root: "~/.aos/fitness"
  exercises: "~/.aos/fitness/exercises"
  muscles: "~/.aos/fitness/muscles"
  rules: "~/.aos/fitness/rules"
  maps: "~/.aos/fitness/maps"
  anatomy_teaching: "~/.aos/fitness/anatomy_teaching"
  state: "~/.aos/fitness/agent-state"
  cache: "~/.aos/fitness/cache"
  exports: "~/.aos/fitness/exports"

obsidian:
  enabled: true
  vault_path: "/tmp/Obsidian/Vitaltrainer"
  export_path: "/tmp/Obsidian/Vitaltrainer/Fitness-Agent"

wger:
  enabled: true
  base_url: "http://localhost"
  api_token_env: "WGER_API_TOKEN"
  timeout_seconds: 10

external_dbs:
  yuhonas_free_exercise_db:
    enabled: false
    local_path: "~/code/free-exercise-db"
    cache_file: "~/.aos/fitness/cache/external_exercises.json"

behavior:
  source_of_truth: custom_yaml
  uncertain_mappings_require_review: true
  backup_before_write: true
  default_output_format: markdown_obsidian
