id: 201_latissimus_dorsi
fma_id: FMA:13357
display_name: Latissimus Dorsi
label_de: Breiter Rückenmuskel
label_en: Lats
label_lat: M. latissimus dorsi
wger_id: 12
aliases: [lats, latissimus, back]
origin: Dornfortsätze der unteren 6 Brustwirbel (Processus spinosi Th7-Th12), Fascia
  thoracolumbalis, Darmbeinkamm (Crista iliaca), untere 3-4 Rippen (Costae 9-12) und
  Angulus inferior der Scapula
insertion: Crista tuberculi minoris des Humerus
innervation: Nervus thoracodorsalis (Segmente C6-C8)
function: Adduktor und Innenrotator des Arms, Retroversion des Arms; unterstützt
  bei fixiertem Oberarm das Anheben des Rumpfes.
