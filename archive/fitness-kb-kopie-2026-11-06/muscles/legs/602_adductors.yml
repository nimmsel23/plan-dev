    - adductors-right
origin: Ursprung (Origo) — Ramus inferior ossis pubis (unterer Schambeinast), Corpus
  ossis pubis (Schambeinkörper), Ramus ossis ischii (Sitzbeinast) und Tuber ischiadicum
  (Sitzbeinhöcker).
insertion: Ansatz (Insertio) — Linea pectinea femoris (Pectineallinie des Oberschenkelknochens),
  Linea aspera femoris (raue Linie des Oberschenkelknochens), Tuberculum adductorium
  epicondyli medialis femoris (Adduktoren-Tuberkel des medialen Femurkondylus) sowie
  die mediale Fläche der Tibia (Facies medialis tibiae) für den Musculus gracilis.
innervation: Nervus obturatorius (L2-L4), teilweise Nervus femoralis (L2-L3) und Nervus
  ischiadicus (L4-S3) für den ischiokruralen Anteil des Musculus adductor magnus.
function: Hauptfunktion ist die Adduktion des Oberschenkels (Adductio femoris) im
  Hüftgelenk (Articulatio coxae). Einzelne Muskeln der Gruppe beteiligen sich zudem
  an der Flexion oder Extension des Oberschenkels, dessen Rotation sowie an der Kniebeugung
  und Innenrotation des Unterschenkels.
