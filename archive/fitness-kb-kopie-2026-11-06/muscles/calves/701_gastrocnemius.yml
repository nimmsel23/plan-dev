- gastrocnemius
viz:
  body_muscles:
    view: BACK
    ids:
    - calves-gastroc-medial-left
    - calves-gastroc-lateral-left
    - calves-gastroc-medial-right
    - calves-gastroc-lateral-right
origin: Facies poplitea des Femurs (oberhalb der Kondylen) über zwei Sehnenköpfe am
  Epicondylus medialis (Caput mediale) und Epicondylus lateralis (Caput laterale).
insertion: Über die Achillessehne (Tendo calcaneus) an der Tuber calcanei des Fersenbeins
  (Calcaneus).
innervation: Nervus tibialis (S1–S2)
function: Plantarflexion im oberen Sprunggelenk sowie Flexion im Kniegelenk. Er ist
  maßgeblich für die Abstoßbewegung beim Gehen und Laufen verantwortlich.
