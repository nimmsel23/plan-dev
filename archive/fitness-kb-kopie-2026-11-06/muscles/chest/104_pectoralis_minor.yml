aliases:
- kleiner brustmuskel
- pectoralis minor
viz: null
origin: Laterale Fläche und obere Ränder der 3., 4. und 5. Rippe, nahe ihrer Knorpel-Knochen-Grenze
  (costochondral junction).
insertion: Processus coracoideus der Scapula (medialer Rand und obere Fläche).
innervation: Nervus pectoralis medialis (C8, T1).
function: Zieht die Scapula nach ventral und kaudal (Protraktion und Depression).
  Bei fixierter Scapula hebt er als Atemhilfsmuskel die 3. bis 5. Rippe an und unterstützt
  die Inspiration.
