id: 105_serratus_anterior
fma_id: FMA:13397
display_name: Serratus Anterior
label_de: Vorderer Sägemuskel
label_en: Serratus
label_lat: M. serratus anterior
wger_id: 3
aliases:
- serratus
viz:
  body_muscles:
    view: FRONT
    ids:
    - serratus-anterior-left
    - serratus-anterior-right
origin: Äußere Flächen der 1. bis 9. Rippe.
insertion: Margo medialis der Scapula (vor allem Angulus superior und inferior).
innervation: Nervus thoracicus longus (C5-C7).
function: Stabilisiert die Scapula an der Thoraxwand durch Protraktion und Fixation
  und ermöglicht die Aufwärtsrotation der Scapula, wichtig für eine stabile Schulterachse
  beim Drücken.
