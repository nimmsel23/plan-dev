id: 400_arms
label_de: Arme
label_en: Arms
label_lat: Membrum superius
# id im "X00_"-Format zwingt bucketRank() in src/lib/db/shared/muscle.js auf
# Rang 1 (immer zuletzt sortiert) — ohne das gewinnt "Arme" bei der
# ascending-muscle-count-Sortierung fälschlich 404/405/406/407 VOR
# forearms.yml (das durch seine feingranularen a/b/c/d-Subvarianten mehr
# Einträge zählt als dieses Sammel-File, obwohl es das spezifischere Ziel
# ist) — sichtbarer Effekt: "Arme" tauchte zusätzlich zu Bizeps/Trizeps als
# eigene Region in der relativen Muskelbelastung auf, obwohl es rein
# Fallback sein soll (analog back.yml/legs.yml).
muscles:
  - 401_triceps_brachii
  - 402_biceps_brachii
  - 403_brachialis
  - 404_brachioradialis
  - 405_forearm_flexors
  - 406_forearm_extensors
  - 407_anconeus
