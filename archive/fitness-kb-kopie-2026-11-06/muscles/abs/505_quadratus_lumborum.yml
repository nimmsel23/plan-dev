id: 505_quadratus_lumborum
fma_id: FMA:15569
display_name: Quadratus Lumborum
label_de: Quadratischer Lendenmuskel
label_en: QL
label_lat: M. quadratus lumborum
wger_id: ~
aliases: [quadratus lumborum, quadratischer lendenmuskel, unterer rücken, lower back]
origin: Crista iliaca (hinterer Abschnitt) und Ligamentum iliolumbale
insertion: Margo inferior der 12. Rippe (Costa XII) und Processus transversi der
  Lendenwirbel L1-L4
innervation: Nervus subcostalis (Th12) und Rami anteriores der Spinalnerven (L1-L3)
function: Seitwärtsneigung der Wirbelsäule bei einseitiger Kontraktion sowie
  Fixierung/Senkung der 12. Rippe bei der Atmung. Bei beidseitiger Kontraktion
  unterstützt er die Extension der Lendenwirbelsäule.
viz:
  body_muscles:
    view: BACK
    ids: [lower-back-ql-left, lower-back-ql-right]
