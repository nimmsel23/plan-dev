  instructions:
  - 'Grab the pull-up bar with the palms facing forward using the prescribed grip.
    Note on grips: For a wide grip, your hands need to be spaced out at a distance
    wider than your shoulder width. For a medium grip, your hands need to be spaced
    out at a distance equal to your shoulder width and for a close grip at a distance
    smaller than your shoulder width.'
  - As you have both arms extended in front of you holding the bar at the chosen grip
    width, bring your torso back around 30 degrees or so while creating a curvature
    on your lower back and sticking your chest out. This is your starting position.
  - 'Pull your torso up until the bar touches your upper chest by drawing the shoulders
    and the upper arms down and back. Exhale as you perform this portion of the movement.
    Tip: Concentrate on squeezing the back muscles once you reach the full contracted
    position. The upper torso should remain stationary as it moves through space and
    only the arms should move. The forearms should do no other work other than hold
    the bar.'
  - After a second on the contracted position, start to inhale and slowly lower your
    torso back to the starting position when your arms are fully extended and the
    lats are fully stretched.
  - Repeat this motion for the prescribed amount of repetitions.
  coaching_notes:
  - 'Vor dem Training gezielt Finger, Handgelenke und Unterarme aufwärmen: zuerst
    leichte Hänge und Schulterübungen, dann mit steigender Intensität an größeren
    Leisten arbeiten.'
  - 'Aktiver Start: Aus dem Hang zuerst die Schulterblätter sanft nach unten setzen,
    Rippen unten halten und den Rumpf anspannen, bevor du ziehst.'
  - Ellbogen nach unten und hinten Richtung Hüfte bzw. Flanken führen. So arbeiten
    Latissimus und oberer Rücken, statt dass nur die Arme beugen.
  - Der Obergriff belastet Latissimus, Teres major und oberen Rücken etwas stärker
    als der Untergriff (Chin-Up) und den Bizeps etwas weniger.
  - 'Volle, kontrollierte Bewegung: oben den Brustkorb zur Leiste bringen, unten die
    Arme fast vollständig strecken und den Hang nicht verlieren.'
  - Die Abwärtsbewegung langsam und kontrolliert ausführen (etwa 2 bis 3 Sekunden).
    Das fördert Kraftaufbau, Sehnenstärke und Schulterkontrolle.
  - 'Griff: Die Leiste tief in der Hand halten und das Handgelenk stabil und leicht
    gestreckt lassen. Auf kleinen Leisten Halbkrallen (Half Crimp) statt Vollkrallen
    nutzen, um Fingerbeugesehnen und Ringbänder (A2-Pulley) zu schonen.'
  - 'Rumpf als ruhige Linie von Kopf bis Fuß halten: Gesäß und Bauch leicht anspannen,
    kein Hohlkreuz und kein Beinschwung.'
  - 'Wähle die Leistengröße passend zu deinem Stand: größere, fingerfreundlichere
    Leisten für Einsteiger, kleinere oder spezifische Griffarten erst mit Erfahrung.'
  common_errors:
  - Aus einem passiven Hang starten, ohne vorher Spannung im Schultergürtel aufzubauen.
    Das belastet Schultergelenk und Fingersehnen unnötig.
  - Die Schultern zu den Ohren ziehen, statt sie aktiv nach unten zu stabilisieren.
    Das führt zu Nackenverspannungen und verlorener Schulterblattposition.
  - Nur das Kinn über die Leiste bringen, statt den Brustkorb zur Leiste zu ziehen.
    Das ist eine verkürzte Wiederholung mit deutlich geringerem Trainingsreiz.
  - 'Halbe Wiederholungen: unten nicht vollständig strecken oder oben vorzeitig abbrechen.'
  - 'Kipping oder Beinschwung: Schwung ersetzt Muskelkraft und erhöht die Belastung
    von Schultern und Fingern.'
  - Den Kopf nach vorne schieben, um über die Leiste zu kommen, statt den Körper hochzuziehen.
  - 'Verlust der Rumpfspannung (Hohlkreuz oder aufklappende Rippen): Der Körper wird
    instabil und die Kraftübertragung leidet.'
  - 'Verkrampftes Vollkrallen auf kleinen Leisten: überlastet Ringbänder und Fingerbeugesehnen
    und führt zu schneller Griffermüdung.'
  - 'Die Exzentrik fallen lassen: unkontrolliertes, zu schnelles Absenken mindert
    den Trainingseffekt und erhöht das Verletzungsrisiko.'
  - 'Überbreiter Griff: schränkt die Bewegungsamplitude ein, belastet die Schultern
    ungünstig und verringert die Aktivierung des Latissimus.'
  - Fehlendes spezifisches Aufwärmen für Finger und Unterarme erhöht das Risiko für
    Sehnen- und Gelenkverletzungen deutlich.
