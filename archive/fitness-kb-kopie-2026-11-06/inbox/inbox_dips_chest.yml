  coaching_notes:
  - Greife die Stangen mit gestreckten Armen und Schultern weg von den Ohren, die
    Schulterblätter sind nach unten und hinten gezogen (leicht gepackt), bevor du
    die Abwärtsbewegung startest.
  - Neige den Oberkörper bewusst leicht nach vorne (ca. 20–30°) und lass die Knie
    leicht gebeugt, damit der Brustmuskel den Hauptanteil der Arbeit übernimmt. Der
    Ellenbogen zeigt dabei eher nach außen-hinten als eng am Körper.
  - Senke dich kontrolliert ab, bis die Oberarme etwa parallel zum Boden sind oder
    die Schultern leicht unter Brusthöhe liegen. Mehr Tiefe ist nur sinnvoll, wenn
    die Schulter schmerzfrei und stabil bleibt.
  - Drücke dich aus der Tiefe kraftvoll nach oben, ohne die Ellenbogen komplett durchzustrecken.
    So bleibt die Spannung im Trizeps und in der Brust erhalten und die Gelenke werden
    geschont.
  - Halte den Rumpf während der gesamten Bewegung stabil angespannt, Beine locker
    nach hinten, damit kein Schwung aus den Hüften entsteht.
  - 'Atme beim Absenken ein und beim Drücken aus. Tempo bewusst kontrollieren: ca.
    2–3 Sekunden nach unten, kurze Pause in der Tiefe, dann kraftvoll hoch.'
  common_errors:
  - 'Zu aufrechter Oberkörper: Dann arbeitet der Trizeps stärker und die Brust wird
    kaum belastet. Neige dich bewusst nach vorne.'
  - 'Schultern kippen nach vorne oder ziehen Richtung Ohren: Das belastet das Schultergelenk
    unnötig. Schultern aktiv nach unten und hinten halten.'
  - 'Zu tiefes Absenken mit gedehnter Schulter, besonders bei eingeschränkter Beweglichkeit
    oder Vorschädigung: Tiefe an die persönliche Schulterkapazität anpassen.'
  - Ellenbogen zeigen seitlich nach außen statt nach hinten-außen; das erhöht die
    Belastung auf Schulter und Sehnen.
  - Ruckartiger Schwung aus den Hüften oder Beinen statt kontrollierter Bewegung.
    Das reduziert den Reiz auf die Zielmuskulatur.
  - 'Vollständiges Durchstrecken der Ellenbogen oben: Die Spannung geht verloren und
    die Gelenke werden belastet. Oben leicht gebeugt beenden.'
  - 'Zu schnelles Absenken ohne Kontrolle: Verletzungsrisiko steigt, der exzentrische
    Reiz wird verschenkt.'
