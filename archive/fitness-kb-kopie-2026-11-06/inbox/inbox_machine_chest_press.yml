  coaching_notes:
  - Stellen Sie den Sitz so ein, dass die Griffe auf Höhe der mittleren Brust oder
    leicht darunter liegen, wenn die Arme ausgestreckt sind, um eine optimale Brustaktivierung
    zu gewährleisten.
  - Drücken Sie Ihren unteren Rücken fest gegen die Lehne und halten Sie eine leichte
    natürliche Krümmung im Lendenbereich. Schulterblätter aktiv nach hinten unten
    ziehen und fixieren, um die Schultern zu stabilisieren.
  - Fassen Sie die Griffe mit einem festen, neutralen oder leicht überhandgriff, die
    Handgelenke bleiben dabei gerade und stabil, um Überlastungen zu vermeiden.
  - Drücken Sie die Griffe kontrolliert nach vorne, bis die Arme fast vollständig
    gestreckt sind, ohne die Ellenbogen hart durchzudrücken (Hyperextension vermeiden).
  - Konzentrieren Sie sich darauf, die Brustmuskulatur bewusst zu kontrahieren. Atmen
    Sie während der Drückbewegung kräftig aus.
  - Führen Sie die Griffe langsam und kontrolliert (exzentrische Phase) zurück in
    die Ausgangsposition, bis eine gute Dehnung in der Brust spürbar ist, ohne dass
    die Schultern nach vorne rollen oder der Rücken sich von der Lehne löst.
  - Atmen Sie während der negativen Phase (Zurückführen) kontrolliert ein.
  common_errors:
  - Schultern werden während der Bewegung hochgezogen oder nach vorne gerollt, wodurch
    die vordere Schulter (anterior deltoid) übermäßig beansprucht wird und die Brustisolierung
    mindert.
  - Ein starkes Hohlkreuz oder Abheben des unteren Rückens von der Lehne, um mehr
    Gewicht zu bewegen, was zu einer Überlastung des unteren Rückens und einem Stabilitätsverlust
    führen kann.
  - Das Gewicht wird mit Schwung gedrückt und/oder unkontrolliert zurückfallen gelassen,
    wodurch die Muskeln nicht effektiv unter Spannung gehalten werden und das Verletzungsrisiko
    steigt.
  - Die Ellenbogen werden am Ende der Bewegung hart durchgestreckt oder überstreckt,
    was die Gelenke unnötig belastet und zu Schmerzen oder Verletzungen führen kann.
  - Abknicken der Handgelenke nach hinten oder vorne, was die Belastung auf die Handgelenksgelenke
    erhöht und zu Schmerzen oder Verletzungen führen kann.
