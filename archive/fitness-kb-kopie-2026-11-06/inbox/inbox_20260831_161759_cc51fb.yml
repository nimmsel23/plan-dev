  coaching_notes:
  - '**Fundament schaffen:** Platziere die Hände schulterbreit mit gespreizten Fingern.
    Presse die Handflächen und Fingerkuppen aktiv in den Boden, um eine breite und
    stabile Basis zu schaffen und feine Balancekorrekturen zu ermöglichen.'
  - '**Schultergürtel aktivieren:** Schiebe den Boden explosiv von dir weg und "wachse"
    aus den Schultern. Protrahiere die Schulterblätter (drücke sie nach vorne unten)
    und hebe sie leicht an (Elevation), während die Ellbogen vollständig gestreckt
    und arretiert bleiben. Dies schützt die Schultergelenke und sorgt für maximale
    Stabilität.'
  - '**Körperspannung aufbauen (Hohlkörper):** Spanne die Bauchmuskeln fest an, ziehe
    die Rippen nach innen und kontrahiere die Gesäßmuskulatur kraftvoll. Stelle dir
    vor, du bildest eine gerade, steife Linie vom Kopf bis zu den Zehen, um ein Hohlkreuz
    zu verhindern.'
  - '**Bein- und Fußposition:** Halte die Beine vollständig gestreckt und die Knie
    durchgedrückt. Spanne die Oberschenkelmuskulatur an und spitze die Füße aktiv,
    als ob du dich nach oben zum Himmel streckst.'
  - '**Blickpunkt:** Richte deinen Blick leicht nach vorne zwischen deine Hände oder
    auf einen festen Punkt auf dem Boden. Dies hilft, den Nacken in einer neutralen
    Position zu halten und unterstützt die visuelle Balance.'
  - '**Atmung und Konzentration:** Atme gleichmäßig und kontrolliert, um die durchgehende
    Körperspannung aufrechtzuerhalten. Konzentriere dich auf das Halten der Form und
    nutze minimale Anpassungen in Händen und Fingern.'
  common_errors:
  - '**"Bananenrücken" (Hyperlordose):** Ein durchhängender unterer Rücken entsteht
    durch fehlende Rumpf- und Gesäßspannung. Dies überstreckt die Lendenwirbelsäule,
    macht den Handstand instabil und erhöht das Verletzungsrisiko.'
  - '**Eingeknickte Ellbogen:** Nicht vollständig gestreckte und arretierte Arme vermindern
    die strukturelle Stabilität und belasten die Ellbogengelenke unnötig, anstatt
    die Last effizient über die Knochen zu leiten.'
  - '**Eingesunkene Schultern:** Wenn die Schultern nicht aktiv hochgeschoben und
    protrahiert werden ("in den Schultern hängen"), führt dies zu einer instabilen
    Schulterposition, die die Kraftübertragung mindert und die Gelenke überlastet.'
  - '**Verlorene Körperlinie in den Beinen:** Angewinkelte Knie, nicht gespitzte Füße
    oder auseinanderfallende Beine deuten auf mangelnde Ganzkörperspannung hin und
    unterbrechen die ideale, gerade Linie.'
  - '**Falsche Kopfposition:** Ein Blick nach vorne oben oder ein Überstrecken des
    Nackens destabilisiert die gesamte Körperlinie und beeinträchtigt die Balance
    erheblich. Der Nacken sollte neutral bleiben.'
  - '**Inaktive Hände und Finger:** Eine passive Handposition ohne aktives Greifen
    und Drücken in den Boden erschwert die feine Balancekontrolle und führt zu schnellem
    Verlust der Position.'
