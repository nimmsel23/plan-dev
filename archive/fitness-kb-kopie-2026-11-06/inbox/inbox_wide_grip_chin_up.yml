  instructions:
  - Grab the pull-up bar with the palms facing your torso and a grip closer than the
    shoulder width.
  - 'As you have both arms extended in front of you holding the bar at the chosen
    grip width, keep your torso as straight as possible while creating a curvature
    on your lower back and sticking your chest out. This is your starting position.
    Tip: Keeping the torso as straight as possible maximizes biceps stimulation while
    minimizing back involvement.'
  - 'As you breathe out, pull your torso up until your head is around the level of
    the pull-up bar. Concentrate on using the biceps muscles in order to perform the
    movement. Keep the elbows close to your body. Tip: The upper torso should remain
    stationary as it moves through space and only the arms should move. The forearms
    should do no other work other than hold the bar.'
  - After a second of squeezing the biceps in the contracted position, slowly lower
    your torso back to the starting position; when your arms are fully extended. Breathe
    in as you perform this portion of the movement.
  - Repeat this motion for the prescribed amount of repetitions.
  coaching_notes:
  - Der weite Untergriff-Klimmzug ist eine herausfordernde Variante, die den Latissimus
    noch stärker akzentuiert als der klassische Klimmzug im Untergriff. Eine saubere
    Technik ist entscheidend für optimale Muskelaktivierung und Gelenkschutz.
  - 'Beginnen Sie immer aus dem aktiven Hängen: Schultern leicht nach unten ziehen
    (Depression) und nicht passiv hängen lassen, um die Schulterblätter stabil zu
    positionieren und den Nacken zu schützen.'
  - Der primäre Fokus liegt auf dem Herunterziehen der Ellbogen in Richtung der Hüften
    oder Gesäßtaschen, um den Latissimus dorsi maximal zu rekrutieren. Stellen Sie
    sich vor, Sie ziehen das Gewicht mit dem Rücken nach oben, nicht nur mit den Armen.
  - 'Konzentrieren Sie sich auf die Bewegung der Schulterblätter: Eine leichte Depression
    und Retraktion leitet die Zugbewegung ein und stellt sicher, dass der obere Rücken
    als Motor arbeitet.'
  - Vermeiden Sie es, sich primär mit den Armen hochzuziehen. Die Arme sind Helfer
    (Synergisten), aber der Rücken (Latissimus) ist der Hauptakteur dieser Bewegung.
  - Halten Sie den gesamten Körper während der Ausführung stabil; eine aktivierte
    Rumpfmuskulatur (Bauch und Gesäß) verhindert Pendelbewegungen und schützt die
    Wirbelsäule.
  - Kontrollieren Sie die exzentrische Phase (das Ablassen) bewusst und langsam (2-3
    Sekunden). Dies maximiert den Muskelreiz und fördert den Muskelaufbau, während
    es gleichzeitig die Gelenke schont.
  - Atmen Sie beim Hochziehen (konzentrische Phase) aus und beim kontrollierten Ablassen
    (exzentrische Phase) ein.
  common_errors:
  - '**Unvollständige Bewegungsamplitude (Partial Reps)**: Nicht vollständig bis zur
    Armstreckung ablassen oder nicht hoch genug ziehen, um den Brustkorb über die
    Stange zu bringen. Dies limitiert die Muskelfaserrekrutierung und den Trainingsreiz.'
  - '**Schwungholen (Kipping)**: Die Nutzung von Hüft- und Beinbewegung, um sich nach
    oben zu schwingen. Kipping nimmt die Spannung von der Zielmuskulatur und erhöht
    das Verletzungsrisiko, insbesondere für Schultern und unteren Rücken.'
  - '**Passive Schultern oder Shrugging**: Passives Hängen mit hochgezogenen Schultern
    am unteren Punkt oder Hochziehen der Schultern zu den Ohren während der Bewegung.
    Dies überlastet den Nacken und reduziert die Effektivität für den Rücken.'
  - '**Fehlende Rumpfspannung**: Den Körper durchhängen lassen oder unkontrolliert
    schwingen. Ein instabiler Rumpf mindert die Kraftübertragung und erhöht das Verletzungsrisiko
    für die Wirbelsäule.'
  - '**Arm-dominierte Ausführung**: Sich primär mit Bizeps und Unterarmen hochziehen,
    ohne eine bewusste Aktivierung des Latissimus. Konzentrieren Sie sich darauf,
    die Ellbogen aktiv nach unten und hinten zu ziehen, um den Rücken als Hauptmuskel
    zu nutzen.'
  - '**Unkontrolliertes Ablassen**: Sich schnell fallen lassen anstatt die exzentrische
    Phase bewusst zu verlangsamen. Die negative Bewegung ist entscheidend für Muskelwachstum
    und sollte kontrolliert ausgeführt werden.'
  - '**Ellbogenführung**: Die Ellbogen nicht ausreichend nach unten und hinten zu
    führen oder sie zu weit seitlich auszustellen, was die Latissimus-Aktivierung
    reduziert und die Schultern unnötig belastet.'
  original_description:
  - Wie normale Klimmzüge, aber im Untergriff.
