  coaching_notes:
  - Halte die Oberarme während der gesamten Bewegung stabil und eng am Körper (oder
    in einer fixierten Ausgangsposition), um die Trizepsisolation zu maximieren.
  - Führe die Bewegung ausschließlich aus dem Ellbogengelenk aus. Dein Oberkörper
    bleibt fest und stabil, um unerwünschtes Schwungholen zu vermeiden.
  - Strecke die Arme vollständig, aber kontrolliert, bis der Trizeps maximal kontrahiert
    ist. Halte die Kontraktion kurz, bevor du langsam und kontrolliert in die Ausgangsposition
    zurückkehrst.
  - Konzentriere dich auf die Muskelverbindung und spüre, wie der Trizeps arbeitet,
    sowohl in der Streckung als auch beim kontrollierten Nachgeben in der exzentrischen
    Phase.
  - Wähle ein Kabelzug-Attachment (z.B. Seil, Stange), das dir eine optimale Gelenkschonung
    und Bewegungsfreiheit ermöglicht, und einen passenden Widerstand, der eine saubere
    Ausführung erlaubt.
  - Atme beim Strecken der Arme aus und beim kontrollierten Rückführen ein.
  common_errors:
  - 'Schwungholen durch den Oberkörper oder Miteinsatz der Schultern: Dies reduziert
    die Isolation des Trizeps und kann zu unnötiger Belastung anderer Gelenke führen.'
  - 'Unvollständige Bewegungsamplitude: Nicht vollständiges Strecken der Arme oder
    zu schnelles Nachgeben in der exzentrischen Phase schränkt den effektiven Trainingsreiz
    ein.'
  - 'Ellbogen nicht fixiert: Wenn die Ellbogen nach vorne oder zur Seite wandern,
    wird die Spannung vom Trizeps genommen und andere Muskeln involviert.'
  - 'Überstreckung der Ellbogen am Ende der Bewegung: Dies kann die Gelenke unnötig
    belasten. Halte eine leichte Beugung im Ellbogen am Endpunkt, um die Spannung
    auf dem Muskel zu halten.'
  - 'Zu hohes Gewicht: Führt oft zu den oben genannten Fehlern und einer ineffektiven
    Übungsausführung. Fokus liegt auf Muskelkontraktion, nicht auf dem maximal bewegten
    Gewicht.'
