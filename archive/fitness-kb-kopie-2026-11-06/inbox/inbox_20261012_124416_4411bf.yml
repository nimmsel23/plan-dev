  coaching_notes:
  - Legen Sie sich auf den Rücken, Knie angewinkelt und Füße flach am Boden, Arme
    seitlich ausgestreckt mit den Handflächen nach oben.
  - Halten Sie die Arme und Schulterblätter breit am Boden, während Sie die angewinkelten
    Knie langsam und kontrolliert von einer Seite zur anderen kippen.
  - Bremsen Sie den Richtungswechsel aktiv über die schrägen Bauchmuskeln ab, um Schwung
    zu vermeiden und die Kontrolle zu bewahren.
  - Wählen Sie nur so viel Bewegungsradius, wie Sie kontrollieren können, ohne dass
    sich der obere Rücken oder die Schultern vom Boden abheben.
  - Achten Sie darauf, den unteren Rücken während der gesamten Bewegung stabil und
    neutral zu halten und ein übermäßiges Hohlkreuz zu vermeiden.
  - Atmen Sie tief und gleichmäßig; atmen Sie aus, während die Beine zur Seite kippen,
    und atmen Sie ein, wenn sie zur Mitte zurückkehren.
  common_errors:
  - Die Schultern oder der obere Rücken heben sich vom Boden ab, was die Rotationskontrolle
    aus dem Rumpf nimmt.
  - Die Knie fallen einfach seitlich herunter, anstatt aktiv über die Bauchmuskeln
    kontrolliert zu werden und zurückgeholt zu werden.
  - Das Tempo ist zu hoch, wodurch Schwung genutzt wird und die Fähigkeit, den unteren
    Rücken sauber zu stabilisieren, verloren geht.
  - Der untere Rücken wird überstreckt oder rundet sich, anstatt eine neutrale Position
    zu bewahren.
  - Die Atmung wird angehalten oder ist flach, was die Rumpfstabilität beeinträchtigt.
