  coaching_notes:
  - Beginnen Sie in einer kontrollierten Sitzposition; optional können die Beine leicht
    angehoben werden, um die Rumpfaktivierung zu intensivieren.
  - Halten Sie den Rumpf während der gesamten Bewegung angespannt und leicht angehoben,
    um die Bauchmuskulatur kontinuierlich zu fordern.
  - Konzentrieren Sie sich auf eine flüssige und kontrollierte Übergabe des Balls
    von einer Hand zur anderen, weit hinter dem Rücken.
  - Leiten Sie die Rotation aus dem Brustkorb und den Rippen ein, nicht primär aus
    den Schultern oder Armen. Der Blick folgt idealerweise der Bewegung des Rumpfes.
  - Achten Sie auf eine gleichmäßige Rotationsamplitude zu beiden Seiten und vermeiden
    Sie ruckartige oder kompensatorische Bewegungen.
  - 'Atmen Sie kontrolliert: beim Rotieren ausatmen und beim Zurückführen zur Mitte
    einatmen, um die Rumpfstabilität zu unterstützen.'
  - Falls kein Ball verfügbar ist, kann die Bewegung auch mit einer imaginären Übergabe
    zur Schulung der Koordination und Rumpfrotation ausgeführt werden.
  common_errors:
  - '**Unkontrolliertes Tempo:** Die Bewegung wird zu schnell ausgeführt, was zu unsauberen
    Ballübergaben, einem Verlust der Rumpfkontrolle und geringerer Muskelaktivierung
    führt.'
  - '**Verlust der Rumpfspannung:** Der Oberkörper fällt zwischen den Übergaben jedes
    Mal vollständig ab, anstatt die Rumpfspannung konstant zu halten und die Bauchmuskeln
    aktiv zu nutzen.'
  - '**Rotation nur aus den Armen:** Die Rumpfrotation ist unzureichend, und die Bewegung
    wird hauptsächlich durch das Kreisen der Arme statt durch die gezielte Arbeit
    der schrägen Bauchmuskeln initiiert.'
  - '**Rundrücken oder Hohlkreuz:** Eine schlechte Haltung der Wirbelsäule, die entweder
    zu einem Rundrücken (thorakale Flexion) oder einem übertriebenen Hohlkreuz (lumbale
    Extension) führt und die Effektivität des Rumpftrainings reduziert.'
  - '**Unvollständige Übergaben:** Der Ball wird nicht vollständig hinter dem Rücken
    von Hand zu Hand übergeben, was die Rotationsamplitude einschränkt und die Zielmuskulatur
    weniger effektiv fordert.'
