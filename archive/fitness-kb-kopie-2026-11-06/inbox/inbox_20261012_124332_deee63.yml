  instructions:
  - 'Grab the pull-up bar with the palms facing forward using the prescribed grip.
    Note on grips: For a wide grip, your hands need to be spaced out at a distance
    wider than your shoulder width. For a medium grip, your hands need to be spaced
    out at a distance equal to your shoulder width and for a close grip at a distance
    smaller than your shoulder width.'
  - As you have both arms extended in front of you holding the bar at the chosen grip
    width, bring your torso back around 30 degrees or so while creating a curvature
    on your lower back and sticking your chest out. This is your starting position.
  - 'Pull your torso up until the bar touches your upper chest by drawing the shoulders
    and the upper arms down and back. Exhale as you perform this portion of the movement.
    Tip: Concentrate on squeezing the back muscles once you reach the full contracted
    position. The upper torso should remain stationary as it moves through space and
    only the arms should move. The forearms should do no other work other than hold
    the bar.'
  - After a second on the contracted position, start to inhale and slowly lower your
    torso back to the starting position when your arms are fully extended and the
    lats are fully stretched.
  - Repeat this motion for the prescribed amount of repetitions.
  coaching_notes:
  - 'Starte jede Wiederholung aus einem aktiven Hang: Hals lang, Schultern bewusst
    nach unten ziehen (Scapula-Depression), Rippen unten, Bauch und Gesäß leicht anspannen
    für einen stabilen Rumpf.'
  - 'Arbeite über die volle, kontrollierte Bewegungsfreiheit (ROM): Unten sauber strecken
    (aktiver Hang), oben den Brustkorb zur Leiste bringen, ohne die Rumpfspannung
    zu verlieren oder die Schultern nach vorne fallen zu lassen.'
  - Fokussiere den Zug auf deinen oberen Rücken und Latissimus. Ziehe die Ellenbogen
    bewusst in Richtung deiner Hüften oder Flanken, statt nur die Arme zu beugen.
  - Steuere auch die exzentrische Phase bewusst. Ein langsames, kontrolliertes Absenken
    maximiert die Zeit unter Spannung und verbessert die Sehnenfestigkeit sowie die
    Schulterkontrolle.
  - Vermeide jegliches Schwingen (Kipping) oder das Einsetzen von Beinschwung. Jede
    Wiederholung sollte kontrolliert und aus reiner Oberkörperkraft erfolgen.
  - Achte auf eine präzise Fingerpositionierung an der Leiste. Die Gelenke sollten
    stabil sein, der Druck gleichmäßig verteilt, um Überlastung von Sehnen und Gelenken
    zu vermeiden.
  - Die Handgelenke sollten während der gesamten Bewegung stabil und leicht gestreckt
    bleiben, um eine effiziente Kraftübertragung zu gewährleisten.
  - Führe vor dem Training an der Leiste ein spezifisches Aufwärmprogramm für Finger,
    Handgelenke und Unterarme durch, um das Verletzungsrisiko zu minimieren.
  - 'Wähle die Leistengröße entsprechend deinem Trainingsstand: größere, fingerfreundlichere
    Leisten für Anfänger, kleinere oder spezifische Griffarten für Fortgeschrittene.'
  common_errors:
  - 'Beginn aus einem passiven Hang: Das Anziehen aus entspannten Schultern kann zu
    übermäßiger Belastung der Gelenke und einer ineffektiven Aktivierung der Rückenmuskulatur
    führen.'
  - 'Unvollständige Bewegungsfreiheit: Nicht vollständiges Strecken der Arme am unteren
    Punkt oder nicht vollständiges Hochziehen des Brustkorbs zur Leiste reduziert
    den Trainingsreiz und die Entwicklung der Kraft.'
  - 'Schultern zu den Ohren ziehen: Dies signalisiert eine Überlastung der oberen
    Nackenmuskulatur und einen Verlust der optimalen Schulterblattposition für den
    Zug.'
  - 'Kipping oder Beinschwung: Die Nutzung von Schwung anstelle von Muskelkraft reduziert
    den Trainingseffekt erheblich und erhöht das Verletzungsrisiko, insbesondere an
    den Fingersehnen und Schultern.'
  - 'Verlust der Rumpfspannung (Hohlkreuz / Rippen aufklappen): Eine instabile Körpermitte
    führt zu Energieverlust und kann die Wirbelsäule unnötig belasten.'
  - 'Nur das Kinn über die Leiste bringen: Anstatt den Brustkorb zur Leiste zu ziehen,
    wird oft versucht, nur das Kinn zu erreichen, was die Haltung beeinträchtigt und
    den vollen Trainingsreiz mindert.'
  - 'Krampfartiger Griff oder Überkrallen: Zu starkes Krallen oder Verkrampfen der
    Finger und Unterarme führt zu schneller Ermüdung der Griffkraft und kann die Technik
    negativ beeinflussen.'
  - 'Mangelndes spezifisches Aufwärmen: Das Ignorieren eines gezielten Aufwärmprogramms
    für Finger, Handgelenke und Unterarme erhöht das Risiko von Sehnen- und Gelenkverletzungen
    erheblich.'
  - 'Wahl einer ungeeigneten Leistengröße: Die Verwendung einer zu kleinen oder schwierigen
    Leiste ohne ausreichende Vorbereitung kann zu einer gefährlichen Überlastung der
    Fingersehnen und Gelenke führen.'
