# Nur Woerter mit einer verlustfreien 1:1-Ziel-ID (echte Parent-ID in der
# Taxonomie, keine Auswahl aus mehreren gleichwertigen Kandidaten). Die
# uebrigen der urspruenglich 17 wger/yuhonas-Flach-Woerter (chest, shoulders,
# hamstrings, calves, glutes, abdominals, abductors, forearms, "lower back",
# "middle back", neck, traps) decken 2-8 Einzelmuskeln ab, ohne dass die
# Quelle verraet welchen genau — eine automatische Zuordnung waere geraten.
# Bewusst NICHT hier eingetragen: bleiben als roher Quell-String stehen, bis
# ein Review (Gemini/Mensch) die Uebung tatsaechlich pruezisiert.
string_aliases:
  adductors:   602_adductors
  biceps:      402_biceps_brachii
  lats:        201_latissimus_dorsi
  quadriceps:  601_quadriceps_femoris
  triceps:     401_triceps_brachii
  # Ergaenzt 2026-09-01 fuer den source-consistency-Audit (siehe
  # fitness/catalog/core/audit/source_consistency.py): yuhonas' rohe
  # primary_muscles/secondary_muscles-Namen sind freie englische
  # Muskelgruppen-Labels, ohne Aliase hier bleiben sie unkanonisiert und
  # tragen nichts zur Quellen-Abgleichung bei (jeder Vergleich schlaegt
  # dann faelschlich als "unbelegt" fehl). Ziel-Id = groesster/haeufigster
  # Muskel der jeweiligen Gruppe, nicht jede moegliche Untergruppe.
  # ACHTUNG "shoulders" bewusst NICHT hier aliasen: refine_generic_region_
  # labels() (muscle_normalization.py) weist den generischen "shoulders"-
  # Namen je nach Uebungsname gezielt einem Deltoid-Kopf zu (z.B.
  # "Frontheben" -> anterior). Ein Alias hier wuerde diese kontextsensitive
  # Zuordnung kurzschliessen (siehe test_inbox_actions.py's
  # test_*_normalizes_coarse_shoulder_label_by_name) und IMMER lateral_
  # deltoid erzwingen, auch wenn der Uebungsname klar was anderes zeigt.
  abdominals:  501_rectus_abdominis
  abductors:   608_gluteus_medius
  calves:      701_gastrocnemius
  chest:       101_pectoralis_major
  forearms:    405_forearm_flexors
  glutes:      603_gluteus_maximus
  hamstrings:  604_hamstrings
  lower_back:  206_erector_spinae
  middle_back: 205_rhomboids
  traps:       202_trapezius

wger_groups:
  # wger unterscheidet pro Muskel-ID KEINE Teilköpfe/-anteile — ein Import,
  # der auf eine Liste mehrerer spezifischer Teilmuskeln expandiert (z.B.
  # 4 -> Pectoralis major UND Clavicular- UND Sternal-Kopf gleichzeitig),
  # behauptet mehr Praezision als die Quelle je hatte. Fuer 4/5/7/10 existiert
  # eine echte, verlustfreie Parent-ID in der Taxonomie -> nur die nutzen.
  # 9 und 11 hatten urspruenglich dieselbe Luecke (kein Parent, nur die
  # Mehrfach-Liste ihrer Anteile) — seit der Trapezius-/Hamstrings-
  # Restrukturierung (202_trapezius/604_hamstrings als echte Parent-IDs,
  # siehe muscles/back/202_trapezius.yml bzw. muscles/legs/604_hamstrings.yml)
  # nutzt 11 jetzt ebenfalls eine verlustfreie Parent-ID. 9 bleibt eine
  # Mehrfach-Liste, weil wger_id 9 zusaetzlich 303_posterior_deltoid
  # (ein Deltoid-Kopf, keine Trapezius-Faser) mit demselben Rohwert
  # zusammenwirft — das ist eine wger-Datenungenauigkeit, kein Taxonomie-Fall.
  1:  [402_biceps_brachii]
  2:  [301_anterior_deltoid]
  3:  [105_serratus_anterior]
  4:  [101_pectoralis_major]
  5:  [401_triceps_brachii]
  6:  [501_rectus_abdominis]
  7:  [701_gastrocnemius]
  8:  [603_gluteus_maximus]
  9:  [202_trapezius, 303_posterior_deltoid]
  10: [601_quadriceps_femoris]
  11: [604_hamstrings]
  12: [201_latissimus_dorsi]
  13: [403_brachialis]
  14: [502_obliquus_externus, 503_obliquus_internus]
  15: [702_soleus]
  16: [206_erector_spinae]
