lessons:
  - exercise_id: 603
    title: "Ab Wheel - Anti-Extension verstehen"
    region: core
    learning_goal:
      short: "Der Trainer lernt, wie Anti-Extension den Rumpf stabilisiert."
      detailed: "Das Ab Wheel zeigt, wie Core, Schultergürtel und Rücken gemeinsam ein Durchhängen verhindern."
    movement_pattern:
      primary: anti_extension
      secondary:
        - shoulder_flexion_control
    joint_actions:
      shoulder:
        eccentric:
          - flexion_control
        concentric:
          - flexion_assist
        stabilization:
          - humeral_head_control
    muscle_roles:
      prime_movers:
        - core
      synergists:
        - shoulders
      stabilizers:
        - back
    body_highlighter_regions:
      primary:
        - abdomen_front
      secondary:
        - shoulders_front
      light:
        - lower_back
    trainer_explanation:
      simple: "Der Rumpf hält die Linie, während die Arme nach vorne rollen."
      technical: "Anti-Extension verlangt isometrische Rumpfspannung gegen Lendenwirbelsäulen-Extension."
      client_friendly: "Halte den Bauch fest, damit der Rücken nicht ins Hohlkreuz fällt."
    feel_cues:
      - "Bauchspannung vorne."
      - "Schultern arbeiten ruhig nach vorne."
    coaching_cues:
      - "Rippen unten."
      - "Nur so weit rollen, wie du stabil bleibst."
      - "Becken nicht kippen lassen."
    common_errors:
      - error: "Hohlkreuz durchdrücken."
        anatomical_reason: "Die Rumpfspannung reicht nicht aus, um die Extension zu kontrollieren."
        correction: "Bewegungsradius verkleinern und Spannung vor dem Rollen aufbauen."
        coaching_cue: "Rippen runter, Bauch fest."
    variations_teach:
      - variation: "Knee rollout"
        lesson: "Die kürzere Hebellänge erleichtert die Anti-Extension."
    quiz:
      - question: "Was ist die Hauptlektion des Ab Wheel?"
        answer: "Der Rumpf muss Extension verhindern und die Linie stabil halten."
