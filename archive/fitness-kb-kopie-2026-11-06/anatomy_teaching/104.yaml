lessons:
  - exercise_id: 104
    title: "Dips - Brustfokus und Schulterkontrolle"
    region: chest
    learning_goal:
      short: "Dips zeigen, wie Brust, Trizeps und Schultergürtel zusammenarbeiten."
      detailed: "Die Übung macht deutlich, wie Körperwinkel die Muskelbeteiligung verändert."
    movement_pattern:
      primary: dip_press
      secondary:
        - scapular_control
    joint_actions:
      shoulder:
        eccentric:
          - extension_control
        concentric:
          - horizontal_adduction_assist
        stabilization:
          - humeral_head_control
      elbow:
        eccentric:
          - flexion_control
        concentric:
          - extension
        stabilization:
          - alignment_control
    muscle_roles:
      prime_movers:
        - chest
      synergists:
        - shoulders
      stabilizers:
        - arms
    body_highlighter_regions:
      primary:
        - chest_front
      secondary:
        - upper_arm_back
      light:
        - shoulders_front
    trainer_explanation:
      simple: "Mit Vorneigung arbeitet die Brust stärker."
      technical: "Die Schulter- und Scapulaposition verschieben die Last auf den Pectoralis major."
      client_friendly: "Lehn dich leicht vor und drück aus Brust und Armen hoch."
    feel_cues:
      - "Dehnung vorne in Brust und Schulter."
      - "Druck aus der Brust beim Hochkommen."
    coaching_cues:
      - "Brust stolz."
      - "Nicht in den Schultern hängen."
      - "Kontrollierte Tiefe."
    common_errors:
      - error: "Schulter dumpft nach vorne."
        anatomical_reason: "Die Schulterblattkontrolle bricht in der Tiefe weg."
        correction: "Tiefe begrenzen und Schultergürtel aktiv halten."
        coaching_cue: "Schultern stabil, nicht einfallen lassen."
    variations_teach:
      - variation: "Chest-dominant dip"
        lesson: "Mehr Vorneigung erhöht den Brustanteil."
    quiz:
      - question: "Was verändert den Brustanteil bei Dips?"
        answer: "Der Vorneigungswinkel und die Schulterblattkontrolle."
