packages:
  - "."
allowBuilds:
  '@firebase/util': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
# CI-Standalone: vite nutzt preserveSymlinks, Pakete wie firebase (@firebase/*) oder recharts (clsx) lösen ihre
# Abhängigkeiten über das oberste node_modules auf (im Meta-Repo kam das durch den Workspace-Hoist).
publicHoistPattern:
  - '*'

overrides:
  "rollup": "4.68.0"
  "rolldown": "1.3.0"
  "vite": "8.3.6"
  "@vitejs/plugin-react": "6.2.1"
  "framer-motion": "14.10.1"
  "@firebase/util": "^1.12.1"
  "@grpc/grpc-js@<1.13.6": "^1.14.6"
