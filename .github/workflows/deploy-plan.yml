# Deploy der Plan-App (Firebase Hosting, Target `plan` -> https://vos-plan.web.app)
# bei jedem Push auf `dev`, der Frontend-Code berührt.
#
# Ersetzt die geerbten Fitness-Workflows (liegen jetzt in workflows.disabled/):
# die bauten die Fitness-App über das vitalos-Meta-Repo, nicht die Plan-App.
# Firestore-Rules werden hier nie deployed (SSOT: ~/vitalos/firestore.rules).
#
# Einmalig nötig: Repo-Secret FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS
# (Service-Account-JSON, Rolle "Firebase Hosting Admin", Projekt fitness-aos).
# Fehlt das Secret, baut der Job nur und überspringt den Deploy mit Warnung.
#
# PR-Weg (wie fitness-dev): PR -> eigener PR-Channel mit Kommentar, dev-Push -> Channel dev.
#
# PREVIEW statt Live (Regel 2026-10-16): echte Prod-URLs (vos-*.web.app) werden nur noch
# aus den Meta-Repo-Pins (`*-app` auf origin/master) (~/vitalos/*-app) deployt. Dieser
# Workflow veröffentlicht auf dem Branch `dev` ausschließlich einen 24h-Preview-Channel `dev`.

name: Preview Plan

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'plan.html'
      - 'public/**'
      - '6pack/**'
      - 'fitness/catalog/kb/**'
      - 'scripts/**'
      - 'vite.config.js'
      - 'tailwind.config.cjs'
      - 'postcss.config.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'firebase.json'
      - 'firebase.config.js'
      - '.github/workflows/deploy-plan.yml'
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/*.bak*'
      - '!docs/**'
  pull_request:
    branches: [master, dev, coach]
    paths:
      - 'src/**'
      - 'plan.html'
      - 'public/**'
      - '6pack/**'
      - 'fitness/catalog/kb/**'
      - 'scripts/**'
      - 'vite.config.js'
      - 'tailwind.config.cjs'
      - 'postcss.config.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'firebase.json'
      - 'firebase.config.js'
      - '.github/workflows/deploy-plan.yml'
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/*.bak*'
      - '!docs/**'

concurrency:
  group: deploy-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      # Gemeinsame Quellen: plan-dev/src liegt per Overlay über fitness-dev/src
      # (vite-fitness-overlay.mjs). Der Stand steht in fitness.ref (Branch oder Commit-SHA).
      - name: fitness-dev-Stand lesen
        id: fitref
        run: echo "ref=$(tr -d '[:space:]' < fitness.ref)" >> "$GITHUB_OUTPUT"

      - name: fitness-dev auschecken
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/fitness-dev
          ref: ${{ steps.fitref.outputs.ref }}
          path: .fitness-dev
          token: ${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: FITNESS_ROOT setzen
        run: echo "FITNESS_ROOT=$GITHUB_WORKSPACE/.fitness-dev" >> "$GITHUB_ENV"

      # KB-SOT: nimmsel23/fitness (fitness-dev-Pin kann das Paket schon nicht mehr haben).
      - name: Checkout fitness KB (SOT)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/fitness
          ref: main
          path: fitness-kb
          submodules: recursive

      - name: KB einhängen + FITNESS_KB_DIR
        run: |
          set -euo pipefail
          mkdir -p .fitness-dev/fitness/catalog
          rm -rf .fitness-dev/fitness/catalog/kb
          ln -sfn "$GITHUB_WORKSPACE/fitness-kb" .fitness-dev/fitness/catalog/kb
          test -d .fitness-dev/fitness/catalog/kb/exercises/6pack
          echo "FITNESS_KB_DIR=$GITHUB_WORKSPACE/fitness-kb" >> "$GITHUB_ENV"
          echo "KB @ $(git -C fitness-kb rev-parse --short HEAD)"

      # 6pack-dev ist Quelle fuer @6pack/sixpack.css (vite siblingDir): als Nachbar
      # neben dem Workspace klonen — wie Check (Plan) und Live Deploy bereits tun;
      # ohne diesen Schritt bricht der Preview-Build mit ENOENT sixpack.css.
      - name: Nachbar 6pack-dev auschecken
        run: |
          git clone --depth 1 --branch master \
            "https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/nimmsel23/6pack-dev.git" \
            "$GITHUB_WORKSPACE/../6pack-dev"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # @vos/cross-app-aliases (workspace:*) existiert nur im vitalos-Monorepo und steht
      # nicht im Lockfile; vite.config.js hat dafür einen Fallback. Hoisted-Linker, weil
      # vite.config.js preserveSymlinks nutzt und das reine pnpm-Layout damit nicht baut.
      - name: Install
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));for(const k of ['dependencies','devDependencies','optionalDependencies'])delete p[k]?.['@vos/cross-app-aliases'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          pnpm install --frozen-lockfile --ignore-scripts --config.node-linker=hoisted

      # *.generated.js sind gitignored und werden vom Plan-Build nicht selbst erzeugt
      - name: KB-Daten generieren
        run: pnpm run build:kb-data

      - name: Build (Plan)
        run: pnpm run build:firebase:plan

      - name: Hinweis - Secret fehlt
        if: env.FIREBASE_SA == ''
        run: echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS fehlt (oder Fork-PR) - Deploy übersprungen."

      - name: Preview hosting:plan (dev-Push -> Channel dev, PR -> PR-Channel, 24h)
        if: env.FIREBASE_SA != ''
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SA }}
          projectId: fitness-aos
          target: plan
          channelId: ${{ github.event_name != 'pull_request' && 'dev' || '' }}
          expires: 24h
