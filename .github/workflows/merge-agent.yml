name: Merge-Agent

# Automatisches Mergen offener PRs auf die Ziel-Branches (TARGET_BRANCHES,
# z. B. "vitalos master" fuer die Sync-PRs master -> vitalos). Der Agent weist
# keine PRs ab und closed nie einen PR: mergebar + vorhandene Checks gruen
# (oder keine Checks) -> Squash-Merge; Konflikte -> gh pr update-branch, sonst
# nur ein [merge-agent]-Kommentar (einmalig pro PR).
# Head-Branch wird nur bei dependabot/* nach dem Merge geloescht (niemals
# master/dev/vitalos/main - die Sync-PRs haben master als Head!).
# Trigger: pull_request, Cron alle 15 Min. (nur auf dem Default-Branch aktiv),
# workflow_dispatch. Cron als Minutenliste, weil GitHub "*/15 * * * *" als
# ungueltig ablehnt und das ganze Workflow-File dann nicht mehr laedt.
# Token: SYNC_TOKEN falls als Secret vorhanden (PAT; Merges loesen dann die
# Push-Deploys aus), sonst GITHUB_TOKEN (Merge feuert keine Push-Workflows).

on:
  pull_request:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

concurrency:
  group: merge-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  TARGET_BRANCHES: "vitalos master"
  GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Token vorhanden?
        run: test -n "$GH_TOKEN" || { echo "::error::Weder SYNC_TOKEN noch GITHUB_TOKEN verfuegbar"; exit 1; }

      - name: Offene PRs je Ziel-Branch bearbeiten
        run: |
          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"

          comment() {
            local pr="$1" body="$2"
            # Pro PR nur ein Agent-Kommentar (Marker), damit es nicht spammt
            if gh api "repos/$repo/issues/$pr/comments?per_page=100" \
                --jq '.[] | select(.body | contains("[merge-agent]")) | .id' 2>/dev/null | grep -q .; then
              return 0
            fi
            gh api -X POST "repos/$repo/issues/$pr/comments" \
              -f body="[merge-agent] $body" >/dev/null
          }

          for base in $TARGET_BRANCHES; do
            gh pr list -R "$repo" --base "$base" --state open \
              --json number,title,headRefName,headRefOid,headRepositoryOwner,mergeable,mergeStateStatus,isDraft \
              --jq ".[] | select(.isDraft == false) | select(.headRepositoryOwner.login == \"$owner\") | [.number, .headRefName, .headRefOid, .mergeable, .mergeStateStatus, .title] | @tsv" \
              2>/dev/null | while IFS=$'\t' read -r pr head sha mergeable state title; do
              echo "::group::PR #$pr ($title) base=$base head=$head mergeable=$mergeable state=$state"

              conclusions=$(gh api "repos/$repo/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | .conclusion] | join(" ")' 2>/dev/null || true)
              states=$(gh api "repos/$repo/commits/$sha/status?per_page=100" --jq '[.statuses[] | .state] | join(" ")' 2>/dev/null || true)
              failed=$(printf '%s %s\n' "$conclusions" "$states" | tr ' ' '\n' | grep -E '^(failure|cancelled|timed_out|error)$' || true)

              if [ -n "$failed" ]; then
                comment "$pr" "Check rot - PR #$pr bleibt offen und wird nicht abgewiesen. Bitte Check fixen, der Agent merged danach automatisch."
                echo "::endgroup::"; continue
              fi

              if [ "$mergeable" != "MERGEABLE" ]; then
                if gh pr update-branch "$pr" -R "$repo" --merge 2>/dev/null; then
                  echo "Base $base in PR #$pr uebernommen - naechster Lauf prueft erneut."
                else
                  comment "$pr" "Nicht mergebar ($state) - PR #$pr bleibt offen. Bitte Konflikte/Bloecke manuell aufloesen, der Agent merged danach automatisch."
                fi
                echo "::endgroup::"; continue
              fi

              args=(--squash)
              case "$head" in dependabot/*) args+=(--delete-branch) ;; esac
              if gh pr merge "$pr" -R "$repo" "${args[@]}"; then
                echo "PR #$pr gemergt (Squash)."
              else
                comment "$pr" "Merge von PR #$pr fehlgeschlagen - PR bleibt offen und wird nicht abgewiesen."
              fi
              echo "::endgroup::"
            done
          done
