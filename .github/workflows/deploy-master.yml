# Standalone-Prod Plan: Push auf master deployt live (nur CI). Gleiche Schritte wie das frühere
# Meta-Repo-Workflow deploy-plan.yml; das Meta-Repo liefert nur die Nachbar-Repos (Cross-Repo-Aliase),
# plan-app wird auf den ausgelösten Commit gesetzt.

name: Live Deploy (Plan master)
'on':
  workflow_dispatch: null
  push:
    branches:
    - master
concurrency:
  group: live-plan-master
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout vitalos (Meta-Repo, liefert Nachbar-Repos)
      uses: actions/checkout@v4
      with:
        repository: nimmsel23/vitalos
        ref: master
    - name: Private Skills submodule access
      uses: ./.github/actions/skills-submodule-auth
      with:
        deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}
    - name: Submodules via HTTPS + Token
      run: |
        git config --global url."https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
        git submodule sync
        git submodule update --init --recursive
    - name: plan-app auf den ausgelösten Commit setzen
      run: |
        cd plan-app
        SHA="${{ github.sha }}"
        git fetch origin "$SHA"
        git checkout "$SHA"
    - uses: pnpm/action-setup@v4
      with:
        version: 11.3.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install (Workspaces)
      run: pnpm install --no-frozen-lockfile
    - name: Build Plan
      run: pnpm --filter ./plan-app run build:firebase
    - name: Deploy Plan to Firebase Hosting
      run: |
        cd plan-app
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}' > /tmp/sa.json
        GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
          npx firebase-tools@latest deploy --only hosting:plan \
          --project fitness-aos --non-interactive
